<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Spin Hall drift-diffusion at a heavy-metal ferromagnet interface</title>
  <desc id="desc">A conventional charge current flows along x in the heavy metal. The spin Hall effect creates spin-current flow along the interface normal z, with spin polarization along y out of the page. Transverse spin absorbed at the interface torques the ferromagnet magnetization.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07151e"/>
      <stop offset="1" stop-color="#0b2230"/>
    </linearGradient>
    <linearGradient id="hm" x1="0" x2="1">
      <stop stop-color="#123b57"/>
      <stop offset="1" stop-color="#176c80"/>
    </linearGradient>
    <linearGradient id="fm" x1="0" x2="1">
      <stop stop-color="#a83f27"/>
      <stop offset="1" stop-color="#db842f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02080d" flood-opacity=".38"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0v10l11-5z" fill="#72d7e8"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0v10l11-5z" fill="#ffd166"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0v10l11-5z" fill="#ff7666"/>
    </marker>
    <marker id="arrow-white" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0 0v10l10-5z" fill="#f4fbff"/>
    </marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#edf8fb}
      .title{font-size:32px;font-weight:700;letter-spacing:.2px}
      .subtitle{font-size:18px;fill:#a9c6d2}
      .band{font-size:27px;font-weight:700}
      .section{font-size:18px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;fill:#b9d5de}
      .body{font-size:20px}
      .small{font-size:17px;fill:#c5dbe3}
      .math{font-family:"Cambria Math","STIX Two Math",serif;font-size:24px}
      .math-small{font-family:"Cambria Math","STIX Two Math",serif;font-size:19px}
      .sub{font-size:15px;baseline-shift:sub}
      .sup{font-size:15px;baseline-shift:super}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#background)"/>

  <text x="70" y="58" class="title">Spin Hall drift-diffusion at an HM/FM interface</text>
  <text x="70" y="88" class="subtitle">Flow direction, spin polarization, interface orientation, and absorbed transverse spin</text>

  <rect x="70" y="120" width="1260" height="240" rx="22" fill="url(#fm)" filter="url(#shadow)"/>
  <rect x="70" y="395" width="1260" height="270" rx="22" fill="url(#hm)" filter="url(#shadow)"/>

  <rect x="100" y="145" width="245" height="48" rx="24" fill="#762b21" fill-opacity=".72"/>
  <text x="122" y="178" class="band">FM  ferromagnet</text>
  <rect x="100" y="420" width="255" height="48" rx="24" fill="#082f48" fill-opacity=".78"/>
  <text x="122" y="453" class="band">HM  heavy metal</text>

  <line x1="70" y1="378" x2="1330" y2="378" stroke="#f4fbff" stroke-width="4" stroke-dasharray="14 10"/>
  <rect x="95" y="356" width="225" height="42" rx="21" fill="#07151e"/>
  <text x="116" y="383" class="small">oriented HM/FM interface</text>

  <text x="145" y="505" class="section">Charge transport</text>
  <line x1="150" y1="555" x2="505" y2="555" class="line" stroke="#72d7e8" stroke-width="8" marker-end="url(#arrow-cyan)"/>
  <text x="150" y="605" class="math">
    J<tspan class="sub">c</tspan> &#x2225; E
    <tspan dx="10">and</tspan>
    <tspan dx="10">E = &#x2212;&#x2207;V</tspan>
  </text>
  <text x="150" y="634" class="small">conventional current; reversing it reverses the direct-SHE source</text>

  <text x="545" y="485" class="section">Spin-current flow</text>
  <line x1="650" y1="590" x2="650" y2="315" class="line" stroke="#ffd166" stroke-width="9" marker-end="url(#arrow-gold)"/>
  <circle cx="650" cy="378" r="21" fill="#ffd166" stroke="#fff1b8" stroke-width="4"/>
  <text x="548" y="535" class="math">
    Q<tspan class="sub">ia</tspan>
  </text>
  <text x="548" y="565" class="small">flow index i along +n</text>

  <line x1="735" y1="430" x2="735" y2="300" class="line" stroke="#f4fbff" stroke-width="5" marker-end="url(#arrow-white)"/>
  <text x="760" y="328" class="math">n&#x0302;</text>
  <text x="760" y="355" class="small">HM &#x2192; FM</text>

  <g aria-label="spin accumulation near the interface">
    <circle cx="475" cy="419" r="8" fill="#ffd166" opacity=".45"/>
    <circle cx="505" cy="426" r="10" fill="#ffd166" opacity=".62"/>
    <circle cx="537" cy="414" r="8" fill="#ffd166" opacity=".78"/>
    <circle cx="568" cy="425" r="11" fill="#ffd166" opacity=".92"/>
    <circle cx="600" cy="414" r="9" fill="#ffd166"/>
  </g>
  <text x="390" y="462" class="math-small">
    spin accumulation &#x03BC;<tspan class="sub">s</tspan>
  </text>

  <rect x="835" y="438" width="445" height="184" rx="18" fill="#082a3a" stroke="#3f8698" stroke-width="2"/>
  <text x="865" y="475" class="section">Spin Hall polarization</text>
  <circle cx="895" cy="530" r="25" fill="none" stroke="#ff7666" stroke-width="5"/>
  <circle cx="895" cy="530" r="7" fill="#ff7666"/>
  <text x="935" y="526" class="math">
    &#x03C3;&#x0302; &#x221D; &#x03B8;<tspan class="sub">SH</tspan>
    (n&#x0302; &#x00D7; E&#x0302;)
  </text>
  <text x="935" y="561" class="body">for n&#x0302; = +z&#x0302; and E&#x0302; = +x&#x0302;</text>
  <text x="935" y="594" class="body" fill="#ffb4aa">&#x03C3;&#x0302; = +y&#x0302;  out of the page</text>

  <text x="790" y="165" class="section">Magnetization response</text>
  <line x1="845" y1="278" x2="1135" y2="188" class="line" stroke="#ff7666" stroke-width="9" marker-end="url(#arrow-coral)"/>
  <text x="1155" y="190" class="math">m</text>

  <path d="M735 300 C790 205 900 200 955 286" class="line" stroke="#ffd166" stroke-width="6" marker-end="url(#arrow-gold)"/>
  <text x="755" y="235" class="body">absorbed transverse spin</text>
  <text x="965" y="302" class="math">
    T<tspan class="sub">tr,G</tspan>
  </text>
  <text x="1000" y="330" class="small">torque on the FM</text>

  <rect x="70" y="700" width="1260" height="78" rx="18" fill="#061018" stroke="#274554" stroke-width="2"/>
  <text x="100" y="733" class="math-small">
    Tensor convention: Q<tspan class="sub">ia</tspan>
    <tspan dx="8">has flow direction i and spin-polarization component a.</tspan>
  </text>
  <text x="100" y="762" class="small">e &gt; 0  |  Jc is conventional current  |  the polarization marker &#x2299; means out of the page</text>

  <g transform="translate(1195 735)" aria-label="coordinate key">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ff7666" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#ff7666"/>
    <text x="18" y="6" class="math-small">+y&#x0302;</text>
    <line x1="0" y1="0" x2="72" y2="0" stroke="#72d7e8" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <text x="76" y="6" class="math-small">+x&#x0302;</text>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#f4fbff" stroke-width="3" marker-end="url(#arrow-white)"/>
    <text x="-8" y="-57" class="math-small">+z&#x0302;</text>
  </g>
</svg>
