      .axis-lbl { font: 600 12px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #334155; }
    </style>
    
  </defs>
  <rect x="4" y="4" width="1352" height="752" rx="10" fill="#fbfcfe" stroke="#ccd0da" stroke-width="1.5"/>
  <text x="28" y="34" class="fig-title">Fullmag Spin-Orbit Torque Architecture: Prescribed Local SOT vs M1 vs M2</text>
  <text x="28" y="54" class="fig-subtitle">Models start at different physical boundaries — setting ξ_DL = θ_SH does not make Prescribed SOT equivalent to M1 or M2</text>
  <line x1="24" y1="66" x2="1336" y2="66" stroke="#d6dde8" stroke-width="1.2"/>
  <rect x="24.0" y="80.0" width="420.0" height="514.0" rx="8" fill="#ffffff" stroke="#d6dde8" stroke-width="1.3"/>
  <rect x="38.0" y="92.0" width="26" height="22" rx="5" fill="#246b8e"/>
  <text x="51.0" y="107.5" text-anchor="middle" class="badge-text">a</text>
  <text x="73.0" y="108.0" class="panel-title">Prescribed Local SOT (reduced law)</text>
  <text x="40.0" y="132.0" class="small">Starts at final local torque; no charge/spin PDE or HM mesh</text>
  <rect x="42.0" y="146.0" width="384.0" height="94.0" rx="6" fill="#f4f7fb" stroke="#246b8e" stroke-width="1.4"/>
  <text x="54.0" y="167.0" class="body-bold" fill="#246b8e">1. Authoring &amp; Drive Selection</text>
  <text x="54.0" y="185.0" class="mono-sm">PrescribedSpinOrbitTorque(name, target, ...)</text>
  <text x="54.0" y="200.5" class="mono-sm">  SignedScalarDrive(J_0, sigma, envelope)</text>
  <text x="54.0" y="216.0" class="mono-sm">  or VectorCurrentDrive(source, t_hat, n_NF)</text>
  <text x="54.0" y="231.5" class="small">Target: RegionRef("fm") | optional nonmagnetic HM omitted</text>
  <line x1="234.0" y1="240.0" x2="234.0" y2="266.0" stroke="#246b8e" stroke-width="2.3" marker-end="url(#arrow-jc)"/>
  <text x="243.0" y="257.0" class="small-bold" fill="#246b8e">No transport solve</text>
  <rect x="42.0" y="268.0" width="384.0" height="102.0" rx="6" fill="#ffffff" stroke="#d6dde8" stroke-width="1.4"/>
  <text x="54.0" y="289.0" class="body-bold" fill="#18202c">2. Effective Parameters (prescribed_sot.fullmag.v1)</text>
  <text x="54.0" y="307.0" class="math-sm">Inputs: J<tspan dy="3.5" font-size="10.5">signed</tspan><tspan dy="-3.5">&#x200B;</tspan>, σ̂, ξ<tspan dy="3.5" font-size="10.5">DL</tspan><tspan dy="-3.5">&#x200B;</tspan>, ξ<tspan dy="3.5" font-size="10.5">FL</tspan><tspan dy="-3.5">&#x200B;</tspan>, t<tspan dy="3.5" font-size="10.5">F</tspan><tspan dy="-3.5">&#x200B;</tspan></text>
  <text x="54.0" y="322.5" class="small">Bulk conversion, diffusion, interface transparency,</text>
  <text x="54.0" y="338.0" class="small">and spin backflow are folded into fitted ξ_DL, ξ_FL.</text>
  <text x="54.0" y="353.5" class="small">No V, μ_s, Q_ia, or inverse-SHE observables.</text>
  <line x1="234.0" y1="370.0" x2="234.0" y2="396.0" stroke="#b86b11" stroke-width="2.3" marker-end="url(#arrow-dl)"/>
  <text x="243.0" y="387.0" class="small-bold" fill="#b86b11">Local algebraic prefactor</text>
  <rect x="42.0" y="398.0" width="384.0" height="86.0" rx="6" fill="#f6e8df" stroke="#b97a56" stroke-width="1.4"/>
  <text x="54.0" y="419.0" class="body-bold" fill="#7c2d12">3. Local LLG RHS Source on Target Mask</text>
  <text x="54.0" y="437.0" class="math-sm">T<tspan dy="3.5" font-size="10.5">SOT</tspan><tspan dy="-3.5">&#x200B;</tspan> = C<tspan dy="3.5" font-size="10.5">DL</tspan><tspan dy="-3.5">&#x200B;</tspan> m×(σ̂×m) + C<tspan dy="3.5" font-size="10.5">FL</tspan><tspan dy="-3.5">&#x200B;</tspan> m×σ̂</text>
  <text x="54.0" y="452.5" class="small">Applies Gilbert-to-explicit conversion once.</text>
  <text x="54.0" y="468.0" class="small">Executable: FDM/FEM CPU &amp; GPU (bounded lanes).</text>
  <rect x="42.0" y="496.0" width="384.0" height="80.0" rx="6" fill="#f8fafc" stroke="#d6dde8" stroke-width="1.4"/>
  <text x="54.0" y="517.0" class="body-bold" fill="#18202c">Best suited for:</text>
  <text x="54.0" y="535.0" class="body">• Switching scans &amp; MuMax-style EnableSOT benchmarks</text>
  <text x="54.0" y="550.5" class="body">• Stacks with calibrated effective (ξ_DL, ξ_FL)</text>
  <text x="54.0" y="566.0" class="small">Cannot predict t_HM, λ_sf, or mixing-conductance changes.</text>
  <rect x="470.0" y="80.0" width="420.0" height="514.0" rx="8" fill="#ffffff" stroke="#d6dde8" stroke-width="1.3"/>
  <rect x="484.0" y="92.0" width="26" height="22" rx="5" fill="#b86b11"/>
  <text x="497.0" y="107.5" text-anchor="middle" class="badge-text">b</text>
  <text x="519.0" y="108.0" class="panel-title">M1: One-Way Drift-Diffusion</text>
  <text x="486.0" y="132.0" class="small">Forward chain charge → spin → torque; no ISHE back-coupling</text>
  <rect x="488.0" y="146.0" width="384.0" height="82.0" rx="6" fill="#e4eff5" stroke="#4d8098" stroke-width="1.4"/>
  <text x="500.0" y="167.0" class="body-bold" fill="#164e63">1. Charge Solve (coupling="one_way")</text>
  <text x="500.0" y="185.0" class="mono-sm">CurrentTransport(model="ohmic_poisson", ...)</text>
  <text x="500.0" y="200.5" class="math-sm">∇·(σ E) = 0 ⇒ fixed snapshot (V, E, J<tspan dy="3.5" font-size="10.5">c</tspan><tspan dy="-3.5">&#x200B;</tspan>)</text>
  <text x="500.0" y="216.0" class="small">Requires conducting mesh on HM + FM + contacts/gauge.</text>
  <line x1="680.0" y1="228.0" x2="680.0" y2="254.0" stroke="#246b8e" stroke-width="2.3" marker-end="url(#arrow-jc)"/>
  <text x="689.0" y="245.0" class="small-bold" fill="#246b8e">current_source_id (no feedback)</text>
  <rect x="488.0" y="256.0" width="384.0" height="108.0" rx="6" fill="#fff7ed" stroke="#b86b11" stroke-width="1.4"/>
  <text x="500.0" y="277.0" class="body-bold" fill="#b86b11">2. Spin Drift-Diffusion (one_way.fullmag.v1)</text>
  <text x="500.0" y="295.0" class="mono-sm">SpinDriftDiffusion(id="spin", current_source_id=...)</text>
  <text x="500.0" y="310.5" class="math-sm">Q<tspan dy="3.5" font-size="10.5">i</tspan><tspan dy="-3.5">&#x200B;</tspan> = P<tspan dy="3.5" font-size="10.5">f</tspan><tspan dy="-3.5">&#x200B;</tspan>m<tspan dy="3.5" font-size="10.5">up</tspan><tspan dy="-3.5">&#x200B;</tspan>J<tspan dy="3.5" font-size="10.5">c,i</tspan><tspan dy="-3.5">&#x200B;</tspan> + θ<tspan dy="3.5" font-size="10.5">SH,f</tspan><tspan dy="-3.5">&#x200B;</tspan>σ<tspan dy="3.5" font-size="10.5">f</tspan><tspan dy="-3.5">&#x200B;</tspan>(e<tspan dy="3.5" font-size="10.5">i</tspan><tspan dy="-3.5">&#x200B;</tspan>×E<tspan dy="3.5" font-size="10.5">f</tspan><tspan dy="-3.5">&#x200B;</tspan>) − ∂μ_s</text>
  <text x="500.0" y="326.0" class="small">Solves μ_s with reactions R_sf, R_J, R_ϕ and explicit</text>
  <text x="500.0" y="341.5" class="small">Transparent / MixingConductanceSpinInterface.</text>
  <line x1="680.0" y1="364.0" x2="680.0" y2="390.0" stroke="#b86b11" stroke-width="2.3" marker-end="url(#arrow-dl)"/>
  <text x="689.0" y="381.0" class="small-bold" fill="#b86b11">Absorbed interface + bulk R_J, R_ϕ</text>
  <rect x="488.0" y="392.0" width="384.0" height="92.0" rx="6" fill="#f6e8df" stroke="#b97a56" stroke-width="1.4"/>
  <text x="500.0" y="413.0" class="body-bold" fill="#7c2d12">3. Named-Solve Torque Consumer</text>
  <text x="500.0" y="431.0" class="mono-sm">DriftDiffusionSpinTorque(id, solve_id="spin", target)</text>
  <text x="500.0" y="446.5" class="math-sm">T<tspan dy="3.5" font-size="10.5">tr,G</tspan><tspan dy="-3.5">&#x200B;</tspan> = −(γ<tspan dy="3.5" font-size="10.5">e</tspan><tspan dy="-3.5">&#x200B;</tspan>/M<tspan dy="3.5" font-size="10.5">s</tspan><tspan dy="-3.5">&#x200B;</tspan>)(ℏ/2e)[(A_f/V_K)q<tspan dy="3.5" font-size="10.5">abs,⊥</tspan><tspan dy="-3.5">&#x200B;</tspan> + R_J + R_ϕ]</text>
  <text x="500.0" y="462.0" class="small">Contract: transport_torque_angular_momentum.fullmag.v1</text>
  <rect x="488.0" y="496.0" width="384.0" height="80.0" rx="6" fill="#f8fafc" stroke="#d6dde8" stroke-width="1.4"/>
  <text x="500.0" y="517.0" class="body-bold" fill="#18202c">Best suited for:</text>
  <text x="500.0" y="535.0" class="body">• Current crowding, finite λ_sf, spin backflow</text>
  <text x="500.0" y="550.5" class="body">• Multilayer HM/FM stack &amp; interface transparency design</text>
  <text x="500.0" y="566.0" class="small">Spin state never modifies the charge-current solution.</text>
  <rect x="916.0" y="80.0" width="420.0" height="514.0" rx="8" fill="#ffffff" stroke="#d6dde8" stroke-width="1.3"/>
  <rect x="930.0" y="92.0" width="26" height="22" rx="5" fill="#6f3cc4"/>
  <text x="943.0" y="107.5" text-anchor="middle" class="badge-text">c</text>
  <text x="965.0" y="108.0" class="panel-title">M2: Reciprocal Onsager Block</text>
  <text x="932.0" y="132.0" class="small">Monolithic coupled (V, μ_s) block; bidirectional charge-spin coupling</text>
  <rect x="932.0" y="144.0" width="388.0" height="224" rx="7" fill="#f5f3ff" stroke="#6f3cc4" stroke-width="1.6"/>
  <text x="944.0" y="164.0" class="body-bold" fill="#6f3cc4">1+2. Coupled Steady Block (reciprocal.fullmag.v1)</text>
  <text x="944.0" y="180.0" class="mono-sm">coupling="bidirectional", solver="block_gmres"</text>
  <rect x="944.0" y="190.0" width="364.0" height="68.0" rx="6" fill="#ffffff" stroke="#246b8e" stroke-width="1.4"/>
  <text x="956.0" y="211.0" class="body-bold" fill="#246b8e">Charge Block (V, J_c): AMR / PHE / AHE + iSHE</text>
  <text x="956.0" y="229.0" class="math-sm">J_c = σ_ani(m)·E + Pσ_s m·G + θ<tspan dy="3.5" font-size="10.5">SH</tspan><tspan dy="-3.5">&#x200B;</tspan>σ_s(∇×μ_s/2)</text>
  <text x="956.0" y="244.5" class="small">Requires σ_⊥, σ_∥, σ_AHE &amp; Dirichlet voltage gauge.</text>
  <line x1="1061.0" y1="259.0" x2="1061.0" y2="286.0" stroke="#246b8e" stroke-width="2.2" marker-end="url(#arrow-jc)"/>
  <text x="1049.0" y="276.0" text-anchor="end" class="small-bold" fill="#246b8e">Direct SHE</text>
  <line x1="1191.0" y1="287.0" x2="1191.0" y2="260.0" stroke="#6f3cc4" stroke-width="2.2" marker-end="url(#arrow-sigma)"/>
  <text x="1201.0" y="276.0" class="small-bold" fill="#6f3cc4">ISHE + MR feedback</text>
  <rect x="944.0" y="288.0" width="364.0" height="68.0" rx="6" fill="#ffffff" stroke="#6f3cc4" stroke-width="1.4"/>
  <text x="956.0" y="309.0" class="body-bold" fill="#6f3cc4">Spin Block (μ_s, Q_ia): Direct SHE + Drift + Diffusion</text>
  <text x="956.0" y="327.0" class="math-sm">Q_ia = σ_s G_ia + Pσ_s E_i m_a + θ<tspan dy="3.5" font-size="10.5">SH</tspan><tspan dy="-3.5">&#x200B;</tspan>σ_s ε_ika E_k</text>
  <text x="956.0" y="342.5" class="small">Solved jointly via Picard / block_gmres (steady only).</text>
  <line x1="1126.0" y1="368.0" x2="1126.0" y2="394.0" stroke="#b86b11" stroke-width="2.3" marker-end="url(#arrow-dl)"/>
  <text x="1135.0" y="385.0" class="small-bold" fill="#b86b11">Coupled flux + reactions</text>
  <rect x="934.0" y="396.0" width="384.0" height="88.0" rx="6" fill="#f6e8df" stroke="#b97a56" stroke-width="1.4"/>
  <text x="946.0" y="417.0" class="body-bold" fill="#7c2d12">3. Named-Solve Torque + Charge Observables</text>
  <text x="946.0" y="435.0" class="mono-sm">DriftDiffusionSpinTorque(id, solve_id="spin", target)</text>
  <text x="946.0" y="450.5" class="small">Outputs V_electric, J_charge, spin_potential, Q_ia, T_tr.</text>
  <text x="946.0" y="466.0" class="small">Bounded FDM CPU &amp; conforming H1/P1 FEM CPU lanes.</text>
  <rect x="934.0" y="496.0" width="384.0" height="80.0" rx="6" fill="#f8fafc" stroke="#d6dde8" stroke-width="1.4"/>
  <text x="946.0" y="517.0" class="body-bold" fill="#18202c">Best suited for:</text>
  <text x="946.0" y="535.0" class="body">• Inverse SHE voltages &amp; spin-Hall magnetoresistance</text>
  <text x="946.0" y="550.5" class="body">• Self-consistent AMR/PHE/AHE current redistribution</text>
  <text x="946.0" y="566.0" class="small">Most expensive; transient M3 reciprocal unavailable.</text>
  <rect x="24" y="610.0" width="1312" height="128" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.6"/>
  <rect x="40" y="624.0" width="188" height="24" rx="5" fill="#d97706"/>
  <text x="134" y="640.5" text-anchor="middle" class="badge-text">DOUBLE-COUNTING GUARD</text>
  <text x="242" y="641.0" class="panel-title" fill="#9a3412">Do not stack PrescribedSpinOrbitTorque + DriftDiffusionSpinTorque on the same magnetic layer</text>
  <rect x="40" y="658.0" width="626" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="54" y="679.0" class="body-bold" fill="#b91c1c">Additive RHS when sharing RegionRef("fm"):</text>
  <text x="54" y="698.0" class="mono-sm" fill="#7f1d1d">PrescribedSpinOrbitTorque(fm) + DriftDiffusionSpinTorque(fm)</text>
  <text x="54" y="715.0" class="small" fill="#991b1b">Fullmag sums BOTH torques into dm/dt — it does NOT substitute one for the other!</text>
  <rect x="684" y="658.0" width="636" height="66" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="698" y="679.0" class="body-bold" fill="#065f46">When combining or comparing models:</text>
  <text x="698" y="698.0" class="small" fill="#065f46">1. Comparison studies: run separate stages/studies with ONE torque active at a time.</text>
  <text x="698" y="715.0" class="small" fill="#065f46">2. Multi-source stacks: combine ONLY if each term models a distinct physical interface/layer.</text>
</svg>
