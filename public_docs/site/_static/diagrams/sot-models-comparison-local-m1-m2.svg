<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" width="1360" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture comparison of Prescribed Local SOT, M1 one-way transport, and M2 reciprocal transport in Fullmag</title>
  <desc id="desc">Three-column comparison of PrescribedSpinOrbitTorque (local algebraic law, no HM mesh), M1 one-way CurrentTransport plus SpinDriftDiffusion plus DriftDiffusionSpinTorque, and M2 bidirectional reciprocal charge-spin block, with an explicit warning against double-counting on the same RegionRef.</desc>
  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#b8392b"/></marker>
    <marker id="arrow-h" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#1d5fa7"/></marker>
    <marker id="arrow-dl" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#b86b11"/></marker>
    <marker id="arrow-fl" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#147d75"/></marker>
    <marker id="arrow-sigma" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#6f3cc4"/></marker>
    <marker id="arrow-jc" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#246b8e"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#475569"/></marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#18202c"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#d97706"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 1.2 L 9.2 5 L 0.5 8.8 z" fill="#059669"/></marker>
    <style>
      .fig-title { font: 700 18.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #18202c; }
      .fig-subtitle { font: 400 13px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #5a687a; }
      .panel-title { font: 700 15px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #18202c; }
      .badge-text { font: 700 13px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #ffffff; }
      .card-title { font: 700 13.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #18202c; }
      .body { font: 400 12.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #334155; }
      .body-bold { font: 600 12.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #18202c; }
      .small { font: 400 11.3px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #5a687a; }
      .small-bold { font: 600 11.3px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #334155; }
      .mono { font: 600 11.5px 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; fill: #18202c; }
      .mono-sm { font: 500 10.8px 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; fill: #334155; }
      .math { font: 400 14.5px 'Cambria Math', 'STIX Two Text', Georgia, serif; fill: #18202c; }
      .math-sm { font: 400 12.8px 'Cambria Math', 'STIX Two Text', Georgia, serif; fill: #18202c; }
