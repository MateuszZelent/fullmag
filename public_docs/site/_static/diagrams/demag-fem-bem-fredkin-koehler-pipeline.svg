<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 796" role="img" aria-labelledby="title desc">
  <title id="title">FEM-BEM Fredkin-Koehler two-solve pipeline on body-only mesh Omega_m</title>
  <desc id="desc">Diagram of Fullmag&#x27;s Fredkin-Koehler FEM-BEM demagnetization algorithm on a closed body-only mesh Omega_m without an airbox: (a) step-by-step dataflow from magnetic RHS assembly, gauge pinning b_{1,0}=0, Neumann solve u_1, surface trace gamma u_1 on Gamma_m, dense boundary solid-angle operator B, Dirichlet data g_2 = B gamma u_1, harmonic Laplace solve u_2, to combined field H_d = -grad(u_1 + u_2) and energy E_d; (b) analytical sphere potential splitting u = u_1 + u_2, solid-angle geometry omega_T(x_i), and strict CPU/GPU boundary.</desc>
  <defs>
    <style>
      .title-main { font: 700 22px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #1e2433; }
      .subtitle-main { font: 400 13.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #526077; }
      .panel-badge-txt { font: 700 13px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #ffffff; }
      .panel-title { font: 700 16px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #1e2433; }
      .sec-head { font: 700 13.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #1e2433; }
      .body-txt { font: 400 13px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #344054; }
      .body-bold { font: 600 13px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #1e2433; }
      .small-txt { font: 400 11.8px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #526077; }
      .small-bold { font: 600 11.8px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #344054; }
      .mono { font: 600 11.5px 'Consolas', 'Cascadia Mono', 'DejaVu Sans Mono', monospace; fill: #1e2433; }
      .mono-sm { font: 500 10.8px 'Consolas', 'Cascadia Mono', 'DejaVu Sans Mono', monospace; fill: #344054; }
      .math { font: italic 14.5px 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; fill: #1e2433; }
      .math-b { font: italic 700 14.5px 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; fill: #1e2433; }
      .math-sm { font: italic 13px 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; fill: #344054; }
      .axis-txt { font: 500 11.5px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #526077; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1e2433"/></marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#526077"/></marker>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#b8392b"/></marker>
    <marker id="arr-h" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1d5fa7"/></marker>
    <marker id="arr-dl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#b86b11"/></marker>
    <marker id="arr-fl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#147d75"/></marker>
    <marker id="arr-bem" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6f3cc4"/></marker>
    <marker id="arr-jc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#246b8e"/></marker>
    <marker id="arr-air" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6e7b91"/></marker>
    <pattern id="air-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#cbd4e4" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1358" height="794" rx="10" fill="#fbfcfe" stroke="#ccd0da" stroke-width="1.6"/>
  <text x="28" y="34" class="title-main">FEM–BEM Fredkin–Koehler Pipeline on Body-Only Mesh (Ω<tspan baseline-shift="sub" font-size="14">m</tspan>, No Airbox)</text>
  <text x="28" y="64" class="subtitle-main">Two sparse MFEM interior solves coupled by a dense closed-surface boundary operator ℬ on Γ<tspan baseline-shift="sub" font-size="9.5">m</tspan> = ∂Ω<tspan baseline-shift="sub" font-size="9.5">m</tspan></text>
  <rect x="24.0" y="80.0" width="1312.0" height="344.0" rx="8" fill="#ffffff" stroke="#dce0e8" stroke-width="1.4"/>
  <rect x="38.0" y="92.0" width="32" height="22" rx="11" fill="#6f3cc4"/>
  <text x="54.0" y="107.5" text-anchor="middle" class="panel-badge-txt">(a)</text>
  <text x="80.0" y="108.5" class="panel-title">Two-Solve Fredkin–Koehler Execution Sequence (context_compute_demag_fem_bem)</text>
  <line x1="38.0" y1="124.0" x2="1322.0" y2="124.0" stroke="#e2e6ef" stroke-width="1"/>
  <rect x="44" y="140" width="294" height="114" rx="6" fill="#f6e8df" stroke="#b8392b" stroke-width="1.5"/>
  <text x="56" y="162" class="sec-head" fill="#b8392b">1. Body Mesh &amp; RHS b</text>
  <text x="56" y="185" class="small-txt">Closed body-only Ω<tspan baseline-shift="sub" font-size="10.5">m</tspan> (no airbox)</text>
  <text x="56" y="209" class="math-sm" fill="#1e2433">b = ∫<tspan baseline-shift="sub" font-size="10.5">Ωm</tspan> M·∇v dV</text>
  <rect x="54" y="222" width="274" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="191.0" y="238" text-anchor="middle" class="mono-sm">assemble_demag_poisson_rhs</text>
  <line x1="341" y1="197.0" x2="367" y2="197.0" stroke="#1e2433" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="370" y="140" width="294" height="114" rx="6" fill="#fdf3e7" stroke="#b86b11" stroke-width="1.5"/>
  <text x="382" y="162" class="sec-head" fill="#b86b11">2. Gauge Pin (b<tspan baseline-shift="sub" font-size="9.5">1,0</tspan>=0)</text>
  <text x="382" y="185" class="small-txt">Remove constant nullspace C</text>
  <text x="382" y="209" class="math-sm" fill="#1e2433">b<tspan baseline-shift="sub" font-size="10.5">1</tspan> ← b;  b<tspan baseline-shift="sub" font-size="10.5">1,0</tspan> = 0 on gauge DOF</text>
  <rect x="380" y="222" width="274" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="517.0" y="238" text-anchor="middle" class="mono-sm">prepare_demag_fem_bem_neumann_rhs</text>
  <line x1="667" y1="197.0" x2="693" y2="197.0" stroke="#1e2433" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="696" y="140" width="294" height="114" rx="6" fill="#e8f1fb" stroke="#1d5fa7" stroke-width="1.5"/>
  <text x="708" y="162" class="sec-head" fill="#1d5fa7">3. Neumann Solve u<tspan baseline-shift="sub" font-size="9.5">1</tspan></text>
  <text x="708" y="185" class="small-txt">CG/GMRES + Hypre (telemetry u<tspan baseline-shift="sub" font-size="10.5">1</tspan>)</text>
  <text x="708" y="209" class="math-sm" fill="#1e2433">K u<tspan baseline-shift="sub" font-size="10.5">1</tspan> = b<tspan baseline-shift="sub" font-size="10.5">1</tspan>   (∂<tspan baseline-shift="sub" font-size="10.5">n</tspan>u<tspan baseline-shift="sub" font-size="10.5">1</tspan> = M·n on Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan>)</text>
  <rect x="706" y="222" width="274" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="843.0" y="238" text-anchor="middle" class="mono-sm">solve_demag_fem_bem_sparse_system</text>
  <line x1="993" y1="197.0" x2="1019" y2="197.0" stroke="#1e2433" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="1022" y="140" width="294" height="114" rx="6" fill="#f2ecfb" stroke="#6f3cc4" stroke-width="1.5"/>
  <text x="1034" y="162" class="sec-head" fill="#6f3cc4">4. Surface Trace γu<tspan baseline-shift="sub" font-size="9.5">1</tspan></text>
  <text x="1034" y="185" class="small-txt">Extract true DOFs on Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan> = ∂Ω<tspan baseline-shift="sub" font-size="10.5">m</tspan></text>
  <text x="1034" y="209" class="math-sm" fill="#1e2433">γu<tspan baseline-shift="sub" font-size="10.5">1</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="10.5">Nb</tspan>  (closed oriented surf.)</text>
  <rect x="1032" y="222" width="274" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="1169.0" y="238" text-anchor="middle" class="mono-sm">extract_demag_fem_bem_boundary_trace</text>
  <path d="M 1169 254 L 1169 270 L 236 270 L 236 285" fill="none" stroke="#6f3cc4" stroke-width="2.2" marker-end="url(#arr-bem)"/>
  <rect x="610" y="255" width="164" height="26" rx="4" fill="#ffffff" stroke="#6f3cc4" stroke-width="1"/>
  <text x="692" y="272" text-anchor="middle" class="small-bold" fill="#6f3cc4">Boundary trace γu<tspan baseline-shift="sub" font-size="10.5">1</tspan></text>
  <rect x="44" y="288" width="400" height="120" rx="6" fill="#f2ecfb" stroke="#6f3cc4" stroke-width="1.5"/>
  <text x="58" y="311" class="sec-head" fill="#6f3cc4">5. Dense BEM Operator ℬ &amp; Dirichlet g<tspan baseline-shift="sub" font-size="9.5">2</tspan></text>
  <text x="58" y="335" class="small-txt">ℬ<tspan baseline-shift="sub" font-size="10.5">ii</tspan> = ∑<tspan baseline-shift="sub" font-size="10.5">T∋xᵢ</tspan> ω<tspan baseline-shift="sub" font-size="10.5">T</tspan>(x<tspan baseline-shift="sub" font-size="10.5">i</tspan>)/(4π) − 1;  Lindholm off-diag</text>
  <text x="58" y="359" class="math-sm" fill="#1e2433">g<tspan baseline-shift="sub" font-size="10.5">2</tspan> = ℬ γu<tspan baseline-shift="sub" font-size="10.5">1</tspan>  →  essential BC injected on Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan></text>
  <rect x="56" y="374" width="376" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="244.0" y="390" text-anchor="middle" class="mono-sm">DenseDemagBemOperator::build / apply</text>
  <line x1="447" y1="348.0" x2="477" y2="348.0" stroke="#1e2433" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="480" y="288" width="400" height="120" rx="6" fill="#e8f1fb" stroke="#1d5fa7" stroke-width="1.5"/>
  <text x="494" y="311" class="sec-head" fill="#1d5fa7">6. Harmonic Laplace Solve u<tspan baseline-shift="sub" font-size="9.5">2</tspan></text>
  <text x="494" y="335" class="small-txt">Dirichlet essential solve on Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan> (telemetry u<tspan baseline-shift="sub" font-size="10.5">2</tspan>)</text>
  <text x="494" y="359" class="math-sm" fill="#1e2433">Δu<tspan baseline-shift="sub" font-size="10.5">2</tspan> = 0 in Ω<tspan baseline-shift="sub" font-size="10.5">m</tspan>,   γu<tspan baseline-shift="sub" font-size="10.5">2</tspan> = g<tspan baseline-shift="sub" font-size="10.5">2</tspan> on Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan></text>
  <rect x="492" y="374" width="376" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="680.0" y="390" text-anchor="middle" class="mono-sm">prepare_demag_fem_bem_dirichlet_rhs + solve</text>
  <line x1="883" y1="348.0" x2="913" y2="348.0" stroke="#1e2433" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="916" y="288" width="400" height="120" rx="6" fill="#e6f5f3" stroke="#147d75" stroke-width="1.5"/>
  <text x="930" y="311" class="sec-head" fill="#147d75">7. Combine u, Recover H<tspan baseline-shift="sub" font-size="9.5">d</tspan> &amp; Energy E<tspan baseline-shift="sub" font-size="9.5">d</tspan></text>
  <text x="930" y="335" class="small-txt">u = u<tspan baseline-shift="sub" font-size="10.5">1</tspan> + u<tspan baseline-shift="sub" font-size="10.5">2</tspan>  (pointwise sum on Ω<tspan baseline-shift="sub" font-size="10.5">m</tspan>)</text>
  <text x="930" y="359" class="math-sm" fill="#1e2433">H<tspan baseline-shift="sub" font-size="10.5">d</tspan> = −∇(u<tspan baseline-shift="sub" font-size="10.5">1</tspan>+u<tspan baseline-shift="sub" font-size="10.5">2</tspan>),  E<tspan baseline-shift="sub" font-size="10.5">d</tspan> = −(μ<tspan baseline-shift="sub" font-size="10.5">0</tspan>/2)∫ M·H<tspan baseline-shift="sub" font-size="10.5">d</tspan> dV</text>
  <rect x="928" y="374" width="376" height="24" rx="4" fill="#ffffff" stroke="#dce0e8" stroke-width="1"/>
  <text x="1116.0" y="390" text-anchor="middle" class="mono-sm">combine_... + recover_... + energy_from_field</text>
  <rect x="24.0" y="440.0" width="1312.0" height="336.0" rx="8" fill="#ffffff" stroke="#dce0e8" stroke-width="1.4"/>
  <rect x="38.0" y="452.0" width="32" height="22" rx="11" fill="#147d75"/>
  <text x="54.0" y="467.5" text-anchor="middle" class="panel-badge-txt">(b)</text>
  <text x="80.0" y="468.5" class="panel-title">Analytical Potential Splitting (Sphere), Solid-Angle Operator ℬ, and Lane Contract</text>
  <line x1="38.0" y1="484.0" x2="1322.0" y2="484.0" stroke="#e2e6ef" stroke-width="1"/>
  <rect x="44" y="498" width="434" height="260" rx="6" fill="#f6f8fc" stroke="#dce0e8" stroke-width="1.2"/>
  <text x="261.0" y="520" text-anchor="middle" class="sec-head">Exact Splitting for Uniform Sphere (M = M<tspan baseline-shift="sub" font-size="10.5">s</tspan> ẑ)</text>
  <rect x="100" y="540" width="224" height="168" fill="#ffffff" stroke="#dce0e8" stroke-width="1.1"/>
  <line x1="100" y1="624.0" x2="324" y2="624.0" stroke="#d8dee9" stroke-width="1.2"/>
  <line x1="212.0" y1="540" x2="212.0" y2="708" stroke="#d8dee9" stroke-width="1.2"/>
  <text x="93" y="701.0" text-anchor="end" class="axis-txt">-1.0</text>
  <text x="93" y="628.0" text-anchor="end" class="axis-txt">+0.0</text>
  <text x="93" y="555.0" text-anchor="end" class="axis-txt">+1.0</text>
  <text x="100.0" y="724" text-anchor="middle" class="axis-txt">-1</text>
  <text x="212.0" y="724" text-anchor="middle" class="axis-txt">+0</text>
  <text x="324.0" y="724" text-anchor="middle" class="axis-txt">+1</text>
  <text x="212.0" y="743" text-anchor="middle" class="small-bold">z / a (inside Ω<tspan baseline-shift="sub" font-size="10.5">m</tspan>)</text>
  <text x="61" y="624.0" text-anchor="middle" class="small-bold" transform="rotate(-90 61 624.0)">u / (M<tspan baseline-shift="sub" font-size="8.5">s</tspan> a)</text>
  <polyline points="100.00,697.04 324.00,550.96" fill="none" stroke="#1d5fa7" stroke-width="2.5"/>
  <polyline points="100.00,575.30 324.00,672.70" fill="none" stroke="#6f3cc4" stroke-width="2.5"/>
  <polyline points="100.00,648.35 324.00,599.65" fill="none" stroke="#147d75" stroke-width="3"/>
  <line x1="336" y1="556" x2="360" y2="556" stroke="#1d5fa7" stroke-width="2.6"/>
  <text x="366" y="560" class="math-sm" fill="#1d5fa7">u<tspan baseline-shift="sub" font-size="10.5">1</tspan> = z</text>
  <line x1="336" y1="586" x2="360" y2="586" stroke="#6f3cc4" stroke-width="2.6"/>
  <text x="366" y="590" class="math-sm" fill="#6f3cc4">u<tspan baseline-shift="sub" font-size="10.5">2</tspan> = −⅔ z</text>
  <line x1="336" y1="616" x2="360" y2="616" stroke="#147d75" stroke-width="3"/>
  <text x="366" y="620" class="math-sm" fill="#147d75">u = ⅓ z</text>
  <text x="336" y="652" class="small-txt">H<tspan baseline-shift="sub" font-size="10.5">d</tspan> = −∇u</text>
  <text x="336" y="678" class="small-bold" fill="#147d75">= −⅓ M<tspan baseline-shift="sub" font-size="10.5">s</tspan> ẑ</text>
  <text x="336" y="703" class="small-txt">(N = 1/3 exact)</text>
  <rect x="496" y="498" width="404" height="260" rx="6" fill="#f6f8fc" stroke="#dce0e8" stroke-width="1.2"/>
  <text x="698.0" y="520" text-anchor="middle" class="sec-head">Boundary Solid Angle ω<tspan baseline-shift="sub" font-size="10.5">T</tspan>(x<tspan baseline-shift="sub" font-size="10.5">i</tspan>) &amp; Diagonal ℬ<tspan baseline-shift="sub" font-size="10.5">ii</tspan></text>
  <polygon points="608,630 544,664 600,694 676,668" fill="#f6e8df" stroke="#b97a56" stroke-width="1.4"/>
  <polygon points="608,630 544,664 590,604" fill="#f2ecfb" fill-opacity="0.7" stroke="#6f3cc4" stroke-width="1.5"/>
  <polygon points="608,630 676,668 646,606" fill="#e8f1fb" fill-opacity="0.7" stroke="#1d5fa7" stroke-width="1.5"/>
  <line x1="642" y1="634" x2="666" y2="600" stroke="#1d5fa7" stroke-width="2" marker-end="url(#arr-h)"/>
  <text x="670" y="598" class="math-sm" fill="#1d5fa7">n<tspan baseline-shift="sub" font-size="10.5">T</tspan></text>
  <circle cx="608" cy="630" r="5.5" fill="#b8392b" stroke="#ffffff" stroke-width="1.2"/>
  <text x="612" y="612" text-anchor="middle" class="math-b" fill="#b8392b">x<tspan baseline-shift="sub" font-size="10.5">i</tspan></text>
  <text x="610" y="674" text-anchor="middle" class="small-bold" fill="#b8392b">∑ω<tspan baseline-shift="sub" font-size="10.5">T</tspan></text>
  <text x="604" y="712" text-anchor="middle" class="small-txt">Triangle T on Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan></text>
  <text x="712" y="558" class="math" fill="#6f3cc4">ℬ<tspan baseline-shift="sub" font-size="10.5">ii</tspan> = ∑<tspan baseline-shift="sub" font-size="10.5">T∋xᵢ</tspan> ω<tspan baseline-shift="sub" font-size="10.5">T</tspan>/(4π) − 1</text>
  <text x="712" y="586" class="small-txt">• Smooth face: ℬ<tspan baseline-shift="sub" font-size="10.5">ii</tspan> = −0.50</text>
  <text x="712" y="612" class="small-txt">• 90° cube corner: ℬ<tspan baseline-shift="sub" font-size="10.5">ii</tspan> = −0.875</text>
  <text x="712" y="642" class="small-bold">Off-diagonal (i ≠ j):</text>
  <text x="712" y="662" class="small-txt">Lindholm linear-triangle</text>
  <text x="712" y="682" class="small-txt">weights (area, edge logs,</text>
  <text x="712" y="702" class="small-txt">coincidence guard)</text>
  <text x="712" y="730" class="small-bold" fill="#b8392b">Fails closed if Γ<tspan baseline-shift="sub" font-size="10.5">m</tspan> open</text>
  <rect x="918" y="498" width="398" height="260" rx="6" fill="#f6f8fc" stroke="#dce0e8" stroke-width="1.2"/>
  <text x="1117.0" y="520" text-anchor="middle" class="sec-head">Lane Envelope, Telemetry &amp; Guardrails</text>
  <rect x="934.0" y="538.0" width="366.0" height="32.0" rx="5" fill="#fdf3e7" stroke="#b86b11" stroke-width="1.1"/>
  <text x="1117.0" y="558.2" text-anchor="middle" class="small-bold" fill="#b86b11">FEM CPU: dense reference (partial; N_b capped)</text>
  <rect x="934.0" y="580.0" width="366.0" height="32.0" rx="5" fill="#fdf0f1" stroke="#c43a47" stroke-width="1.1"/>
  <text x="1117.0" y="600.2" text-anchor="middle" class="small-bold" fill="#c43a47">FEM GPU: UNSUPPORTED (no silent airbox/CPU)</text>
  <text x="936" y="636" class="small-bold">Separate provenance &amp; telemetry:</text>
  <text x="936" y="661" class="small-txt">• Records u<tspan baseline-shift="sub" font-size="10.5">1</tspan> and u<tspan baseline-shift="sub" font-size="10.5">2</tspan> iterations &amp; residuals separately</text>
  <text x="936" y="686" class="small-txt">• rtol/max_iterations govern sparse solves, NOT BEM quad.</text>
  <text x="936" y="711" class="small-txt">• Rejects variant= on fredkin_koehler / bem / fmm</text>
  <text x="936" y="736" class="small-txt">• Generic bem &amp; fmm are planner-gated (not dense FK)</text>
</svg>
