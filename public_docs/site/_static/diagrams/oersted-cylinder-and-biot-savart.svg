<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 690" role="img" aria-labelledby="title desc">
  <title id="title">Oersted field families: analytic infinite cylinder vs solved-current Biot-Savart and vector potential</title>
  <desc id="desc">Panel (a) shows the OerstedCylinder geometry of radius R carrying signed current I along unit axis a_hat, with azimuthal direction phi_hat = a_hat x rho_hat and the exact piecewise radial profile H_oe(rho). Panel (b) traces the OerstedField(source=...) pipeline from CurrentTransport and circuit closure through Biot-Savart and H(curl) vector potential formulations, separating bounded FEM CPU support from unsupported FDM solved-current lanes.</desc>
