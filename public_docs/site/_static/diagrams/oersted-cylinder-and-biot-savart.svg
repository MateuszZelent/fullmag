  <rect x="360" y="134" width="300" height="178" rx="6" fill="#e7f0fa" stroke="#1d5fa7" stroke-width="1.2"/>
  <text x="374" y="156" class="sec-head" fill="#1d5fa7">Analytic Ampère Law (Infinite Wire)</text>
  <text x="374" y="182" class="math-sm">0 ≤ ρ &lt; R:   H<tspan baseline-shift="sub" font-size="74%">oe</tspan>(ρ) = I ρ / (2π R<tspan baseline-shift="super" font-size="74%">2</tspan>) φ̂</text>
  <text x="374" y="206" class="math-sm">ρ ≥ R:       H<tspan baseline-shift="sub" font-size="74%">oe</tspan>(ρ) = I / (2π ρ) φ̂</text>
  <text x="374" y="232" class="small-bold">Peak at ρ = R: H<tspan baseline-shift="sub" font-size="74%">peak</tspan> = |I| / (2π R)</text>
  <text x="374" y="256" class="small">• H<tspan baseline-shift="sub" font-size="74%">oe</tspan>(0) = 0 by axis continuity; no end effects.</text>
  <text x="374" y="274" class="small">• Scaled at runtime by envelope f(t): Constant,</text>
  <text x="382" y="290" class="small">Sinusoidal, or Pulse (FDM CUDA: +z, Constant).</text>
  <rect x="42" y="324" width="618" height="308" rx="6" fill="#ffffff" stroke="#d7dce5" stroke-width="1.2"/>
  <text x="58" y="346" class="sec-head">Exact Normalized Radial Profile |H<tspan baseline-shift="sub" font-size="74%">oe</tspan>(ρ)| / H<tspan baseline-shift="sub" font-size="74%">peak</tspan> vs ρ / R</text>
