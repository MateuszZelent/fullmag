  <circle cx="242.0" cy="390.0" r="4.8" fill="#b8392b"/>
  <text x="54" y="436.0" class="math-sm">|H<tspan baseline-shift="sub" font-size="74%">oe</tspan>|/H<tspan baseline-shift="sub" font-size="74%">pk</tspan></text>
  <text x="370.0" y="610.0" text-anchor="middle" class="small">Normalized radial distance ρ / R</text>
  <text x="178.0" y="406.0" text-anchor="middle" class="small-bold" fill="#4d8098">Inside wire</text>
  <text x="178.0" y="422.0" text-anchor="middle" class="small">∝ ρ</text>
  <text x="256.0" y="394.0" class="small-bold" fill="#b8392b">Peak at ρ = R: I / (2π R)</text>
  <text x="411.0" y="486.7" class="small-bold" fill="#1d5fa7">Exterior decay ∝ 1 / ρ</text>
  <rect x="690" y="82" width="644" height="566" rx="8" fill="#ffffff" stroke="#d7dce5" stroke-width="1.2"/>
  <rect x="702" y="92" width="28" height="22" rx="6" fill="#dce7f7" stroke="#1d5fa7" stroke-width="0.9"/>
  <text x="716" y="107.5" text-anchor="middle" class="panel-badge">(b)</text>
  <text x="738" y="108" class="panel-title">OerstedField(source=...): Solved-Current Pipeline &amp; Lane Boundaries</text>
  <line x1="702" y1="121" x2="1322" y2="121" stroke="#e5e9f0" stroke-width="1"/>
  <rect x="706" y="134" width="612" height="108" rx="6" fill="#e6f2f7" stroke="#246b8e" stroke-width="1.2"/>
  <text x="722" y="155" class="sec-head" fill="#246b8e">1. Charge Transport Source &amp; Circuit-Closure Contract</text>
  <text x="722" y="175" class="code">CurrentTransport(model="ohmic_poisson" | "magnetoresistive_poisson")</text>
  <text x="722" y="194" class="body">• Supplies conservative ∇·J<tspan baseline-shift="sub" font-size="74%">c</tspan> = 0 via RT0 flux view (ConservativeCurrentView /</text>
  <text x="732" y="210" class="body">StructuredCurrentClosure / ExternalLeadCurrentSource) with SHA-256 revision digest.</text>
  <text x="722" y="229" class="small" fill="#b8392b">Guard: A local two-electrode bar without closure is NOT globally closed for general Oersted.</text>
  <line x1="1012" y1="242" x2="1012" y2="260" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow-axis)"/>
  <rect x="706" y="264" width="300" height="206" rx="6" fill="#ffffff" stroke="#1d5fa7" stroke-width="1.2"/>
  <text x="720" y="285" class="sec-head" fill="#1d5fa7">2A. Direct Biot-Savart (OE-F1)</text>
  <text x="720" y="312" class="math-sm">H<tspan baseline-shift="sub" font-size="74%">oe</tspan>(x) = (4π)<tspan baseline-shift="super" font-size="74%">−1</tspan> ∫<tspan baseline-shift="sub" font-size="74%">Ωc</tspan> [J<tspan baseline-shift="sub" font-size="74%">c</tspan>(x′)×(x−x′)]/|x−x′|<tspan baseline-shift="super" font-size="74%">3</tspan> dV′</text>
  <text x="720" y="336" class="small-bold" fill="#147d75">No μ<tspan baseline-shift="sub" font-size="74%">0</tspan> inside H<tspan baseline-shift="sub" font-size="74%">oe</tspan> (B<tspan baseline-shift="sub" font-size="74%">oe</tspan> = μ<tspan baseline-shift="sub" font-size="74%">0</tspan> H<tspan baseline-shift="sub" font-size="74%">oe</tspan>)</text>
  <text x="720" y="359" class="small">• OE-F1 (FEM CPU): DirectTetraQuadrature</text>
  <text x="728" y="375" class="small">on affine RT0 flux; pair-budget preflight.</text>
  <text x="720" y="397" class="small">• Uniform non-cylindrical fallback:</text>
  <text x="728" y="413" class="small">BiotSavartMidpoint (FDM ≤ 4096 cells;</text>
  <text x="728" y="429" class="small">FEM tet4 centroid with R<tspan baseline-shift="sub" font-size="74%">reg</tspan> cutoff).</text>
  <text x="720" y="453" class="small">No user-facing OE-F1/OE-F2 method flag.</text>
  <rect x="1018" y="264" width="300" height="206" rx="6" fill="#ffffff" stroke="#6f3cc4" stroke-width="1.2"/>
  <text x="1032" y="285" class="sec-head" fill="#6f3cc4">2B. Vector Potential H(curl) (OE-F2)</text>
  <text x="1032" y="312" class="math-sm">∇ × (μ<tspan baseline-shift="sub" font-size="74%">0</tspan><tspan baseline-shift="super" font-size="74%">−1</tspan> ∇ × A) = J<tspan baseline-shift="sub" font-size="74%">c</tspan>   in Ω<tspan baseline-shift="sub" font-size="74%">m</tspan> ∪ Ω<tspan baseline-shift="sub" font-size="74%">air</tspan></text>
  <text x="1032" y="336" class="math-sm">B<tspan baseline-shift="sub" font-size="74%">oe</tspan> = ∇ × A,    H<tspan baseline-shift="sub" font-size="74%">oe</tspan> = B<tspan baseline-shift="sub" font-size="74%">oe</tspan> / μ<tspan baseline-shift="sub" font-size="74%">0</tspan></text>
  <text x="1032" y="359" class="small">• Compatible H<tspan baseline-shift="sub" font-size="74%">0</tspan>(curl) × H<tspan baseline-shift="sub" font-size="74%">0</tspan><tspan baseline-shift="super" font-size="74%">1</tspan> mixed</text>
  <text x="1040" y="375" class="small">gauge formulation enforces ∇·B = 0.</text>
  <text x="1032" y="397" class="small">• Requires exterior airbox closure (Ω<tspan baseline-shift="sub" font-size="74%">air</tspan>)</text>
  <text x="1040" y="413" class="small">and nodal projection onto magnetic mesh.</text>
  <text x="1032" y="435" class="small">• Converges toward OE-F1 under mesh &amp;</text>
  <text x="1040" y="451" class="small">airbox refinement (bounded FEM CPU).</text>
  <rect x="706" y="484" width="612" height="148" rx="6" fill="#eef2f8" stroke="#6e7b91" stroke-width="1.2"/>
  <text x="722" y="505" class="sec-head">Capability &amp; Fail-Closed Realization Separation</text>
  <line x1="720" y1="514" x2="1304" y2="514" stroke="#ccd0da" stroke-width="1"/>
  <text x="724" y="531" class="small-bold">Lane</text>
  <text x="830" y="531" class="small-bold">OerstedCylinder</text>
  <text x="1032" y="531" class="small-bold">OerstedField(source) Solved Current</text>
  <line x1="720" y1="538" x2="1304" y2="538" stroke="#ccd0da" stroke-width="1"/>
  <text x="724" y="556" class="small-bold">FDM CPU</text>
  <text x="830" y="556" class="small" fill="#147d75">Reference analytic path</text>
  <text x="1032" y="556" class="small" fill="#b8392b">UNSUPPORTED (canonical OE-F1/OE-F2 is FEM)</text>
  <text x="724" y="576" class="small-bold">FDM GPU</text>
  <text x="830" y="576" class="small" fill="#1d5fa7">Precomputed (+z, Constant only)</text>
  <text x="1032" y="576" class="small" fill="#b8392b">UNSUPPORTED (no FDM solved-current operator)</text>
  <text x="724" y="596" class="small-bold">FEM CPU</text>
  <text x="830" y="596" class="small" fill="#1d5fa7">Bounded analytic nodal sampling</text>
  <text x="1032" y="596" class="small" fill="#b86b11">Bounded / Reference (Double, Steady only)</text>
  <text x="724" y="616" class="small-bold">FEM GPU</text>
  <text x="830" y="616" class="small" fill="#b86b11">Partial / lane-dependent</text>
  <text x="1032" y="616" class="small" fill="#b8392b">UNSUPPORTED / Semantic-only (no device lane)</text>
  <text x="28" y="672" class="small">Fullmag limits at most one Oersted energy term per problem and rejects stale current-view digests or unsupported GPU lanes fail-closed.</text>
</svg>