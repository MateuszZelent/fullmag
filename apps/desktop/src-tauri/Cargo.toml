[package]
name = "fullmag-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64 = "0.22"
fullmag-application = { path = "../../../crates/fullmag-application" }
fullmag-runtime-control = { path = "../../../crates/fullmag-runtime-control" }
fullmag-workspace = { path = "../../../crates/fullmag-workspace" }
fullmag-workspace-inspect = { path = "../../../crates/fullmag-workspace-inspect" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
rusqlite = "0.37"
tempfile = "3"

[[bin]]
name = "fullmag-ui"
path = "src/main.rs"
