services:
  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    image: fullmag/dev:local
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ./:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
      - pnpm-store:/pnpm/store
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      POSTGRES_URL: postgres://fullmag:${POSTGRES_PASSWORD}@postgres:5432/fullmag
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NATS_URL: nats://nats:4222
    depends_on:
      - postgres
      - minio
      - nats

  fem-gpu:
    build:
      context: .
      dockerfile: docker/fem-gpu/Dockerfile
      args:
        FULLMAG_CUDA_ARCHITECTURES: ${FULLMAG_CUDA_ARCHITECTURES:-80-real;89-real;90-real;90-virtual}
        FULLMAG_HYPRE_GPU_ARCHITECTURES: "${FULLMAG_HYPRE_GPU_ARCHITECTURES:-60 70 80 89 90}"
        FULLMAG_HYPRE_MEMORY_VARIANT: "${FULLMAG_HYPRE_MEMORY_VARIANT:-baseline}"
    image: ${FULLMAG_FEM_GPU_IMAGE:-fullmag/fem-gpu:local}
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ./:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
      - pnpm-store:/pnpm/store
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FULLMAG_PYTHON: /usr/bin/python3
      FULLMAG_USE_MFEM_STACK: "ON"
      FULLMAG_FEM_REQUIRE_CEED: "1"
      FULLMAG_FEM_WITH_SLEPC: "ON"
      FULLMAG_FEM_GPU_MIN_NODES: "0"
      FULLMAG_FEM_MFEM_DEVICE: ceed-cuda:/gpu/cuda/shared
      FULLMAG_CUDA_ARCHITECTURES: ${FULLMAG_CUDA_ARCHITECTURES:-80-real;89-real;90-real;90-virtual}
      CMAKE_PREFIX_PATH: /opt/fullmag-deps
      PKG_CONFIG_PATH: /opt/fullmag-deps/lib/pkgconfig:/opt/fullmag-deps/lib64/pkgconfig
      LD_LIBRARY_PATH: /opt/fullmag-deps/lib
    gpus: all
    profiles:
      - gpu
      - fem
      - fem-gpu

  fem-cpu:
    build:
      context: .
      dockerfile: docker/fem-cpu/Dockerfile
    image: fullmag/fem-cpu:local
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ./:/workspace
      - fem-cpu-cargo-cache:/usr/local/cargo/registry
      - fem-cpu-target-cache:/workspace/target
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FULLMAG_PYTHON: /usr/bin/python3
      FULLMAG_USE_MFEM_STACK: "ON"
      FULLMAG_FEM_REQUIRE_GPU: "0"
      FULLMAG_FEM_REQUIRE_CEED: "0"
      FULLMAG_FEM_WITH_SLEPC: "OFF"
      FULLMAG_MANAGED_FEM_DEVICE: cpu
      CMAKE_PREFIX_PATH: /opt/fullmag-deps
      LD_LIBRARY_PATH: /opt/fullmag-deps/lib

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fullmag
      POSTGRES_USER: fullmag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nats:
    image: nats:2.11-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  cargo-cache:
  target-cache:
  fem-cpu-cargo-cache:
  fem-cpu-target-cache:
  pnpm-store:
  postgres-data:
  minio-data:
