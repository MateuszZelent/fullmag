<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" width="1080" height="880" role="img" aria-label="Inspector anatomy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Inspector anatomy</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--line)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--accent)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M5 1v8" stroke="var(--accent)" stroke-width="1.4"/></marker>
</defs>
<style>
  :root{
    --bg:#eff1f5; --panel:#ffffff; --chrome:#e6e9ef; --sunken:#dce0e8;
    --line:#bcc0cc; --line-soft:#ccd0da; --ink:#4c4f69; --muted:#8c8fa1;
    --accent:#1e66f5; --accent-soft:#d3e5fd; --mauve:#8839ef; --green:#40a02b;
    --peach:#fe640b; --red:#d20f39; --yellow:#df8e1d; --teal:#179299;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e2e; --panel:#242438; --chrome:#181825; --sunken:#11111b;
      --line:#45475a; --line-soft:#313244; --ink:#cdd6f4; --muted:#7f849c;
      --accent:#89b4fa; --accent-soft:#2a2d52; --mauve:#cba6f7; --green:#a6e3a1;
      --peach:#fab387; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    }
  }
  .bg{fill:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--line-soft)}
  .chrome{fill:var(--chrome);stroke:var(--line-soft)}
  .sunken{fill:var(--sunken);stroke:var(--line-soft)}
  .box{fill:none;stroke:var(--line);stroke-width:1.2}
  .dash{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:4 3}
  .t{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--ink)}
  .m{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
  .h{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
  .lbl{font-size:11px}
  .sm{font-size:9.5px}
  .xs{font-size:8.5px}
  .acc{fill:var(--accent)}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.3;marker-end:url(#a)}
  .arrow-acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#aa)}
  .dim{fill:none;stroke:var(--accent);stroke-width:1;marker-start:url(#d);marker-end:url(#d)}
</style>
<rect class="bg" width="1080" height="880"/>
<text class="t h" x="40" y="34" text-anchor="start">Inspector — anatomy and tabs</text>
<text class="m sm" x="40" y="50" text-anchor="start">Bound to the selected project; it is the reason the start screen can replace a file dialog</text>
<rect class="sunken" x="56" y="86" width="300" height="118" rx="6"/>
<text class="t sm" x="68" y="103" text-anchor="start">preview 16:10</text>
<path class="arrow-acc" d="M362 145.0 H396"/>
<text class="m xs" x="404" y="149.0" text-anchor="start">last rendered result; hover reveals a frame scrubber and play</text>
<rect class="panel" x="56" y="208" width="300" height="46" rx="4"/>
<text class="t sm" x="68" y="225" text-anchor="start">title + actions</text>
<path class="arrow-acc" d="M362 231.0 H396"/>
<text class="m xs" x="404" y="235.0" text-anchor="start">name 15/650, pin and overflow menu</text>
<rect class="panel" x="56" y="258" width="300" height="22" rx="4"/>
<text class="t sm" x="68" y="275" text-anchor="start">path</text>
<path class="arrow-acc" d="M362 269.0 H396"/>
<text class="m xs" x="404" y="273.0" text-anchor="start">mono 10, ellipsised from the left, copy button</text>
<rect class="panel" x="56" y="284" width="300" height="32" rx="4"/>
<text class="t sm" x="68" y="301" text-anchor="start">chips</text>
<path class="arrow-acc" d="M362 300.0 H396"/>
<text class="m xs" x="404" y="304.0" text-anchor="start">solver · status · rev · schema · tags</text>
<rect class="chrome" x="56" y="320" width="300" height="46" rx="4"/>
<text class="t sm" x="68" y="337" text-anchor="start">context banner</text>
<path class="arrow-acc" d="M362 343.0 H396"/>
<text class="m xs" x="404" y="347.0" text-anchor="start">only when something needs saying: run in progress, failed run, migration, read-only</text>
<rect class="panel" x="56" y="370" width="300" height="30" rx="4"/>
<text class="t sm" x="68" y="387" text-anchor="start">tab bar</text>
<path class="arrow-acc" d="M362 385.0 H396"/>
<text class="m xs" x="404" y="389.0" text-anchor="start">Overview | Authors | History | Runs</text>
<rect class="panel" x="56" y="404" width="300" height="240" rx="4"/>
<text class="t sm" x="68" y="421" text-anchor="start">tab panel</text>
<path class="arrow-acc" d="M362 524.0 H396"/>
<text class="m xs" x="404" y="528.0" text-anchor="start">scrolls; the tab choice persists per session, not per project</text>
<rect class="chrome" x="56" y="648" width="300" height="48" rx="6"/>
<text class="t sm" x="68" y="665" text-anchor="start">action footer</text>
<path class="arrow-acc" d="M362 672.0 H396"/>
<text class="m xs" x="404" y="676.0" text-anchor="start">Open project ▾ (Open a copy · Open read-only · Reveal) + reveal button</text>
<text class="h2" x="56" y="720" text-anchor="start">What each tab answers</text>
<text class="acc sm" x="56" y="750" text-anchor="start">Overview</text>
<text class="t sm" x="142" y="750" text-anchor="start">“Is this the project I mean, and can this machine run it?”</text>
<text class="m xs" x="142" y="764" text-anchor="start">discretisation · cell size · periodicity · material · Ms · Aex · α · interactions · integrator · tolerance · outputs · provenance</text>
<text class="acc sm" x="56" y="788" text-anchor="start">Authors</text>
<text class="t sm" x="142" y="788" text-anchor="start">“Whose work is this, and how do I credit it?”</text>
<text class="m xs" x="142" y="802" text-anchor="start">creator and contributors with affiliation and ORCID · generated BibTeX · DOI when one is registered</text>
<text class="acc sm" x="56" y="826" text-anchor="start">History</text>
<text class="t sm" x="142" y="826" text-anchor="start">“What changed since I last opened it?”</text>
<text class="m xs" x="142" y="840" text-anchor="start">revision timeline: edit / run / migration, author, summary, per-entry restore</text>
<text class="acc sm" x="56" y="864" text-anchor="start">Runs</text>
<text class="t sm" x="142" y="864" text-anchor="start">“What has actually been computed?”</text>
<text class="m xs" x="142" y="878" text-anchor="start">run id · started · duration · device · status · output size · open in the results viewer</text>
</svg>
