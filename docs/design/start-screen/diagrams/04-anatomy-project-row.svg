<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="Project row and card anatomy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Project row and card anatomy</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--line)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--accent)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M5 1v8" stroke="var(--accent)" stroke-width="1.4"/></marker>
</defs>
<style>
  :root{
    --bg:#eff1f5; --panel:#ffffff; --chrome:#e6e9ef; --sunken:#dce0e8;
    --line:#bcc0cc; --line-soft:#ccd0da; --ink:#4c4f69; --muted:#8c8fa1;
    --accent:#1e66f5; --accent-soft:#d3e5fd; --mauve:#8839ef; --green:#40a02b;
    --peach:#fe640b; --red:#d20f39; --yellow:#df8e1d; --teal:#179299;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e2e; --panel:#242438; --chrome:#181825; --sunken:#11111b;
      --line:#45475a; --line-soft:#313244; --ink:#cdd6f4; --muted:#7f849c;
      --accent:#89b4fa; --accent-soft:#2a2d52; --mauve:#cba6f7; --green:#a6e3a1;
      --peach:#fab387; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    }
  }
  .bg{fill:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--line-soft)}
  .chrome{fill:var(--chrome);stroke:var(--line-soft)}
  .sunken{fill:var(--sunken);stroke:var(--line-soft)}
  .box{fill:none;stroke:var(--line);stroke-width:1.2}
  .dash{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:4 3}
  .t{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--ink)}
  .m{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
  .h{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
  .lbl{font-size:11px}
  .sm{font-size:9.5px}
  .xs{font-size:8.5px}
  .acc{fill:var(--accent)}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.3;marker-end:url(#a)}
  .arrow-acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#aa)}
  .dim{fill:none;stroke:var(--accent);stroke-width:1;marker-start:url(#d);marker-end:url(#d)}
</style>
<rect class="bg" width="1080" height="640"/>
<text class="t h" x="40" y="34" text-anchor="start">Project row and card — anatomy</text>
<text class="m sm" x="40" y="50" text-anchor="start">Recent list entry, grid card, and the states a single entry can take</text>
<rect class="panel" x="56" y="96" width="968" height="52" rx="6"/>
<rect class="box" x="64" y="100" width="72" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<rect class="box" x="148" y="100" width="470" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<rect class="box" x="630" y="100" width="74" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<rect class="box" x="716" y="100" width="96" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<rect class="box" x="824" y="100" width="64" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<rect class="box" x="900" y="100" width="78" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<rect class="box" x="990" y="100" width="26" height="44" rx="4" stroke-dasharray="3 3" stroke="var(--accent)"/>
<path class="arrow-acc" d="M100.0 150 V175 H92"/>
<circle cx="100.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="184" text-anchor="start">1</text>
<text class="m xs" x="100" y="184" text-anchor="start">preview thumbnail 72×45 (16:10) — viewport-dark in both themes</text>
<path class="arrow-acc" d="M383.0 150 V197 H92"/>
<circle cx="383.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="206" text-anchor="start">2</text>
<text class="m xs" x="100" y="206" text-anchor="start">project name 13/500 + path 10 mono, ellipsised from the left</text>
<path class="arrow-acc" d="M667.0 150 V219 H92"/>
<circle cx="667.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="228" text-anchor="start">3</text>
<text class="m xs" x="100" y="228" text-anchor="start">solver badge — FDM blue / FEM mauve</text>
<path class="arrow-acc" d="M764.0 150 V241 H92"/>
<circle cx="764.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="250" text-anchor="start">4</text>
<text class="m xs" x="100" y="250" text-anchor="start">status pill — dot + label; the dot pulses while running</text>
<path class="arrow-acc" d="M856.0 150 V263 H92"/>
<circle cx="856.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="272" text-anchor="start">5</text>
<text class="m xs" x="100" y="272" text-anchor="start">size on disk</text>
<path class="arrow-acc" d="M939.0 150 V285 H92"/>
<circle cx="939.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="294" text-anchor="start">6</text>
<text class="m xs" x="100" y="294" text-anchor="start">last opened, relative</text>
<path class="arrow-acc" d="M1003.0 150 V307 H92"/>
<circle cx="1003.0" cy="150" r="2" fill="var(--accent)"/>
<text class="acc xs" x="70" y="316" text-anchor="start">7</text>
<text class="m xs" x="100" y="316" text-anchor="start">pin — appears on hover, stays visible when pinned</text>
<text class="h2" x="56" y="86" text-anchor="start">Row — comfortable density, 52 px</text>
<text class="h2" x="56" y="356" text-anchor="start">Row states</text>
<rect class="chrome" x="56" y="370" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="384" text-anchor="start">default</text>
<text class="m xs" x="220" y="384" text-anchor="start">transparent background</text>
<rect class="chrome" x="56" y="396" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="410" text-anchor="start">hover</text>
<text class="m xs" x="220" y="410" text-anchor="start">--fm-bg-surface</text>
<rect class="chrome" x="56" y="422" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="436" text-anchor="start">selected</text>
<text class="m xs" x="220" y="436" text-anchor="start">--fm-bg-selected + accent border (drives the inspector)</text>
<rect class="chrome" x="56" y="448" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="462" text-anchor="start">focus</text>
<text class="m xs" x="220" y="462" text-anchor="start">accent border + 2 px accent-soft ring, keyboard only</text>
<rect class="chrome" x="56" y="474" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="488" text-anchor="start">running</text>
<text class="m xs" x="220" y="488" text-anchor="start">status pill animates; thumbnail shows the live frame</text>
<rect class="chrome" x="56" y="500" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="514" text-anchor="start">missing</text>
<text class="m xs" x="220" y="514" text-anchor="start">55 % opacity, warning glyph for the thumbnail, Locate… in the menu</text>
<rect class="chrome" x="56" y="526" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="540" text-anchor="start">read-only</text>
<text class="m xs" x="220" y="540" text-anchor="start">link glyph after the name, teal status</text>
<rect class="chrome" x="56" y="552" width="150" height="20" rx="4"/>
<text class="t xs" x="66" y="566" text-anchor="start">needs migration</text>
<text class="m xs" x="220" y="566" text-anchor="start">peach status; opening writes a migrated copy</text>
<text class="h2" x="700" y="352" text-anchor="start">Card — grid density, 232 px</text>
<rect class="panel" x="700" y="370" width="232" height="212" rx="8"/>
<rect class="sunken" x="700" y="370" width="232" height="132" rx="8"/>
<text class="m xs" x="712" y="392" text-anchor="start">thumbnail 16:10</text>
<rect class="box" x="710" y="380" width="36" height="16" rx="3" stroke="var(--accent)"/>
<text class="t sm" x="712" y="526" text-anchor="start">name, two lines max</text>
<text class="m xs" x="712" y="546" text-anchor="start">status pill</text>
<text class="m xs" x="850" y="546" text-anchor="start">last opened</text>
<text class="m xs" x="700" y="604" text-anchor="start">Card view drops path, size and solver label into the badge overlay;</text>
<text class="m xs" x="700" y="618" text-anchor="start">it is for recognising a project by its result, not for scanning metadata.</text>
</svg>
