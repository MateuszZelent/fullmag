<text class="m xs" x="710.0" y="468" text-anchor="middle">-4</text>
<rect class="panel" x="744" y="414" width="20" height="26" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/>
<text class="acc xs" x="754.0" y="456" text-anchor="middle">20</text>
<text class="m xs" x="754.0" y="468" text-anchor="middle">-5</text>
<rect class="panel" x="790" y="414" width="24" height="26" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/>
<text class="acc xs" x="802.0" y="456" text-anchor="middle">24</text>
<text class="m xs" x="802.0" y="468" text-anchor="middle">-6</text>
<rect class="panel" x="840" y="414" width="32" height="26" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/>
<text class="acc xs" x="856.0" y="456" text-anchor="middle">32</text>
<text class="m xs" x="856.0" y="468" text-anchor="middle">-8</text>
<text class="h2" x="600" y="504" text-anchor="start">Type scale (start screen)</text>
<text class="t" x="600" y="524" font-size="22" font-weight="650">Aa</text>
<text class="m sm" x="652" y="524" text-anchor="start">h1 — page title</text>
<text class="mono xs" x="1040" y="524" text-anchor="end">22px / 650</text>
<text class="t" x="600" y="556" font-size="15" font-weight="600">Aa</text>
<text class="m sm" x="652" y="556" text-anchor="start">lg — card / inspector title</text>
<text class="mono xs" x="1040" y="556" text-anchor="end">15px / 600</text>
<text class="t" x="600" y="581" font-size="13" font-weight="500">Aa</text>
<text class="m sm" x="652" y="581" text-anchor="start">md — row name, body</text>
<text class="mono xs" x="1040" y="581" text-anchor="end">13px / 500</text>
<text class="t" x="600" y="604" font-size="12" font-weight="500">Aa</text>
<text class="m sm" x="652" y="604" text-anchor="start">sm — secondary</text>
<text class="mono xs" x="1040" y="604" text-anchor="end">12px / 500</text>
<text class="t" x="600" y="626" font-size="11" font-weight="600">Aa</text>
<text class="m sm" x="652" y="626" text-anchor="start">xs — eyebrow, controls</text>
<text class="mono xs" x="1040" y="626" text-anchor="end">11px / 600</text>
<text class="t" x="600" y="647" font-size="10" font-weight="400">Aa</text>
<text class="m sm" x="652" y="647" text-anchor="start">2xs — meta, status bar</text>
<text class="mono xs" x="1040" y="647" text-anchor="end">10px / 400</text>
<text class="h2" x="56" y="614" text-anchor="start">Breakpoints</text>
<text class="m sm" x="56" y="634" text-anchor="start">≥ 1400  full row grid incl. size column   ·   &lt; 1400  size column drops   ·   &lt; 1180  inspector → sheet   ·   &lt; 940  rail → icon rail (56 px)</text>
</svg>
