<text class="mono xs" x="366" y="206.0" text-anchor="start">--fm-space-6</text>
<line class="dim" x1="44" y1="190" x2="44" y2="214"/>
<text class="acc xs" x="38" y="205.0" text-anchor="end">24</text>
<rect class="panel" x="56" y="214" width="300" height="26" rx="4"/>
<text class="t sm" x="68" y="232" text-anchor="start">section eyebrow</text>
<text class="m xs" x="366" y="232" text-anchor="start">11 px, 600, uppercase, tracking .07em</text>
<line class="dim" x1="44" y1="214" x2="44" y2="240"/>
<text class="acc xs" x="38" y="230.0" text-anchor="end">26</text>
<rect class="sunken" x="56" y="240" width="300" height="12" rx="4" stroke-dasharray="3 3"/>
<text class="mono xs" x="366" y="250.0" text-anchor="start">--fm-space-3</text>
<line class="dim" x1="44" y1="240" x2="44" y2="252"/>
<text class="acc xs" x="38" y="249.0" text-anchor="end">12</text>
<rect class="panel" x="56" y="252" width="300" height="110" rx="4"/>
