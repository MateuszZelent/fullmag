<text class="m xs" x="366" y="270" text-anchor="start">continue card / tiles / list</text>
<line class="dim" x1="44" y1="252" x2="44" y2="362"/>
<text class="acc xs" x="38" y="310.0" text-anchor="end">110</text>
<rect class="sunken" x="56" y="362" width="300" height="32" rx="4" stroke-dasharray="3 3"/>
<text class="mono xs" x="366" y="382.0" text-anchor="start">--fm-space-8</text>
<line class="dim" x1="44" y1="362" x2="44" y2="394"/>
<text class="acc xs" x="38" y="381.0" text-anchor="end">32</text>
<rect class="panel" x="56" y="394" width="300" height="26" rx="4"/>
<text class="t sm" x="68" y="412" text-anchor="start">section eyebrow</text>
<line class="dim" x1="44" y1="394" x2="44" y2="420"/>
<text class="acc xs" x="38" y="410.0" text-anchor="end">26</text>
<rect class="sunken" x="56" y="420" width="300" height="12" rx="4" stroke-dasharray="3 3"/>
<text class="mono xs" x="366" y="430.0" text-anchor="start">--fm-space-3</text>
<line class="dim" x1="44" y1="420" x2="44" y2="432"/>
<text class="acc xs" x="38" y="429.0" text-anchor="end">12</text>
<rect class="panel" x="56" y="432" width="300" height="120" rx="4"/>
<text class="t sm" x="68" y="450" text-anchor="start">section body</text>
<line class="dim" x1="44" y1="432" x2="44" y2="552"/>
<text class="acc xs" x="38" y="495.0" text-anchor="end">120</text>
<text class="h2" x="600" y="92" text-anchor="start">List density</text>
<rect class="panel" x="600" y="110" width="440" height="52" rx="6"/>
<text class="t sm" x="612" y="128" text-anchor="start">Comfortable — default</text>
<text class="m xs" x="612" y="143" text-anchor="start">72 × 45 thumbnail, name + path, two lines</text>
<line class="dim" x1="1056" y1="110" x2="1056" y2="162"/>
<text class="acc xs" x="1062" y="139.0" text-anchor="start">52</text>
<rect class="panel" x="600" y="176" width="440" height="38" rx="6"/>
<text class="t sm" x="612" y="194" text-anchor="start">Compact</text>
<text class="m xs" x="612" y="209" text-anchor="start">no thumbnail, single line, path on hover</text>
<line class="dim" x1="1056" y1="176" x2="1056" y2="214"/>
<text class="acc xs" x="1062" y="198.0" text-anchor="start">38</text>
<rect class="panel" x="600" y="228" width="440" height="196" rx="6"/>
<text class="t sm" x="612" y="246" text-anchor="start">Card grid</text>
<text class="m xs" x="612" y="261" text-anchor="start">232 px card, 132 px thumbnail, name + status</text>
<line class="dim" x1="1056" y1="228" x2="1056" y2="424"/>
<text class="acc xs" x="1062" y="329.0" text-anchor="start">196</text>
<text class="h2" x="600" y="400" text-anchor="start">Spacing scale</text>
<rect class="panel" x="600" y="414" width="4" height="26" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/>
<text class="acc xs" x="602.0" y="456" text-anchor="middle">4</text>
<text class="m xs" x="602.0" y="468" text-anchor="middle">-1</text>
<rect class="panel" x="630" y="414" width="8" height="26" rx="3" style="fill:var(--accent-soft);stroke:var(--accent)"/>
<text class="acc xs" x="634.0" y="456" text-anchor="middle">8</text>
<text class="m xs" x="634.0" y="468" text-anchor="middle">-2</text>
