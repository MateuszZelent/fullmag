<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="1160" height="680" role="img" aria-label="Start screen launch flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Start screen launch flow</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--line)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--accent)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M5 1v8" stroke="var(--accent)" stroke-width="1.4"/></marker>
</defs>
<style>
  :root{
    --bg:#eff1f5; --panel:#ffffff; --chrome:#e6e9ef; --sunken:#dce0e8;
    --line:#bcc0cc; --line-soft:#ccd0da; --ink:#4c4f69; --muted:#8c8fa1;
    --accent:#1e66f5; --accent-soft:#d3e5fd; --mauve:#8839ef; --green:#40a02b;
    --peach:#fe640b; --red:#d20f39; --yellow:#df8e1d; --teal:#179299;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e2e; --panel:#242438; --chrome:#181825; --sunken:#11111b;
      --line:#45475a; --line-soft:#313244; --ink:#cdd6f4; --muted:#7f849c;
      --accent:#89b4fa; --accent-soft:#2a2d52; --mauve:#cba6f7; --green:#a6e3a1;
      --peach:#fab387; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    }
  }
  .bg{fill:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--line-soft)}
  .chrome{fill:var(--chrome);stroke:var(--line-soft)}
  .sunken{fill:var(--sunken);stroke:var(--line-soft)}
  .box{fill:none;stroke:var(--line);stroke-width:1.2}
  .dash{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:4 3}
  .t{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--ink)}
  .m{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
  .h{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
  .lbl{font-size:11px}
  .sm{font-size:9.5px}
  .xs{font-size:8.5px}
  .acc{fill:var(--accent)}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.3;marker-end:url(#a)}
  .arrow-acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#aa)}
  .dim{fill:none;stroke:var(--accent);stroke-width:1;marker-start:url(#d);marker-end:url(#d)}
</style>
<rect class="bg" width="1160" height="680"/>
<text class="t h" x="40" y="34" text-anchor="start">Launch flow</text>
<text class="m sm" x="40" y="50" text-anchor="start">From process start to a workspace with a model in it</text>
<rect class="panel" x="40" y="110" width="140" height="44" rx="7"/>
<text class="t sm" x="110.0" y="130" text-anchor="middle">Process start</text>
<text class="m xs" x="110.0" y="146" text-anchor="middle">Tauri shell ready</text>
<path class="arrow" d="M180 132 H216"/>
<polygon class="panel" points="291.0,104 366,132.0 291.0,160 216,132.0" stroke="var(--accent)"/>
<text class="t xs" x="291.0" y="136.0" text-anchor="middle">Last project?</text>
<text class="m xs" x="292" y="96" text-anchor="middle">restore-on-launch setting</text>
<path class="arrow-acc" d="M366 132 H420"/>
<text class="acc xs" x="393" y="124" text-anchor="middle">no</text>
<rect class="panel" x="420" y="110" width="170" height="44" rx="7"/>
<text class="t sm" x="505.0" y="130" text-anchor="middle">Start screen</text>
<text class="m xs" x="505.0" y="146" text-anchor="middle">Home section</text>
<path class="arrow" d="M291 160 V206 H420"/>
<text class="m xs" x="300" y="182" text-anchor="start">yes → open it directly</text>
<rect class="chrome" x="420" y="186" width="170" height="40" rx="7"/>
<text class="t sm" x="505.0" y="206" text-anchor="middle">Workspace</text>
<text class="m xs" x="505.0" y="222" text-anchor="middle">project loaded</text>
<path class="arrow" d="M505 154 V176"/>
<path class="arrow" d="M590 132 H640"/>
<rect class="panel" x="640" y="110" width="170" height="44" rx="7"/>
<text class="t sm" x="725.0" y="130" text-anchor="middle">Scan locations</text>
<text class="m xs" x="725.0" y="146" text-anchor="middle">recent-index.json</text>
<path class="arrow" d="M810 132 H858"/>
<polygon class="panel" points="933.0,100 1008,132.0 933.0,164 858,132.0" stroke="var(--accent)"/>
<text class="t xs" x="933.0" y="136.0" text-anchor="middle">Index OK?</text>
<path class="arrow-acc" d="M933 164 V214 H820 V248"/>
<text class="acc xs" x="941" y="196" text-anchor="start">no</text>
<rect class="chrome" x="640" y="248" width="360" height="40" rx="7"/>
<text class="t sm" x="820.0" y="272.0" text-anchor="middle">Error banner — Rebuild index · Open from disk</text>
<path class="arrow" d="M1008 132 H1058 V300 H1020"/>
<text class="m xs" x="1014" y="124" text-anchor="start">yes</text>
<rect class="panel" x="640" y="300" width="360" height="36" rx="7"/>
<text class="t sm" x="820.0" y="322.0" text-anchor="middle">Recent list rendered, grouped by last opened</text>
<path class="arrow" d="M820 288 V300"/>
<text class="h2" x="40" y="360" text-anchor="start">From the start screen</text>
<rect class="panel" x="40" y="378" width="352" height="76" rx="7"/>
<text class="t sm" x="54" y="400" text-anchor="start">Resume</text>
<text class="acc xs" x="54" y="416" text-anchor="start">Continue card</text>
<text class="m xs" x="54" y="434" text-anchor="start">load checkpoint → workspace, run resumes at t</text>
<path class="arrow" d="M216 454 V464"/>
<rect class="panel" x="412" y="378" width="352" height="76" rx="7"/>
<text class="t sm" x="426" y="400" text-anchor="start">Open recent</text>
<text class="acc xs" x="426" y="416" text-anchor="start">row or card</text>
<text class="m xs" x="426" y="434" text-anchor="start">read .fms → migrate if schema &lt; app → workspace</text>
<path class="arrow" d="M588 454 V464"/>
<rect class="panel" x="784" y="378" width="352" height="76" rx="7"/>
<text class="t sm" x="798" y="400" text-anchor="start">New FDM / FEM</text>
<text class="acc xs" x="798" y="416" text-anchor="start">launch tile</text>
<text class="m xs" x="798" y="434" text-anchor="start">New problem dialog → empty model → workspace</text>
<path class="arrow" d="M960 454 V464"/>
<rect class="panel" x="40" y="470" width="352" height="76" rx="7"/>
<text class="t sm" x="54" y="492" text-anchor="start">From template</text>
<text class="acc xs" x="54" y="508" text-anchor="start">Templates</text>
<text class="m xs" x="54" y="526" text-anchor="start">copy template into the default location → workspace</text>

<rect class="panel" x="412" y="470" width="352" height="76" rx="7"/>
<text class="t sm" x="426" y="492" text-anchor="start">Import</text>
<text class="acc xs" x="426" y="508" text-anchor="start">Import</text>
<text class="m xs" x="426" y="526" text-anchor="start">parse source → import report → confirm → workspace</text>

<rect class="panel" x="784" y="470" width="352" height="76" rx="7"/>
<text class="t sm" x="798" y="492" text-anchor="start">Browse…</text>
<text class="acc xs" x="798" y="508" text-anchor="start">list footer</text>
<text class="m xs" x="798" y="526" text-anchor="start">OS file dialog → same path as Open recent</text>

<rect class="chrome" x="40" y="574" width="1080" height="44" rx="7"/>
<text class="t sm" x="580" y="592" text-anchor="middle">Workspace shell — geometry, solver, viewport</text>
<text class="m xs" x="580" y="608" text-anchor="middle">The start screen unmounts; the project becomes the active session in the menu-bar subtitle.</text>
<text class="m sm" x="40" y="646" text-anchor="start">Every box above is also a command in the Ctrl K palette, so the whole flow is reachable without the mouse.</text>
</svg>
