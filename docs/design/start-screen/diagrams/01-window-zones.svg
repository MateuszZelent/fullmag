<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" role="img" aria-label="Start screen window zones" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Start screen window zones</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--line)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--accent)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M5 1v8" stroke="var(--accent)" stroke-width="1.4"/></marker>
</defs>
<style>
  :root{
    --bg:#eff1f5; --panel:#ffffff; --chrome:#e6e9ef; --sunken:#dce0e8;
    --line:#bcc0cc; --line-soft:#ccd0da; --ink:#4c4f69; --muted:#8c8fa1;
    --accent:#1e66f5; --accent-soft:#d3e5fd; --mauve:#8839ef; --green:#40a02b;
    --peach:#fe640b; --red:#d20f39; --yellow:#df8e1d; --teal:#179299;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e2e; --panel:#242438; --chrome:#181825; --sunken:#11111b;
      --line:#45475a; --line-soft:#313244; --ink:#cdd6f4; --muted:#7f849c;
      --accent:#89b4fa; --accent-soft:#2a2d52; --mauve:#cba6f7; --green:#a6e3a1;
      --peach:#fab387; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    }
  }
  .bg{fill:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--line-soft)}
  .chrome{fill:var(--chrome);stroke:var(--line-soft)}
  .sunken{fill:var(--sunken);stroke:var(--line-soft)}
  .box{fill:none;stroke:var(--line);stroke-width:1.2}
  .dash{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:4 3}
  .t{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--ink)}
  .m{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
  .h{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
  .lbl{font-size:11px}
  .sm{font-size:9.5px}
  .xs{font-size:8.5px}
  .acc{fill:var(--accent)}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.3;marker-end:url(#a)}
  .arrow-acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#aa)}
  .dim{fill:none;stroke:var(--accent);stroke-width:1;marker-start:url(#d);marker-end:url(#d)}
</style>
<rect class="bg" width="1080" height="700"/>
<text class="t h" x="40" y="34" text-anchor="start">Start screen — window zones</text>
<text class="m sm" x="40" y="50" text-anchor="start">Fullmag desktop shell · 1680 × 1000 reference window</text>
<rect class="panel" x="40" y="64" width="1000" height="560" rx="8"/>
<rect class="sunken" x="40" y="64" width="1000" height="26" rx="8"/>
<text class="m sm" x="52" y="81" text-anchor="start">1  Title bar — 32 px · window controls, drag region</text>
<rect class="chrome" x="40" y="90" width="1000" height="34" rx="0"/>
<text class="m sm" x="52" y="111" text-anchor="start">2  Menu bar — 38 px (--fm-menu-height) · brand · File…Help · command search · transport · theme</text>
<rect class="chrome" x="40" y="124" width="210" height="476" rx="0"/>
<text class="t lbl" x="54" y="150" text-anchor="start">3  Rail</text>
<text class="mono xs" x="54" y="168" text-anchor="start">232 px, fixed</text>
<rect class="panel" x="52" y="189" width="186" height="19" rx="4" fill="var(--accent-soft)" stroke="none"/>
<text class="acc sm" x="62" y="202" text-anchor="start">Home</text>
<rect class="box" x="52" y="211" width="186" height="19" rx="4" stroke="none" fill="none"/>
<text class="m sm" x="62" y="224" text-anchor="start">Templates</text>
<rect class="box" x="52" y="233" width="186" height="19" rx="4" stroke="none" fill="none"/>
<text class="m sm" x="62" y="246" text-anchor="start">Import</text>
<rect class="box" x="52" y="255" width="186" height="19" rx="4" stroke="none" fill="none"/>
<text class="m sm" x="62" y="268" text-anchor="start">Learn</text>
<rect class="box" x="52" y="277" width="186" height="19" rx="4" stroke="none" fill="none"/>
<text class="m sm" x="62" y="290" text-anchor="start">Settings</text>
<rect class="box" x="52" y="299" width="186" height="19" rx="4" stroke="none" fill="none"/>
<text class="m sm" x="62" y="312" text-anchor="start">About</text>
<rect class="panel" x="52" y="514" width="186" height="70" rx="6"/>
<text class="m xs" x="62" y="534" text-anchor="start">Compute environment</text>
<text class="t sm" x="62" y="550" text-anchor="start">RTX 4090 · CUDA 12.4</text>
<text class="mono xs" x="62" y="566" text-anchor="start">VRAM 5.8 / 24.0 GB</text>
<rect class="bg" x="250" y="124" width="490" height="476" rx="0" stroke="var(--line-soft)"/>
<text class="t lbl" x="268" y="150" text-anchor="start">4  Content column</text>
<text class="mono xs" x="268" y="168" text-anchor="start">fluid · inner measure capped at 1040 px, centred</text>
<rect class="panel" x="268" y="194" width="454" height="44" rx="6"/>
<text class="t sm" x="280" y="214" text-anchor="start">Page header — greeting, date, affiliation</text>
<rect class="panel" x="268" y="248" width="454" height="86" rx="6"/>
<text class="t sm" x="280" y="268" text-anchor="start">Continue card — interrupted run, progress, resume</text>
<rect class="panel" x="268" y="344" width="454" height="74" rx="6"/>
<text class="t sm" x="280" y="364" text-anchor="start">Launch tiles — FDM · FEM · Template · Import</text>
<rect class="panel" x="268" y="428" width="454" height="150" rx="6"/>
<text class="t sm" x="280" y="448" text-anchor="start">Recent projects — toolbar, grouped list / grid</text>
<text class="m xs" x="280" y="596" text-anchor="start">scrolls independently of rail and inspector</text>
<rect class="panel" x="740" y="124" width="300" height="476" rx="0"/>
<text class="t lbl" x="756" y="150" text-anchor="start">5  Inspector</text>
<text class="mono xs" x="756" y="168" text-anchor="start">364 px · resizable 320–520</text>
<rect class="sunken" x="754" y="182" width="272" height="92" rx="6"/>
<text class="m xs" x="764" y="204" text-anchor="start">preview 16:10 + frame scrubber</text>
<rect class="chrome" x="754" y="284" width="272" height="40" rx="5"/>
<text class="m xs" x="764" y="301" text-anchor="start">title · path · chips</text>
<rect class="chrome" x="754" y="332" width="272" height="32" rx="5"/>
<text class="m xs" x="764" y="349" text-anchor="start">context banner (run / migrate / fail)</text>
<rect class="chrome" x="754" y="372" width="272" height="26" rx="5"/>
<text class="m xs" x="764" y="389" text-anchor="start">Overview | Authors | History | Runs</text>
<rect class="chrome" x="754" y="406" width="272" height="110" rx="5"/>
<text class="m xs" x="764" y="423" text-anchor="start">tab panel</text>
<rect class="chrome" x="754" y="548" width="272" height="34" rx="5"/>
<text class="t xs" x="764" y="569" text-anchor="start">primary action — Open project ▾</text>
<rect class="chrome" x="40" y="600" width="1000" height="24" rx="0"/>
<text class="m sm" x="52" y="616" text-anchor="start">6  Status bar — 26 px (--fm-status-height) · solver state · build · backend · index · update · docs</text>
<line class="dim" x1="40" y1="646" x2="250" y2="646"/>
<text class="acc sm" x="145.0" y="661" text-anchor="middle">232</text>
<line class="dim" x1="250" y1="646" x2="740" y2="646"/>
<text class="acc sm" x="495.0" y="661" text-anchor="middle">fluid  (min 480)</text>
<line class="dim" x1="740" y1="646" x2="1040" y2="646"/>
<text class="acc sm" x="890.0" y="661" text-anchor="middle">364</text>
<text class="m sm" x="40" y="686" text-anchor="start">Below 1180 px the inspector collapses into a sheet opened with Space; below 940 px the rail becomes icon-only (56 px).</text>
</svg>
