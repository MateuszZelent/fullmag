<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-label="Start screen information architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Start screen information architecture</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--line)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--accent)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M5 1v8" stroke="var(--accent)" stroke-width="1.4"/></marker>
</defs>
<style>
  :root{
    --bg:#eff1f5; --panel:#ffffff; --chrome:#e6e9ef; --sunken:#dce0e8;
    --line:#bcc0cc; --line-soft:#ccd0da; --ink:#4c4f69; --muted:#8c8fa1;
    --accent:#1e66f5; --accent-soft:#d3e5fd; --mauve:#8839ef; --green:#40a02b;
    --peach:#fe640b; --red:#d20f39; --yellow:#df8e1d; --teal:#179299;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e2e; --panel:#242438; --chrome:#181825; --sunken:#11111b;
      --line:#45475a; --line-soft:#313244; --ink:#cdd6f4; --muted:#7f849c;
      --accent:#89b4fa; --accent-soft:#2a2d52; --mauve:#cba6f7; --green:#a6e3a1;
      --peach:#fab387; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    }
  }
  .bg{fill:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--line-soft)}
  .chrome{fill:var(--chrome);stroke:var(--line-soft)}
  .sunken{fill:var(--sunken);stroke:var(--line-soft)}
  .box{fill:none;stroke:var(--line);stroke-width:1.2}
  .dash{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:4 3}
  .t{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--ink)}
  .m{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
  .h{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
  .lbl{font-size:11px}
  .sm{font-size:9.5px}
  .xs{font-size:8.5px}
  .acc{fill:var(--accent)}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.3;marker-end:url(#a)}
  .arrow-acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#aa)}
  .dim{fill:none;stroke:var(--accent);stroke-width:1;marker-start:url(#d);marker-end:url(#d)}
</style>
<rect class="bg" width="1120" height="720"/>
<text class="t h" x="40" y="34" text-anchor="start">Information architecture</text>
<text class="m sm" x="40" y="50" text-anchor="start">What the start screen holds, and where each thing lives</text>
<rect class="panel" x="56" y="92" width="190" height="40" rx="7" stroke="var(--accent)"/>
<text class="t lbl" x="70" y="117" text-anchor="start">Start screen</text>
<rect class="panel" x="56" y="184" width="168" height="220" rx="7"/>
<rect class="chrome" x="56" y="184" width="168" height="26" rx="7"/>
<text class="t lbl" x="68" y="202" text-anchor="start">Home</text>
<text class="m xs" x="68" y="228" text-anchor="start">Greeting — user, date, affiliation</text>
<text class="m xs" x="68" y="244" text-anchor="start">Continue — interrupted run</text>
<text class="m xs" x="78" y="260" text-anchor="start">progress, t, ETA, device</text>
<text class="m xs" x="78" y="276" text-anchor="start">Resume · Open · Discard</text>
<text class="m xs" x="68" y="292" text-anchor="start">Launch tiles</text>
<text class="m xs" x="78" y="308" text-anchor="start">New FDM · New FEM</text>
<text class="m xs" x="78" y="324" text-anchor="start">From template · Import</text>
<text class="m xs" x="68" y="340" text-anchor="start">Recent projects</text>
<text class="m xs" x="78" y="356" text-anchor="start">search · filter · sort · view</text>
<text class="m xs" x="78" y="372" text-anchor="start">grouped list or card grid</text>
<text class="m xs" x="78" y="388" text-anchor="start">Browse… · Clear list</text>
<path class="arrow" d="M84 132 V162 H140.0 V182"/>
<rect class="panel" x="234" y="184" width="168" height="188" rx="7"/>
<rect class="chrome" x="234" y="184" width="168" height="26" rx="7"/>
<text class="t lbl" x="246" y="202" text-anchor="start">Templates</text>
<text class="m xs" x="246" y="228" text-anchor="start">Gallery of ready studies</text>
<text class="m xs" x="256" y="244" text-anchor="start">µMAG SP#1 … SP#5</text>
<text class="m xs" x="256" y="260" text-anchor="start">dispersion · FMR</text>
<text class="m xs" x="256" y="276" text-anchor="start">magnonic crystal bands</text>
<text class="m xs" x="256" y="292" text-anchor="start">skyrmion phase diagram</text>
<text class="m xs" x="256" y="308" text-anchor="start">domain-wall motion</text>
<text class="m xs" x="256" y="324" text-anchor="start">vortex gyration</text>
<text class="m xs" x="246" y="340" text-anchor="start">Per card: solver, runtime,</text>
<text class="m xs" x="246" y="356" text-anchor="start">VRAM, reference it reproduces</text>
<path class="arrow" d="M84 132 V162 H318.0 V182"/>
<rect class="panel" x="412" y="184" width="168" height="156" rx="7"/>
<rect class="chrome" x="412" y="184" width="168" height="26" rx="7"/>
<text class="t lbl" x="424" y="202" text-anchor="start">Import</text>
<text class="m xs" x="424" y="228" text-anchor="start">OOMMF .mif</text>
<text class="m xs" x="424" y="244" text-anchor="start">mumax³ .mx3</text>
<text class="m xs" x="424" y="260" text-anchor="start">COMSOL .mph</text>
<text class="m xs" x="424" y="276" text-anchor="start">Fullmag archive .fms</text>
<text class="m xs" x="424" y="292" text-anchor="start">Mesh .stl / .vtk / .msh</text>
<text class="m xs" x="424" y="308" text-anchor="start">Field .ovf / .omf / .npy</text>
<text class="m xs" x="424" y="324" text-anchor="start">Drop target + import report</text>
<path class="arrow" d="M84 132 V162 H496.0 V182"/>
<rect class="panel" x="590" y="184" width="168" height="140" rx="7"/>
<rect class="chrome" x="590" y="184" width="168" height="26" rx="7"/>
<text class="t lbl" x="602" y="202" text-anchor="start">Learn</text>
<text class="m xs" x="602" y="228" text-anchor="start">What&#x27;s new — release notes</text>
<text class="m xs" x="602" y="244" text-anchor="start">Keyboard map</text>
<text class="m xs" x="602" y="260" text-anchor="start">Documentation</text>
<text class="m xs" x="602" y="276" text-anchor="start">Tutorials</text>
<text class="m xs" x="602" y="292" text-anchor="start">µMAG benchmarks</text>
<text class="m xs" x="602" y="308" text-anchor="start">Report an issue</text>
<path class="arrow" d="M84 132 V162 H674.0 V182"/>
<rect class="panel" x="768" y="184" width="168" height="124" rx="7"/>
<rect class="chrome" x="768" y="184" width="168" height="26" rx="7"/>
<text class="t lbl" x="780" y="202" text-anchor="start">Settings</text>
<text class="m xs" x="780" y="228" text-anchor="start">Startup behaviour</text>
<text class="m xs" x="780" y="244" text-anchor="start">Project locations + index</text>
<text class="m xs" x="780" y="260" text-anchor="start">Compute backend</text>
<text class="m xs" x="780" y="276" text-anchor="start">Appearance / density</text>
<text class="m xs" x="780" y="292" text-anchor="start">→ All settings dialog</text>
<path class="arrow" d="M84 132 V162 H852.0 V182"/>
<rect class="panel" x="946" y="184" width="168" height="140" rx="7"/>
<rect class="chrome" x="946" y="184" width="168" height="26" rx="7"/>
<text class="t lbl" x="958" y="202" text-anchor="start">About</text>
<text class="m xs" x="958" y="228" text-anchor="start">Version, commit, channel</text>
<text class="m xs" x="958" y="244" text-anchor="start">Runtime stack + versions</text>
<text class="m xs" x="958" y="260" text-anchor="start">Team (AG Magnonics, RPTU)</text>
<text class="m xs" x="958" y="276" text-anchor="start">Citation — BibTeX</text>
<text class="m xs" x="958" y="292" text-anchor="start">Third-party licences</text>
<text class="m xs" x="958" y="308" text-anchor="start">Copy diagnostics</text>
<path class="arrow" d="M84 132 V162 H1030.0 V182"/>
<rect class="panel" x="56" y="470" width="1008" height="118" rx="7" stroke="var(--accent)"/>
<text class="t lbl" x="70" y="492" text-anchor="start">Inspector — context pane, right-hand column</text>
<text class="m xs" x="70" y="508" text-anchor="start">Bound to the selection in the centre column. Empty-state copy differs per section.</text>
<text class="acc sm" x="70" y="534" text-anchor="start">Overview</text>
<text class="m xs" x="70" y="550" text-anchor="start">· discretisation, cell size</text>
<text class="m xs" x="70" y="563" text-anchor="start">· periodicity, material</text>
<text class="m xs" x="70" y="576" text-anchor="start">· Ms, Aex, α, interactions</text>
<text class="m xs" x="70" y="589" text-anchor="start">· integrator, tolerance</text>
<text class="m xs" x="70" y="602" text-anchor="start">· outputs, provenance</text>
<text class="acc sm" x="318" y="534" text-anchor="start">Authors</text>
<text class="m xs" x="318" y="550" text-anchor="start">· creator / contributors</text>
<text class="m xs" x="318" y="563" text-anchor="start">· affiliation, ORCID</text>
<text class="m xs" x="318" y="576" text-anchor="start">· role</text>
<text class="m xs" x="318" y="589" text-anchor="start">· BibTeX + DOI</text>
<text class="acc sm" x="566" y="534" text-anchor="start">History</text>
<text class="m xs" x="566" y="550" text-anchor="start">· revision timeline</text>
<text class="m xs" x="566" y="563" text-anchor="start">· edit / run / migrate</text>
<text class="m xs" x="566" y="576" text-anchor="start">· author + summary</text>
<text class="m xs" x="566" y="589" text-anchor="start">· restore a revision</text>
<text class="acc sm" x="814" y="534" text-anchor="start">Runs</text>
<text class="m xs" x="814" y="550" text-anchor="start">· run id, start, duration</text>
<text class="m xs" x="814" y="563" text-anchor="start">· device, status</text>
<text class="m xs" x="814" y="576" text-anchor="start">· output size</text>
<text class="m xs" x="814" y="589" text-anchor="start">· open results viewer</text>
<text class="h2" x="56" y="618" text-anchor="start">Cross-cutting</text>
<rect class="chrome" x="56" y="630" width="326" height="52" rx="6"/>
<text class="t sm" x="68" y="650" text-anchor="start">Command palette (Ctrl K)</text>
<text class="m xs" x="68" y="666" text-anchor="start">every start-screen action is a command — same registry as the workspace</text>
<rect class="chrome" x="396" y="630" width="326" height="52" rx="6"/>
<text class="t sm" x="408" y="650" text-anchor="start">Status bar</text>
<text class="m xs" x="408" y="666" text-anchor="start">solver state · build · compute backend · index health · update · docs</text>
<rect class="chrome" x="736" y="630" width="326" height="52" rx="6"/>
<text class="t sm" x="748" y="650" text-anchor="start">Compute environment widget</text>
<text class="m xs" x="748" y="666" text-anchor="start">GPU / CUDA / VRAM, CPU fallback warning, link to compute settings</text>
</svg>
