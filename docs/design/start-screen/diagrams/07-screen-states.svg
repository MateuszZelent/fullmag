<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-label="Start screen states" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Start screen states</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--line)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 9 5 0 9z" fill="var(--accent)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M5 1v8" stroke="var(--accent)" stroke-width="1.4"/></marker>
</defs>
<style>
  :root{
    --bg:#eff1f5; --panel:#ffffff; --chrome:#e6e9ef; --sunken:#dce0e8;
    --line:#bcc0cc; --line-soft:#ccd0da; --ink:#4c4f69; --muted:#8c8fa1;
    --accent:#1e66f5; --accent-soft:#d3e5fd; --mauve:#8839ef; --green:#40a02b;
    --peach:#fe640b; --red:#d20f39; --yellow:#df8e1d; --teal:#179299;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e2e; --panel:#242438; --chrome:#181825; --sunken:#11111b;
      --line:#45475a; --line-soft:#313244; --ink:#cdd6f4; --muted:#7f849c;
      --accent:#89b4fa; --accent-soft:#2a2d52; --mauve:#cba6f7; --green:#a6e3a1;
      --peach:#fab387; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    }
  }
  .bg{fill:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--line-soft)}
  .chrome{fill:var(--chrome);stroke:var(--line-soft)}
  .sunken{fill:var(--sunken);stroke:var(--line-soft)}
  .box{fill:none;stroke:var(--line);stroke-width:1.2}
  .dash{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:4 3}
  .t{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--ink)}
  .m{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
  .h{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
  .lbl{font-size:11px}
  .sm{font-size:9.5px}
  .xs{font-size:8.5px}
  .acc{fill:var(--accent)}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.3;marker-end:url(#a)}
  .arrow-acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#aa)}
  .dim{fill:none;stroke:var(--accent);stroke-width:1;marker-start:url(#d);marker-end:url(#d)}
</style>
<rect class="bg" width="1120" height="640"/>
<text class="t h" x="40" y="34" text-anchor="start">Screen states</text>
<text class="m sm" x="40" y="50" text-anchor="start">What the Home section shows for each condition of the recent index</text>
<rect class="panel" x="40" y="92" width="336" height="228" rx="8"/>
<rect x="40" y="92" width="4" height="228" rx="2" fill="var(--teal)"/>
<text class="t lbl" x="58" y="118" text-anchor="start">First run</text>
<text class="m xs" x="58" y="134" text-anchor="start">no index, no projects</text>
<line class="box" x1="58" y1="148" x2="358" y2="148"/>
<text class="m sm" x="58" y="170" text-anchor="start">· Hero: Welcome to Fullmag</text>
<text class="m sm" x="58" y="188" text-anchor="start">· Launch tiles, full width</text>
<text class="m sm" x="58" y="206" text-anchor="start">· Three suggested templates</text>
<text class="m sm" x="58" y="224" text-anchor="start">· Compute environment banner</text>
<text class="m sm" x="58" y="242" text-anchor="start">· No Continue card, no list</text>
<text class="m sm" x="58" y="260" text-anchor="start">· Inspector: what a selection shows</text>
<rect class="panel" x="396" y="92" width="336" height="228" rx="8"/>
<rect x="396" y="92" width="4" height="228" rx="2" fill="var(--muted)"/>
<text class="t lbl" x="414" y="118" text-anchor="start">Loading</text>
<text class="m xs" x="414" y="134" text-anchor="start">scan in progress</text>
<line class="box" x1="414" y1="148" x2="714" y2="148"/>
<text class="m sm" x="414" y="170" text-anchor="start">· Greeting + “Scanning locations…”</text>
<text class="m sm" x="414" y="188" text-anchor="start">· Six skeleton rows, staggered 24 ms</text>
<text class="m sm" x="414" y="206" text-anchor="start">· Launch tiles stay interactive</text>
<text class="m sm" x="414" y="224" text-anchor="start">· Toolbar disabled, not hidden</text>
<text class="m sm" x="414" y="242" text-anchor="start">· Resolves in place — no layout jump</text>
<rect class="panel" x="752" y="92" width="336" height="228" rx="8"/>
<rect x="752" y="92" width="4" height="228" rx="2" fill="var(--green)"/>
<text class="t lbl" x="770" y="118" text-anchor="start">Loaded</text>
<text class="m xs" x="770" y="134" text-anchor="start">the normal case</text>
<line class="box" x1="770" y1="148" x2="1070" y2="148"/>
<text class="m sm" x="770" y="170" text-anchor="start">· Continue card when a run was interrupted</text>
<text class="m sm" x="770" y="188" text-anchor="start">· Launch tiles</text>
<text class="m sm" x="770" y="206" text-anchor="start">· Grouped recent list: Today / Yesterday /</text>
<text class="m sm" x="770" y="224" text-anchor="start">· Earlier this week / Older</text>
<text class="m sm" x="770" y="242" text-anchor="start">· Inspector bound to the selection</text>
<rect class="panel" x="40" y="346" width="336" height="228" rx="8"/>
<rect x="40" y="346" width="4" height="228" rx="2" fill="var(--yellow)"/>
<text class="t lbl" x="58" y="372" text-anchor="start">Empty filter</text>
<text class="m xs" x="58" y="388" text-anchor="start">index fine, query matches nothing</text>
<line class="box" x1="58" y1="402" x2="358" y2="402"/>
<text class="m sm" x="58" y="424" text-anchor="start">· Toolbar keeps the query visible</text>
<text class="m sm" x="58" y="442" text-anchor="start">· Inline empty state inside the section</text>
<text class="m sm" x="58" y="460" text-anchor="start">· “Clear the filter to see all N”</text>
<text class="m sm" x="58" y="478" text-anchor="start">· Launch tiles and Continue stay put</text>
<rect class="panel" x="396" y="346" width="336" height="228" rx="8"/>
<rect x="396" y="346" width="4" height="228" rx="2" fill="var(--red)"/>
<text class="t lbl" x="414" y="372" text-anchor="start">Index error</text>
<text class="m xs" x="414" y="388" text-anchor="start">recent-index.json unreadable</text>
<line class="box" x1="414" y1="402" x2="714" y2="402"/>
<text class="m sm" x="414" y="424" text-anchor="start">· Danger banner with the parse error</text>
<text class="m sm" x="414" y="442" text-anchor="start">· Rebuild index · Show file</text>
<text class="m sm" x="414" y="460" text-anchor="start">· Launch tiles stay — work is not blocked</text>
<text class="m sm" x="414" y="478" text-anchor="start">· Section empty state offers Open project…</text>
<text class="m sm" x="414" y="496" text-anchor="start">· Status bar: “index unavailable”</text>
<rect class="panel" x="752" y="346" width="336" height="228" rx="8"/>
<rect x="752" y="346" width="4" height="228" rx="2" fill="var(--peach)"/>
<text class="t lbl" x="770" y="372" text-anchor="start">Degraded compute</text>
<text class="m xs" x="770" y="388" text-anchor="start">no GPU detected</text>
<line class="box" x1="770" y1="402" x2="1070" y2="402"/>
<text class="m sm" x="770" y="424" text-anchor="start">· Environment widget turns amber</text>
<text class="m sm" x="770" y="442" text-anchor="start">· “CPU fallback — roughly 40× slower”</text>
<text class="m sm" x="770" y="460" text-anchor="start">· Templates show CPU runtime estimates</text>
<text class="m sm" x="770" y="478" text-anchor="start">· Warning repeated before a run starts</text>
<text class="m sm" x="40" y="614" text-anchor="start">Rule: a failure of the recent index never blocks creating or opening a project. The launch tiles are present in every state.</text>
</svg>
