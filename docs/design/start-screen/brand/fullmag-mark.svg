<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fullmag" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fullmag</title>
  <desc>Two interlocking rings: the left carries a structured square grid (FDM), the right an unstructured triangular mesh (FEM). Redrawn as light vector geometry from docs/fullmag-logo-traced-optimized.svg, which is a 1.4 MB bitmap trace and unusable at UI sizes.</desc>
  <defs>
    <linearGradient id="fm-g-fdm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89dceb"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="fm-g-fem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#f5c2e7"/>
    </linearGradient>

    <!-- structured grid — finite difference -->
    <pattern id="fm-p-grid" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
      <path d="M3.2 0H0v3.2" fill="none" stroke="#11111b" stroke-width=".55" opacity=".5"/>
    </pattern>
    <!-- unstructured mesh — finite element -->
    <pattern id="fm-p-mesh" width="5.4" height="4.7" patternUnits="userSpaceOnUse">
      <path d="M0 4.7 2.7 0l2.7 4.7M-2.7 0h10.8M-2.7 4.7h10.8" fill="none" stroke="#11111b" stroke-width=".55" opacity=".45"/>
    </pattern>

    <mask id="fm-m-left">
      <circle cx="23" cy="32" r="13" fill="none" stroke="#fff" stroke-width="9"/>
    </mask>
    <mask id="fm-m-right">
      <circle cx="41" cy="32" r="13" fill="none" stroke="#fff" stroke-width="9"/>
    </mask>
  </defs>

  <!-- left ring — FDM -->
  <g>
    <circle cx="23" cy="32" r="13" fill="none" stroke="url(#fm-g-fdm)" stroke-width="9"/>
    <rect width="64" height="64" fill="url(#fm-p-grid)" mask="url(#fm-m-left)"/>
  </g>

  <!-- right ring — FEM, laid over the left -->
  <g>
    <circle cx="41" cy="32" r="13" fill="none" stroke="url(#fm-g-fem)" stroke-width="9"/>
    <rect width="64" height="64" fill="url(#fm-p-mesh)" mask="url(#fm-m-right)"/>
  </g>

  <!-- the left ring returns over the right at the upper crossing: the two
       methods interlock rather than sit side by side -->
  <g>
    <path d="M27.45 19.78A13 13 0 0 1 35.21 27.55" fill="none" stroke="url(#fm-g-fdm)" stroke-width="9" stroke-linecap="butt"/>
    <path d="M27.45 19.78A13 13 0 0 1 35.21 27.55" fill="none" stroke="url(#fm-p-grid)" stroke-width="9" stroke-linecap="butt"/>
  </g>
</svg>
