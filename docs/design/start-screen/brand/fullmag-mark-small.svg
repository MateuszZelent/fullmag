<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Fullmag" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fullmag</title>
  <desc>Small-size mark: the grid and mesh textures are dropped below ~40 px, where they turn to noise. The interlock and the FDM/FEM gradient pair carry the identity.</desc>
  <defs>
    <linearGradient id="fm-s-fdm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89dceb"/><stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="fm-s-fem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe"/><stop offset="1" stop-color="#f5c2e7"/>
    </linearGradient>
  </defs>
  <circle cx="11.5" cy="16" r="6.5" fill="none" stroke="url(#fm-s-fdm)" stroke-width="4.5"/>
  <circle cx="20.5" cy="16" r="6.5" fill="none" stroke="url(#fm-s-fem)" stroke-width="4.5"/>
  <path d="M13.72 9.89A6.5 6.5 0 0 1 17.6 13.77" fill="none" stroke="url(#fm-s-fdm)" stroke-width="4.5"/>
</svg>
