<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fullmag" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fullmag</title>
  <desc>App icon: the mark on the dark viewport background, matching the original traced logo's framing. Used in the title bar, the rail identity block and the task bar.</desc>
  <defs>
    <linearGradient id="fm-i-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/><stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="fm-i-fdm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89dceb"/><stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="fm-i-fem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe"/><stop offset="1" stop-color="#f5c2e7"/>
    </linearGradient>
    <pattern id="fm-i-grid" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
      <path d="M3.2 0H0v3.2" fill="none" stroke="#11111b" stroke-width=".55" opacity=".5"/>
    </pattern>
    <pattern id="fm-i-mesh" width="5.4" height="4.7" patternUnits="userSpaceOnUse">
      <path d="M0 4.7 2.7 0l2.7 4.7M-2.7 0h10.8M-2.7 4.7h10.8" fill="none" stroke="#11111b" stroke-width=".55" opacity=".45"/>
    </pattern>
    <mask id="fm-i-ml"><circle cx="25" cy="32" r="10.5" fill="none" stroke="#fff" stroke-width="7.4"/></mask>
    <mask id="fm-i-mr"><circle cx="39" cy="32" r="10.5" fill="none" stroke="#fff" stroke-width="7.4"/></mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fm-i-bg)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#313244"/>

  <g>
    <circle cx="25" cy="32" r="10.5" fill="none" stroke="url(#fm-i-fdm)" stroke-width="7.4"/>
    <rect width="64" height="64" fill="url(#fm-i-grid)" mask="url(#fm-i-ml)"/>
  </g>
  <g>
    <circle cx="39" cy="32" r="10.5" fill="none" stroke="url(#fm-i-fem)" stroke-width="7.4"/>
    <rect width="64" height="64" fill="url(#fm-i-mesh)" mask="url(#fm-i-mr)"/>
  </g>
  <g>
    <path d="M28.6 22.13A10.5 10.5 0 0 1 34.87 28.4" fill="none" stroke="url(#fm-i-fdm)" stroke-width="7.4"/>
    <path d="M28.6 22.13A10.5 10.5 0 0 1 34.87 28.4" fill="none" stroke="url(#fm-i-grid)" stroke-width="7.4"/>
  </g>
</svg>
