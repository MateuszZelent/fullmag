[package]
name = "fullmag-workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Per-user Fullmag workspace database: recent projects and scripts, usage events, small personal settings."

[dependencies]
anyhow.workspace = true
fullmag-authoring = { path = "../fullmag-authoring" }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
utoipa = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
