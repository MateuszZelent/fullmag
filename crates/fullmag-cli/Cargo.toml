[package]
name = "fullmag-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["fullmag-runner/cuda"]
fem-gpu = ["fullmag-runner/fem-gpu"]
stage-autosave-hdf5 = ["fullmag-runner/stage-autosave-hdf5"]

[[bin]]
name = "fullmag"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fullmag-build-info.workspace = true
fullmag-engine = { path = "../fullmag-engine" }
fullmag-ir = { path = "../fullmag-ir" }
fullmag-plan = { path = "../fullmag-plan" }
fullmag-runner = { path = "../fullmag-runner" }
fullmag-session = { path = "../fullmag-session" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rayon = "1.10"
