[build-system]
requires = [
    "setuptools>=77",
    "tomli>=2; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "fullmag"
dynamic = ["version"]
description = "Python DSL and API client for the Fullmag FDM/FEM micromagnetics platform."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mateusz Zelent" }]
keywords = ["micromagnetics", "magnonics", "spintronics", "finite-element", "finite-difference", "LLG"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24,<3",
    "zarr>=2.18,<4",
    "h5py>=3.9,<4",
]

[project.optional-dependencies]
meshing = [
    "gmsh>=4.12,<5",
    "manifold3d>=3,<4",
    "meshio>=5.3,<6",
    "scipy>=1.10,<2",
    "trimesh>=4.2,<5",
]
figures = [
    "Pillow>=10,<13",
]
jupyter = [
    "ipython>=8,<10",
    "matplotlib>=3.7,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[project.urls]
Homepage = "https://github.com/MateuszZelent/fullmag"
Documentation = "https://fullmag.mzelent.pl"
Source = "https://github.com/MateuszZelent/fullmag/tree/master/packages/fullmag-py"
Issues = "https://github.com/MateuszZelent/fullmag/issues"

[project.scripts]
fullmag-python = "fullmag.runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fullmag = ["py.typed"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "fullmag_build_backend.py" },
    { env = "FULLMAG_BUILD_VERSION" },
    { env = "FULLMAG_BUILD_VERSION_FILE" },
    { env = "FULLMAG_RELEASE_VERSION" },
    { env = "FULLMAG_SOURCE_IDENTITY_FILE" },
    { env = "SOURCE_DATE_EPOCH" },
    { git = { commit = true } },
]
