[build-system]
requires = [
    "setuptools>=69",
    "tomli>=2; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "fullmag"
dynamic = ["version"]
description = "Embedded Python DSL for the Fullmag micromagnetics platform."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "zarr>=2.18,<4",
    "h5py>=3.9,<4",
]

[project.optional-dependencies]
meshing = [
    "gmsh>=4.12,<5",
    "manifold3d>=3,<4",
    "meshio>=5.3,<6",
    "scipy>=1.10,<2",
    "trimesh>=4.2,<5",
]
figures = [
    "Pillow>=10,<13",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
fullmag-python = "fullmag.runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fullmag = ["py.typed"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "fullmag_build_backend.py" },
    { env = "FULLMAG_BUILD_VERSION" },
    { env = "FULLMAG_BUILD_VERSION_FILE" },
    { env = "FULLMAG_SOURCE_IDENTITY_FILE" },
    { env = "SOURCE_DATE_EPOCH" },
    { git = { commit = true } },
]
