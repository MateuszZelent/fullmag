# Fullmag development on Docker Desktop. Sources stay in the selected checkout.
# The direct development launcher resolves paths, builds inside the backend
# service at each start, checks Windows storage and records the resolved config.
# Compose project identity is injected by the managed launcher.  The default
# keeps direct config inspection deterministic; selected worktrees override it.
name: ${FULLMAG_COMPOSE_PROJECT:-fullmag-master}

x-fullmag-bounded-logging: &fullmag-bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-fullmag-source-labels: &fullmag-source-labels
  org.fullmag.source.project-id: ${FULLMAG_SOURCE_PROJECT_ID:-unknown}
  org.fullmag.source.worktree-id: ${FULLMAG_SOURCE_WORKTREE_ID:-unknown}
  org.fullmag.source.checkout-kind: ${FULLMAG_SOURCE_CHECKOUT_KIND:-unknown}
  org.fullmag.compose.project: ${FULLMAG_COMPOSE_PROJECT:-fullmag-master}

services:
  development-base:
    profiles: ["image-build"]
    labels: *fullmag-source-labels
    logging: *fullmag-bounded-logging
    image: ${FULLMAG_DEVELOPMENT_BASE_IMAGE:-fullmag/development-base:local}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/all-in-one/Dockerfile.dev
      args:
        RUNTIME_BASE: ${FULLMAG_TOOLCHAIN_IMAGE:?Pin the selected Docker FEM toolchain}
        FULLMAG_TOOLCHAIN_IMAGE_ID: ${FULLMAG_TOOLCHAIN_IMAGE_ID:?Pin the immutable toolchain image identity}
        FULLMAG_DIRECT_DEVELOPMENT_CONTEXT_SCHEMA: ${FULLMAG_DIRECT_DEVELOPMENT_CONTEXT_SCHEMA:-fullmag.direct-compose.development-base-context.v1}
        FULLMAG_DIRECT_DEVELOPMENT_CONTEXT_SHA256: ${FULLMAG_DIRECT_DEVELOPMENT_CONTEXT_SHA256:-pending}
    entrypoint: ["/bin/true"]

  backend-cache-volume-maintenance:
    profiles: ["backend-cache-maintenance"]
    logging: *fullmag-bounded-logging
    labels:
      com.fullmag.source.project-id: ${FULLMAG_SOURCE_PROJECT_ID:-unknown}
      com.fullmag.source.worktree-id: ${FULLMAG_SOURCE_WORKTREE_ID:-unknown}
      com.fullmag.compose.project: ${FULLMAG_COMPOSE_PROJECT:-fullmag-master}
    image: ${FULLMAG_RUNTIME_IMAGE_ID:-fullmag/fullmag-dev:local}
    pull_policy: never
    user: "0:0"
    read_only: true
    privileged: false
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    entrypoint: ["/usr/local/bin/python3", "/opt/fullmag/backend_volume_cache_maintenance.py"]
    command: ["ensure"]
    environment:
      FULLMAG_BACKEND_CACHE_SCHEMA: ${FULLMAG_BACKEND_CACHE_SCHEMA:-}
      FULLMAG_BACKEND_CACHE_PROFILE: ${FULLMAG_BACKEND_CACHE_PROFILE:-}
      FULLMAG_BACKEND_CACHE_PROJECT_ID: ${FULLMAG_BACKEND_CACHE_PROJECT_ID:-}
      FULLMAG_BACKEND_CACHE_KEY: ${FULLMAG_BACKEND_CACHE_KEY:-}
      FULLMAG_BACKEND_CACHE_UNIT_KEY: ${FULLMAG_BACKEND_CACHE_UNIT_KEY:-}
      FULLMAG_BACKEND_CACHE_OWNER_ID: ${FULLMAG_BACKEND_CACHE_OWNER_ID:-}
      FULLMAG_BACKEND_CACHE_WORKTREE_ID: ${FULLMAG_BACKEND_CACHE_WORKTREE_ID:-}
      FULLMAG_BACKEND_CACHE_TOOLCHAIN_IMAGE_ID: ${FULLMAG_BACKEND_CACHE_TOOLCHAIN_IMAGE_ID:-}
      FULLMAG_BACKEND_RUNTIME_IMAGE_ID: ${FULLMAG_BACKEND_RUNTIME_IMAGE_ID:-}
      FULLMAG_BACKEND_CARGO_PROFILE: ${FULLMAG_BACKEND_CARGO_PROFILE:-}
      FULLMAG_BACKEND_CACHE_BUILD_VOLUME: ${FULLMAG_BACKEND_CACHE_BUILD_VOLUME:-}
      FULLMAG_BACKEND_CACHE_PACKAGE_VOLUME: ${FULLMAG_BACKEND_CACHE_PACKAGE_VOLUME:-}
      FULLMAG_BUILD_CONTROL_VOLUME: ${FULLMAG_BUILD_CONTROL_VOLUME:-}
      FULLMAG_BACKEND_CACHE_CONTROL_VOLUME: ${FULLMAG_BACKEND_CACHE_CONTROL_VOLUME:-}
      FULLMAG_BACKEND_PACKAGE: ${FULLMAG_BACKEND_PACKAGE:-/opt/fullmag/package}
      FULLMAG_BACKEND_CACHE_BUILD_ROOT: ${FULLMAG_BACKEND_CACHE_BUILD_ROOT:-/build}
      FULLMAG_BACKEND_CACHE_PACKAGE_ROOT: ${FULLMAG_BACKEND_CACHE_PACKAGE_ROOT:-/opt/fullmag/package}
      FULLMAG_BACKEND_CACHE_CONTROL_ROOT: ${FULLMAG_BACKEND_CACHE_CONTROL_ROOT:-/opt/fullmag/control}
      FULLMAG_BACKEND_CACHE_CONTROL_NAMESPACE: ${FULLMAG_BACKEND_CACHE_CONTROL_NAMESPACE:-/opt/fullmag/control/backend}
      FULLMAG_BACKEND_CACHE_RECEIPT: ${FULLMAG_BACKEND_CACHE_RECEIPT:-/opt/fullmag/control/backend/backend-volume-cache-receipt.json}
      FULLMAG_BACKEND_CACHE_MAINTENANCE_PROFILE: ${FULLMAG_BACKEND_CACHE_MAINTENANCE_PROFILE:-}
      FULLMAG_BACKEND_CACHE_MAINTENANCE_ACTION: ${FULLMAG_BACKEND_CACHE_MAINTENANCE_ACTION:-}
      FULLMAG_BACKEND_CACHE_OWNER_UID: ${FULLMAG_BACKEND_CACHE_OWNER_UID:-65532}
      FULLMAG_BACKEND_CACHE_OWNER_GID: ${FULLMAG_BACKEND_CACHE_OWNER_GID:-65532}
    volumes:
      - type: volume
        source: backend-cache-build
        target: /build
        volume: {nocopy: true}
      - type: volume
        source: backend-cache-package
        target: /opt/fullmag/package
        volume: {nocopy: true}
      - type: volume
        source: fullmag-build-control
        target: /opt/fullmag/control
        volume: {nocopy: true}

  backend:
    labels: *fullmag-source-labels
    logging: *fullmag-bounded-logging
    image: ${FULLMAG_DEV_IMAGE:?Prepare the development toolchain image}
    build:
      context: ./docker/all-in-one
      dockerfile: Dockerfile.backend
      args:
        DEV_BASE: ${FULLMAG_DEVELOPMENT_BASE_IMAGE:-fullmag/development-base:local}
        FULLMAG_DIRECT_DEVELOPMENT_CONTEXT_SCHEMA: ${FULLMAG_DIRECT_DEVELOPMENT_CONTEXT_SCHEMA:-pending}
        FULLMAG_DIRECT_DEVELOPMENT_BASE_CONTEXT_SHA256: ${FULLMAG_DIRECT_DEVELOPMENT_BASE_CONTEXT_SHA256:-pending}
        FULLMAG_DIRECT_DEVELOPMENT_BACKEND_CONTEXT_SHA256: ${FULLMAG_DIRECT_DEVELOPMENT_BACKEND_CONTEXT_SHA256:-pending}
        FULLMAG_DIRECT_DEVELOPMENT_RUNTIME_CONTEXT_SHA256: ${FULLMAG_DIRECT_DEVELOPMENT_RUNTIME_CONTEXT_SHA256:-pending}
        FULLMAG_DIRECT_DEVELOPMENT_RECEIPT_SCHEMA: ${FULLMAG_DIRECT_DEVELOPMENT_RECEIPT_SCHEMA:-pending}
    pull_policy: never
    init: true
    user: "65532:65532"
    read_only: true
    cpus: 4
    mem_limit: 8g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    hostname: ${FULLMAG_BACKEND_HOSTNAME:?Managed run hostname is required}
    # Capture the current mounted checkout on every start, build as needed in
    # this same container, then hand the receipt-validated package to runtime.
    # The managed storage probe overrides this command with
    # `serve --storage-probe`; keeping the operation outside the entrypoint
    # preserves that preflight boundary without allowing a shell command from
    # the host.
    entrypoint: ["/usr/local/bin/python3", "/opt/fullmag/backend_dev.py"]
    command:
      - start
      - --source-root
      - /opt/fullmag/source
      - --git-common-root
      - /opt/fullmag/source-git
      - --output
      - /opt/fullmag/package
      - --build-root
      - /build
    environment:
      FULLMAG_DOCKER_ROLE: backend
      FULLMAG_AUTO_CACHE_MAINTENANCE: "1"
      FULLMAG_COMPOSE_PROJECT: ${FULLMAG_COMPOSE_PROJECT:-fullmag-master}
      FULLMAG_SOURCE_HOST_ROOT: ${FULLMAG_SOURCE_ROOT:?Select the Windows source checkout}
      FULLMAG_SESSION_STORAGE_PROFILE: windows-folder-v1
      FULLMAG_RUNTIME_IMAGE_ID: ${FULLMAG_DEV_IMAGE}
      FULLMAG_TOOLCHAIN_IMAGE_ID: ${FULLMAG_TOOLCHAIN_IMAGE_ID:?Pin the toolchain identity}
      FULLMAG_BACKEND_CARGO_PROFILE: ${FULLMAG_BACKEND_CARGO_PROFILE:-backend-dev}
      # Match the baseline backend CPU quota; the managed saved budget
      # updates both this value and the quota when rendering Compose.
      CARGO_BUILD_JOBS: "4"
      FULLMAG_DOCKER_DEVICE_ACCESS: ${FULLMAG_DOCKER_DEVICE_ACCESS:?Resolved device access is required}
      # Bounded operator-probe controls.  These are the only workload
      # variables admitted from the host environment; do not replace this
      # allowlist with an ambient environment passthrough.
      FULLMAG_MIXED_P1_DEVICE: ${FULLMAG_MIXED_P1_DEVICE:-gpu}
      FULLMAG_ARTIFACT_FIELD_STORAGE: ${FULLMAG_ARTIFACT_FIELD_STORAGE:-json}
      FULLMAG_REPO_ROOT: /opt/fullmag/source
      FULLMAG_RUNTIME_PACKAGE_ROOT: /opt/fullmag/package
      FULLMAG_PACKAGE_PROVENANCE: /opt/fullmag/control/backend/runtime-provenance.json
      FULLMAG_RUNTIME_PROVENANCE: /opt/fullmag/control/backend/runtime-provenance.json
      PYTHONPATH: /build/workspace/packages/fullmag-py/src:/opt/fullmag/package
      # Durable workspace metadata is isolated per Compose source group.
      FULLMAG_WORKSPACE_STATE_DIR: /user-data
      FULLMAG_RUNTIME_CONTROL_ROOT: /opt/fullmag/runtime-control
      FULLMAG_RUNTIME_SERVICES_ROOT: /opt/fullmag/runtime-control/runtime-services
      FULLMAG_STATE_ROOT: /opt/fullmag/runtime-control
      FULLMAG_STATE_DIR: /opt/fullmag/runtime-control
      FULLMAG_RUNTIME_SERVICE_CONFIG: /opt/fullmag/runtime-control/runtime-service/docker-all.json
      FULLMAG_RUNTIME_PROCESS_RECEIPT: /opt/fullmag/runtime-control/runtime-service/process-tree.json
      FULLMAG_FEM_MESH_CACHE_DIR: /build/cache/fem-mesh
      CUDA_CACHE_PATH: /build/cache/cuda-compute
    expose: ["8081"]
    volumes:
      # One source selection for both services: the main checkout or a worktree.
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT:?Select the Windows source checkout}
        target: /opt/fullmag/source
        read_only: true
        bind: {create_host_path: false}
      # The live Git common directory is read-only input for the authenticated
      # source manifest.  It is never used as a mutable build workspace.
      - type: bind
        source: ${FULLMAG_SOURCE_GIT_COMMON:?Mount the selected checkout Git common directory}
        target: /opt/fullmag/source-git
        read_only: true
        bind: {create_host_path: false}
      # The v2 cache volumes are external Docker named volumes. The managed
      # launcher resolves their exact names and validates their labels/mounts.
      - type: volume
        source: backend-cache-build
        target: /build
        volume: {nocopy: true}
      - type: volume
        source: backend-cache-package
        target: /opt/fullmag/package
        volume: {nocopy: true}
      - type: volume
        source: fullmag-build-control
        target: /opt/fullmag/control
        volume: {nocopy: true}
      # Runtime ownership, recovery, and process receipts stay in the group's
      # control volume. The same runtime-services subpath is mounted over its
      # native SessionStore compatibility location so sessions/results remain
      # in the Windows-backed /state tree.
      - type: volume
        source: fullmag-build-control
        target: /opt/fullmag/runtime-control
        volume: {nocopy: true, subpath: runtime-control}
      - type: volume
        source: fullmag-build-control
        target: /state/runs/docker-all/session-store/runtime-services
        volume: {nocopy: true, subpath: runtime-control/runtime-services}
      # Per-group durable user data: workspace.db and related settings only.
      # Runtime sessions/results remain in the per-run /state bind below.
      - type: bind
        source: ${FULLMAG_WORKSPACE_STATE_ROOT:?Managed group user-data namespace is required}
        target: /user-data
        bind: {create_host_path: false}
      # Real Windows storage: sessions and simulation results. Build logs,
      # runtime ownership records, compiler caches and provenance live in Docker volumes.
      - type: bind
        source: ${FULLMAG_STATE_ROOT:?Managed Windows storage namespace is required}
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_HOST_CERTIFICATE:?Windows storage admission is required}
        target: /run/fullmag/windows-folder-host.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m"]
    healthcheck:
      # Cold CUDA/FEM compilation runs before the API process exists.  Keep a
      # four-hour start budget aligned with the bounded direct backend build;
      # readiness still requires the existing process-tree, healthz, and
      # native-service checks in healthcheck.py.
      test: ["CMD", "/usr/local/bin/python3", "/opt/fullmag/healthcheck.py"]
      interval: 5s
      timeout: 10s
      start_period: 14400s
      retries: 6
    networks: [fullmag]

  frontend:
    labels: *fullmag-source-labels
    logging: *fullmag-bounded-logging
    image: ${FULLMAG_DEV_IMAGE}
    pull_policy: never
    init: true
    user: "65532:65532"
    read_only: true
    cpus: 4
    # Leave room for Next plus a separate lint/typecheck process and native allocations.
    mem_limit: 16g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    depends_on:
      # The shell must remain reachable while backend admission is closed or
      # its health probe is failing; API requests still use the private proxy.
      backend: {condition: service_started}
    environment:
      FULLMAG_DOCKER_ROLE: frontend
      FULLMAG_DOCKER_FRONTEND: dev
      # Also applies to tools invoked through docker exec; the Next launcher
      # independently pins the same heap budget in its sanitized environment.
      NODE_OPTIONS: --max-old-space-size=6144
      FULLMAG_API_PROXY_TARGET: http://backend:8081
      FULLMAG_WATCHPACK_POLLING_MS: ${FULLMAG_WATCHPACK_POLLING_MS:-5000}
      FULLMAG_SOURCE_ROOT: ${FULLMAG_SOURCE_ROOT:?Select the Windows source checkout}
      FULLMAG_SOURCE_WORKTREE_ID: ${FULLMAG_SOURCE_WORKTREE_ID:?Select a registered source worktree}
      FULLMAG_SOURCE_COMMIT: ${FULLMAG_SOURCE_COMMIT:?Resolve the selected checkout commit}
      FULLMAG_FRONTEND_HOST_PORT: ${FULLMAG_HTTP_PORT:-3197}
      FULLMAG_FRONTEND_SOURCE_CONTAINER_ROOT: /opt/fullmag/source
      FULLMAG_DEVELOPMENT_INPUTS_PATH: ${FULLMAG_DEVELOPMENT_INPUTS_PATH:?Resolve the frontend control-volume manifest path}
      HOME: /state/development
      NVIDIA_VISIBLE_DEVICES: void
    ports: ["127.0.0.1:${FULLMAG_HTTP_PORT:-3197}:8080"]
    volumes:
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT:?Select the Windows source checkout}
        target: /opt/fullmag/source
        read_only: true
        bind: {create_host_path: false}
      # Generated dependencies, Next output, HMR logs, and receipts are mounted
      # from the group's Docker named volumes in compose.frontend-cache.yaml.
      # Only source directories are bind-mounted below, read-only, for HMR.
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/app
        target: /state/development/workspace/apps/control-room/app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/src
        target: /state/development/workspace/apps/control-room/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/public
        target: /state/development/workspace/apps/control-room/public
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/scripts
        target: /state/development/workspace/apps/control-room/scripts
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=512m"
      - "/run/fullmag/frontend-owner:rw,nosuid,nodev,noexec,size=1m,uid=65532,gid=65532,mode=0700"
    healthcheck:
      # Two 120s tool probes + 60m frozen install + 60s Next startup margin.
      start_period: 3900s
    networks: [fullmag]

# A separate project-scoped bridge; no external networks, static IPs or host mode.
networks:
  fullmag:
    # The managed launcher supplies the deterministic short alias when the
    # readable worktree project would exceed Docker's network-name limit.
    name: ${FULLMAG_COMPOSE_NETWORK:-fullmag-master_fullmag}
    labels: *fullmag-source-labels
    driver: bridge
    ipam:
      driver: default

volumes:
  backend-cache-build:
    name: ${FULLMAG_BACKEND_CACHE_BUILD_VOLUME:-fullmag-backend-bootstrap-build}
    external: true
  backend-cache-package:
    name: ${FULLMAG_BACKEND_CACHE_PACKAGE_VOLUME:-fullmag-backend-bootstrap-package}
    external: true
  fullmag-build-control:
    name: ${FULLMAG_BUILD_CONTROL_VOLUME:?Resolve the Compose-group control volume}
    external: true
