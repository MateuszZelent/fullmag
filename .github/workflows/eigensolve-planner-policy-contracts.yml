name: eigensolve-planner-policy-contracts
on:
  workflow_dispatch:
  push:
    branches: ['codex/eigensolve-dispersion-plan-20260912']
    paths:
      - 'crates/fullmag-plan/src/fem.rs'
      - 'crates/fullmag-plan/src/tests.rs'
      - '.github/workflows/eigensolve-planner-policy-contracts.yml'
permissions:
  contents: read
jobs:
  floquet-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preserve source identity
        run: git rev-parse HEAD
      - name: Validate shared-domain all-pairs policy and subset rejection
        run: |
          cargo test --locked -p fullmag-plan --lib tests::fem_eigen_floquet_dynamic_demag_requires_explicit_airbox_cpu_path -- --exact | tee "$RUNNER_TEMP/floquet-policy.log"
          grep -F "test tests::fem_eigen_floquet_dynamic_demag_requires_explicit_airbox_cpu_path ... ok" "$RUNNER_TEMP/floquet-policy.log"
      - name: Preserve generic Floquet planning
        run: |
          cargo test --locked -p fullmag-plan --lib tests::fem_eigen_floquet_bc_with_pairs_and_k_sampling_plans_successfully -- --exact | tee "$RUNNER_TEMP/floquet-generic.log"
          grep -F "test tests::fem_eigen_floquet_bc_with_pairs_and_k_sampling_plans_successfully ... ok" "$RUNNER_TEMP/floquet-generic.log"
      - name: Validate existing public solver policy controls
        run: cargo test --locked -p fullmag-plan --lib fem_eigen_modal_solver_policy -- --nocapture
      - name: Preserve tetra-only eigen tracking admission
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-plan --lib fem_eigen_branch_tracking_ -- --nocapture | tee "$RUNNER_TEMP/eigen-tracking-topology.log"
          grep -F "test tests::fem_eigen_branch_tracking_rejects_prism_topologies_in_planner_guard ... ok" "$RUNNER_TEMP/eigen-tracking-topology.log"
          grep -F "test tests::fem_eigen_branch_tracking_rejects_certified_mixed_eigen_study ... ok" "$RUNNER_TEMP/eigen-tracking-topology.log"
          grep -F "test tests::fem_eigen_branch_tracking_tetra_single_and_path_remain_plannable ... ok" "$RUNNER_TEMP/eigen-tracking-topology.log"
