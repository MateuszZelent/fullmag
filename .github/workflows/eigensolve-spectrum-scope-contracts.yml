name: eigensolve-spectrum-scope-contracts
on:
  workflow_dispatch:
  push:
    branches: ['codex/eigensolve-dispersion-plan-20260912']
    paths:
      - 'crates/fullmag-ir/**'
      - 'crates/fullmag-plan/**'
      - 'crates/fullmag-application/**'
      - 'crates/fullmag-runner/**'
      - 'crates/fullmag-cli/**'
      - 'crates/fullmag-api/**'
      - 'scripts/fullmag_storage.py'
      - '.github/workflows/eigensolve-spectrum-scope-contracts.yml'
permissions:
  contents: read
jobs:
  scope-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: 16777216
      FULLMAG_PROJECT_STORAGE_ROOT: ${{ github.workspace }}/../storage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python runtime for API script round-trip regression
        run: python -m pip install -e packages/fullmag-py
      - name: Resolve canonical project storage for publication tests
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          layout = json.loads(subprocess.check_output([
              sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
              "--profile", "linux-host", "--create",
          ], text=True))
          storage_root = layout["env"]["FULLMAG_PROJECT_STORAGE_ROOT"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"FULLMAG_PROJECT_STORAGE_ROOT={storage_root}\n")
          receipt = {key: layout[key] for key in (
              "repo_root", "project_root", "storage_root", "profile", "worktree_id",
          )}
          receipt["source_sha"] = os.environ.get("GITHUB_SHA")
          receipt_path = os.path.join(os.environ["RUNNER_TEMP"], "scope-storage-preflight.json")
          with open(receipt_path, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2)
              stream.write("\n")
          print(json.dumps(receipt, indent=2))
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preserve exact source identity
        run: git rev-parse HEAD
      - name: Verify authored scopes and unchanged legacy ProblemIR wire format
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-ir --test ir_tests eigen_spectrum_scope_is_typed_and_legacy_wire_defaults_to_per_sample -- --exact --nocapture | tee "$RUNNER_TEMP/eigen-spectrum-scope.log"
          grep -F "eigen_spectrum_scope_is_typed_and_legacy_wire_defaults_to_per_sample ... ok" "$RUNNER_TEMP/eigen-spectrum-scope.log"
      - name: Verify strict public v0.4 root and standalone scope wire adapters
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-ir --test study_v04 spectrum_scope_v04_root_and_standalone_preserve_authoring_intent -- --exact --nocapture | tee "$RUNNER_TEMP/eigen-spectrum-v04.log"
          grep -F "spectrum_scope_v04_root_and_standalone_preserve_authoring_intent ... ok" "$RUNNER_TEMP/eigen-spectrum-v04.log"
      - name: Verify actual antenna version boundaries and root references
        run: |
          set -euo pipefail
          for test_name in v03_antenna_study_selection_rejects_missing_reference v04_typed_study_deserialization_rejects_unsupported_antenna_field_solve v04_migration_rejects_unsupported_antenna_field_solve_atomically v04_antenna_projection_rejects_missing_stage_output_reference; do
            cargo test --locked -p fullmag-ir --test ir_tests "$test_name" -- --exact --nocapture | tee "$RUNNER_TEMP/$test_name.log"
            grep -F "$test_name ... ok" "$RUNNER_TEMP/$test_name.log"
          done
      - name: Run complete IR and planner contracts
        run: cargo test --locked -p fullmag-ir -p fullmag-plan --no-fail-fast
      - name: Run complete application materialization contracts
        run: cargo test --locked -p fullmag-application --lib --no-fail-fast
      - name: Verify scope metadata at actual generic single-k and path producers
        run: |
          set -o pipefail
          for test_name in spectrum_output_scope_union_preserves_authored_and_legacy_requests generic_manifest_reports_the_union_of_requested_spectrum_scopes native_eigen_v2_mode_metadata_preserves_operator_provenance relaxed_path_source_fixture_handoff_is_reused_for_each_nonzero_k_sample_without_per_sample_relaxation; do
            cargo test --locked -p fullmag-runner --lib "$test_name" -- --nocapture | tee "$RUNNER_TEMP/$test_name.log"
            grep -F "$test_name ... ok" "$RUNNER_TEMP/$test_name.log"
          done
      - name: Verify immutable FEM eigen producer and legacy protection
        run: |
          set -o pipefail
          for test_name in fem_eigen_writer_publishes_two_immutable_generations_and_preserves_legacy_root write_artifacts_refuses_eigen_auxiliary_when_immutable_generation_marker_exists all_active_planned_entrypoints_preserve_exact_k0_dispatch_and_persisted_provenance; do
            cargo test --locked -p fullmag-runner --lib "$test_name" -- --nocapture | tee "$RUNNER_TEMP/$test_name.log"
            grep -F "$test_name ... ok" "$RUNNER_TEMP/$test_name.log"
          done
      - name: Run complete runner contracts
        run: cargo test --locked -p fullmag-runner --lib --no-fail-fast
      - name: Verify typed committed scene on the authoring transaction route
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::authoring_transactions_create_transform_and_delete_objects -- --exact --nocapture | tee "$RUNNER_TEMP/authoring-transaction-resource.log"
          grep -F "router_v2::tests::authoring_transactions_create_transform_and_delete_objects ... ok" "$RUNNER_TEMP/authoring-transaction-resource.log"
      - name: Verify named API hysteresis, field topology, and Python sync regressions
        env:
          FULLMAG_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::handlers::simulation::runtime::hysteresis_invalidation_tests::invalidation_does_not_follow_hysteresis_kind_from_a_different_active_stage -- --exact --nocapture | tee "$RUNNER_TEMP/runtime-hysteresis-invalidation.log"
          grep -F "router_v2::handlers::simulation::runtime::hysteresis_invalidation_tests::invalidation_does_not_follow_hysteresis_kind_from_a_different_active_stage ... ok" "$RUNNER_TEMP/runtime-hysteresis-invalidation.log"
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::topological_charge_uses_fdm_field_topology_with_retained_fem_mesh -- --exact --nocapture | tee "$RUNNER_TEMP/topological-charge-field-topology.log"
          grep -F "router_v2::tests::topological_charge_uses_fdm_field_topology_with_retained_fem_mesh ... ok" "$RUNNER_TEMP/topological-charge-field-topology.log"
          cargo test --locked -p fullmag-api --bin fullmag-api script::tests::scene_pbc_overrides_roundtrip_via_python_helper -- --exact --nocapture | tee "$RUNNER_TEMP/scene-pbc-python-roundtrip.log"
          grep -F "script::tests::scene_pbc_overrides_roundtrip_via_python_helper ... ok" "$RUNNER_TEMP/scene-pbc-python-roundtrip.log"
      - name: Compile integration callers and API CLI binaries
        run: |
          cargo check --locked -p fullmag-runner --tests
          cargo check --locked -p fullmag-cli -p fullmag-api --bins
      - name: Preserve canonical storage preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scope-storage-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/scope-storage-preflight.json
          if-no-files-found: warn

