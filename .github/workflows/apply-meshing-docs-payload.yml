name: Apply verified meshing documentation payload

on:
  push:
    branches:
      - docs/meshing-production-2026-08-24
    paths:
      - .fullmag-docs-payload/**
      - .github/workflows/apply-meshing-docs-payload.yml
  pull_request:
    branches:
      - master
    paths:
      - .fullmag-docs-payload/**
      - .github/workflows/apply-meshing-docs-payload.yml

permissions:
  contents: write

concurrency:
  group: apply-meshing-docs-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify documentation
        shell: bash
        run: |
          set -euo pipefail

          payload_b64=/tmp/meshing-docs.tar.xz.b64
          payload=/tmp/meshing-docs.tar.xz
          extracted=/tmp/meshing-docs-extracted
          destination=public_docs/site/numerical-methods/meshing

          cat .fullmag-docs-payload/chunk-*.b64 > "$payload_b64"
          echo '8a0675a5281a4ed03676b68a8293cecbf3ea99f9ded9c690a3339b8304e28bc9  /tmp/meshing-docs.tar.xz.b64' | sha256sum --check --strict
          base64 --decode "$payload_b64" > "$payload"
          echo '8230b3d348dc58a00fe63cf685be2166aaca24fedc4770d3c6e5db7da6a68525  /tmp/meshing-docs.tar.xz' | sha256sum --check --strict

          rm -rf "$extracted"
          mkdir -p "$extracted"
          tar --extract --xz --file "$payload" --directory "$extracted" --no-same-owner --no-same-permissions

          test "$(find "$extracted" -type f | wc -l)" -eq 28
          test "$(find "$extracted" -type f -name '*.md' | wc -l)" -eq 28
          if find "$extracted" -type l -print -quit | grep -q .; then
            echo 'Symbolic links are not allowed in the documentation payload.' >&2
            exit 1
          fi

          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a "$extracted"/. "$destination"/
          diff --recursive --brief "$extracted" "$destination"

      - name: Commit installed documentation
        shell: bash
        run: |
          set -euo pipefail
          destination=public_docs/site/numerical-methods/meshing
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$destination"
          if git diff --cached --quiet; then
            echo 'Documentation already matches the verified payload.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'docs(meshing): rebuild numerical meshing documentation'
          git push origin HEAD:docs/meshing-production-2026-08-24
