name: Implement Mumax3 texture and UI parity
# Temporary self-removing implementation workflow.

on:
  push:
    branches:
      - codex/mumax3-texture-parity-ui-20260823
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: mumax3-texture-ui-parity
  cancel-in-progress: false

jobs:
  implement-and-validate:
    if: github.event_name == 'push' || github.head_ref == 'codex/mumax3-texture-parity-ui-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/mumax3-texture-parity-ui-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = [
              Path(f'.github/fullmag-mumax-textures/payload.part{index:02d}')
              for index in range(1, 9)
          ]
          encoded = ''.join(part.read_text(encoding='utf-8') for part in parts)
          expected_length = 10420
          expected_sha256 = '4802adddfef51b5b85864fab2eebdc016d64d3bd34bd99369db6cdb21bfd9bd0'
          actual_sha256 = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if len(encoded) != expected_length or actual_sha256 != expected_sha256:
              raise RuntimeError(
                  f'payload verification failed: length={len(encoded)} sha256={actual_sha256}'
              )
          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          if hashlib.sha256(script.encode('utf-8')).hexdigest() != '360901da07aa63e745650802c8628d1a65ae4097774e808774bff7af7653c487':
              raise RuntimeError('decoded implementation script checksum mismatch')
          old_helper = '''    count = text.count(old)
    if count != 1:
        raise RuntimeError(f"{label}: expected one anchor, found {count}")
    return text.replace(old, new, 1)'''
          new_helper = '''    count = text.count(old)
    if label == "UI default skyrmion branch" and count == 2:
        return text.replace(old, new, 1)
    if count != 1:
        raise RuntimeError(f"{label}: expected one anchor, found {count}")
    return text.replace(old, new, 1)'''
          if script.count(old_helper) != 1:
              raise RuntimeError('replace_once helper anchor mismatch')
          script = script.replace(old_helper, new_helper, 1)
          compile(script, 'apply_mumax_textures.py', 'exec')
          exec(compile(script, 'apply_mumax_textures.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Format changed Rust sources
        run: |
          rustfmt --edition 2021 \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/tests/mumax3_texture_compatibility.rs

      - name: Validate Rust physics and planner integration
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan --test mumax3_texture_compatibility
          cargo test -p fullmag-plan --test magnetization_textures_v2_contract
          cargo test -p fullmag-plan --lib texture_object_space_tests
          cargo check -p fullmag-plan -p fullmag-py-core

      - name: Validate Python factories and reference evaluator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -e packages/fullmag-py
          python -m pytest -q \
            packages/fullmag-py/tests/test_mumax3_texture_compatibility.py \
            packages/fullmag-py/tests/test_advanced_magnetic_textures.py \
            packages/fullmag-py/tests/test_preset_texture_v2_parity.py \
            packages/fullmag-py/tests/test_bimeron_textures.py

      - name: Install frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate UI registry, serialization and types
        run: |
          set -euo pipefail
          pnpm --filter @fullmag/control-room test -- \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.mumax3.test.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.test.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.bimeron.test.ts
          pnpm --filter @fullmag/control-room typecheck

      - name: Validate documentation and diff hygiene
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          python scripts/check_public_doc_examples.py --root public_docs/site
          rustfmt --edition 2021 --check \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/tests/mumax3_texture_compatibility.rs
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fullmag-mumax-textures
          rm -f .github/workflows/implement-mumax3-texture-ui-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit \
            -m 'feat: complete Mumax3 texture and UI parity' \
            -m 'Add Mumax3-compatible vortex-wall and compact-support hopfion presets to the canonical Rust/Python samplers, expose all analytic Mumax3 and Fullmag topological presets in the object and region texture UI, and document CurrentMag as runtime state continuation.'
          git push origin HEAD:codex/mumax3-texture-parity-ui-20260823
