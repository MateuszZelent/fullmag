name: FEM native receipt and activation recovery contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-receipt-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run isolated FEM failure receipt observation regressions
        run: python3 -B -m unittest discover -s scripts/ci -p "test_fem_contract_failure_receipt.py" -v

      - name: Validate cancelled activation recovery and archive history
        run: |
          python3 -B scripts/test_docker_volume_dev_cancelled_activation.py -v
          python3 -B scripts/test_docker_volume_cancelled_activation.py -v
          python3 -B scripts/test_docker_volume_cancelled_activation_guard.py -v
