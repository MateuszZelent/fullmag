# Public-only Sphinx publication for GitHub Pages.
name: Public documentation

on:
  push:
    branches: [master, main]
    paths:
      - "public_docs/site/**"
      - "public_docs/fullmag_profesjonalna_dokumentacja_architektura.md"
      - "docs/physics/**"
      - "packages/fullmag-py/**"
      - "scripts/public_docs_information_architecture.py"
      - "scripts/check_public_docs_information_architecture.py"
      - "scripts/test_public_docs_information_architecture.py"
      - "scripts/check_public_doc_examples.py"
      - "scripts/test_check_public_doc_examples.py"
      - ".agents/skills/scientific-documentation-contract/**"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "public_docs/site/**"
      - "public_docs/fullmag_profesjonalna_dokumentacja_architektura.md"
      - "docs/physics/**"
      - "packages/fullmag-py/**"
      - "scripts/public_docs_information_architecture.py"
      - "scripts/check_public_docs_information_architecture.py"
      - "scripts/test_public_docs_information_architecture.py"
      - "scripts/check_public_doc_examples.py"
      - "scripts/test_check_public_doc_examples.py"
      - ".agents/skills/scientific-documentation-contract/**"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-documentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test scientific documentation validators
        run: >-
          python -m unittest discover
          -s .agents/skills/scientific-documentation-contract/scripts
          -p 'test_*.py' -v

      - name: Validate public documentation information architecture
        run: |
          python -m unittest scripts/test_public_docs_information_architecture.py -v
          python scripts/check_public_docs_information_architecture.py --root public_docs/site

      - name: Enforce stage-first public Python examples
        run: |
          python -m unittest scripts/test_check_public_doc_examples.py -v
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Resolve scientific documentation diff base
        id: docs-diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ ]] && [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Require source maps for changed scientific pages
        run: >-
          python .agents/skills/scientific-documentation-contract/scripts/validate_changed_scientific_docs.py
          --base "${{ steps.docs-diff.outputs.base }}"
          --head HEAD
          --repo-root .

      - name: Install public documentation dependencies
        run: |
          python -m pip install -r public_docs/site/requirements.txt
          python -m pip install ./packages/fullmag-py

      - name: Check public and internal documentation boundary
        run: python scripts/check_public_docs_boundary.py

      - name: Validate scientific documentation source contracts
        env:
          DOCS_DIFF_BASE: ${{ steps.docs-diff.outputs.base }}
        run: |
          set -euo pipefail
          map_files="$(git diff --name-only "$DOCS_DIFF_BASE" HEAD -- public_docs/site/physics public_docs/site/python-api | grep -E '\\.source-map\\.json$' || true)"
          if [[ -z "$map_files" ]]; then
            echo "No changed public scientific source maps; changed-page validation already ran."
            exit 0
          fi
          while IFS= read -r manifest; do
            python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
              "$manifest" --repo-root .
          done <<< "$map_files"

      - name: Execute documented Python API contracts
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          python -m unittest packages/fullmag-py/tests/test_public_python_api_documentation.py -v
          python -m unittest packages/fullmag-py/tests/test_public_exchange_documentation.py -v
          python -m unittest packages/fullmag-py/tests/test_material_dmi_units.py -v

      - name: Resolve documentation build time (UTC)
        id: build-time
        shell: bash
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build public documentation strictly
        env:
          FULLMAG_DOCS_VERSION: ${{ github.ref_name }}
          FULLMAG_DOCS_BUILD_TIME: ${{ steps.build-time.outputs.value }}
        run: >-
          sphinx-build -b html -W -n --keep-going
          public_docs/site public_docs/site/_build/html

      - name: Build Sphinx version-change index
        env:
          FULLMAG_DOCS_VERSION: development
        run: |
          set -euo pipefail
          changes_dir="public_docs/site/_build/version-changes"
          published_dir="public_docs/site/_build/html/version-changes"
          rm -rf "$changes_dir" "$published_dir"
          sphinx-build -b changes -W -n --keep-going \
            -D version=development \
            public_docs/site "$changes_dir"
          test -s "$changes_dir/index.html"
          test -s "$changes_dir/changes.html"
          mkdir -p "$published_dir"
          cp -a "$changes_dir/." "$published_dir/"
          grep --fixed-strings --quiet "development" "$published_dir/changes.html"

      - name: Validate rendered scientific documentation
        env:
          DOCS_DIFF_BASE: ${{ steps.docs-diff.outputs.base }}
        run: |
          set -euo pipefail
          map_files="$(git diff --name-only "$DOCS_DIFF_BASE" HEAD -- public_docs/site/physics public_docs/site/python-api | grep -E '\\.source-map\\.json$' || true)"
          if [[ -z "$map_files" ]]; then
            echo "No changed public scientific source maps; rendered changed-page validation already ran."
            exit 0
          fi
          while IFS= read -r manifest; do
            relative="${manifest#public_docs/site/}"
            rendered="public_docs/site/_build/html/${relative%.source-map.json}.html"
            python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
              "$manifest" --repo-root . --rendered-html "$rendered"
          done <<< "$map_files"

      - name: Upload pull request preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: fullmag-public-docs-${{ github.sha }}
          path: public_docs/site/_build/html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_docs/site/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed documentation and changelog pages
        id: verify
        shell: bash
        env:
          DMI_URL: https://fullmag.mzelent.pl/physics/interactions/dmi/index.html
          CHANGELOG_URL: https://fullmag.mzelent.pl/changelog/index.html
          VERSION_CHANGES_URL: https://fullmag.mzelent.pl/version-changes/changes.html
        run: |
          set -euo pipefail
          dmi_page="$(mktemp)"
          changelog_page="$(mktemp)"
          version_page="$(mktemp)"
          trap 'rm -f "$dmi_page" "$changelog_page" "$version_page"' EXIT

          for attempt in $(seq 1 18); do
            dmi_ok=false
            changelog_ok=false
            version_ok=false

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$DMI_URL" --output "$dmi_page" \
              && grep --fixed-strings --quiet "Dzyaloshinskii" "$dmi_page" \
              && grep --fixed-strings --quiet \
                "Fullmag distinguishes interfacial and bulk" "$dmi_page"; then
              dmi_ok=true
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$CHANGELOG_URL" --output "$changelog_page" \
              && grep --fixed-strings --quiet "Documentation changelog" "$changelog_page" \
              && grep --fixed-strings --quiet "Recent documentation changes" "$changelog_page" \
              && grep --fixed-strings --quiet "/commit/${GITHUB_SHA}" "$changelog_page"; then
              changelog_ok=true
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$VERSION_CHANGES_URL" --output "$version_page" \
              && grep --fixed-strings --quiet "development" "$version_page"; then
              version_ok=true
            fi

            if [[ "$dmi_ok" == true && "$changelog_ok" == true && "$version_ok" == true ]]; then
              echo "Verified public documentation, Git changelog, and Sphinx version changes on attempt ${attempt}."
              exit 0
            fi
            echo "Deployment not fully visible yet (attempt ${attempt}/18; dmi=${dmi_ok}, changelog=${changelog_ok}, version_changes=${version_ok})."
            sleep 10
          done

          echo "::error::The deployed documentation did not expose all expected public pages."
          exit 1

      - name: Publish deployment commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_URL: https://fullmag.mzelent.pl/changelog/index.html
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == "success" ]]; then
            state="success"
            description="GitHub Pages, changelog, and version changes verified"
          else
            state="failure"
            description="Public documentation or changelog verification failed"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="Public documentation deployment" \
            -f description="$description" \
            -f target_url="$VERIFY_URL"
