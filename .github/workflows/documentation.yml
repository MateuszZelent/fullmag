# Public-only Sphinx publication for GitHub Pages.
name: Public documentation

on:
  push:
    branches: [master, main]
    paths:
      - "public_docs/site/**"
      - "public_docs/site/python-api/**"
      - "public_docs/fullmag_profesjonalna_dokumentacja_architektura.md"
      - "docs/physics/**"
      - "docs/audits/**"
      - "packages/fullmag-py/**"
      - "crates/fullmag-plan/src/magnetization_textures_v2.rs"
      - "external_solvers/3"
      - "scripts/public_docs_information_architecture.py"
      - "scripts/check_public_docs_information_architecture.py"
      - "scripts/test_public_docs_information_architecture.py"
      - "scripts/check_public_doc_examples.py"
      - "scripts/test_check_public_doc_examples.py"
      - ".agents/skills/scientific-documentation-contract/**"
      - ".github/workflows/documentation.yml"
      - ".github/workflows/documentation-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/documentation-build.yml
    permissions:
      contents: read

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated public documentation
        uses: actions/download-artifact@v8
        with:
          name: fullmag-public-docs-${{ github.sha }}
          path: public_docs/site/_build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_docs/site/_build/html

      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Verify deployed documentation and changelog pages
        id: verify
        shell: bash
        env:
          DMI_URL: https://fullmag.mzelent.pl/physics/interactions/dmi/index.html
          CHANGELOG_URL: https://fullmag.mzelent.pl/changelog/index.html
          VERSION_CHANGES_URL: https://fullmag.mzelent.pl/version-changes/index.html
        run: |
          set -euo pipefail
          dmi_page="$(mktemp)"
          changelog_page="$(mktemp)"
          version_page="$(mktemp)"
          trap 'rm -f "$dmi_page" "$changelog_page" "$version_page"' EXIT

          for attempt in $(seq 1 18); do
            dmi_ok=false
            changelog_ok=false
            version_ok=false

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$DMI_URL" --output "$dmi_page" \
              && grep --fixed-strings --quiet "Dzyaloshinskii" "$dmi_page" \
              && grep --fixed-strings --quiet \
                "Fullmag exposes three distinct" "$dmi_page"; then
              dmi_ok=true
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$CHANGELOG_URL" --output "$changelog_page" \
              && grep --fixed-strings --quiet "Documentation changelog" "$changelog_page" \
              && grep --fixed-strings --quiet "Two change histories" "$changelog_page" \
              && grep --fixed-strings --quiet "fm-changelog-tab-panel--documentation" "$changelog_page" \
              && grep --fixed-strings --quiet "fm-changelog-tab-panel--code" "$changelog_page" \
              && grep --fixed-strings --quiet "Latest documentation change" "$changelog_page" \
              && grep --fixed-strings --quiet "Latest code change" "$changelog_page" \
              && test "$(grep --count --fixed-strings "fm-changelog-summary__time" "$changelog_page")" -ge 2 \
              && grep --fixed-strings --quiet "/commit/${GITHUB_SHA}" "$changelog_page"; then
              changelog_ok=true
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$VERSION_CHANGES_URL" --output "$version_page" \
              && grep --fixed-strings --quiet "development" "$version_page" \
              && grep --fixed-strings --quiet "Automatically generated list of changes" "$version_page"; then
              version_ok=true
            fi

            if [[ "$dmi_ok" == true && "$changelog_ok" == true && "$version_ok" == true ]]; then
              echo "Verified public documentation, Git changelog, and Sphinx version changes on attempt ${attempt}."
              exit 0
            fi
            echo "Deployment not fully visible yet (attempt ${attempt}/18; dmi=${dmi_ok}, changelog=${changelog_ok}, version_changes=${version_ok})."
            sleep 10
          done

          echo "::error::The deployed documentation did not expose all expected public pages."
          exit 1

      - name: Publish deployment commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_URL: https://fullmag.mzelent.pl/changelog/index.html
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == "success" ]]; then
            state="success"
            description="GitHub Pages, changelog, and version changes verified"
          else
            state="failure"
            description="Public documentation or changelog verification failed"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="Public documentation deployment" \
            -f description="$description" \
            -f target_url="$VERIFY_URL"
