name: Apply magnetic texture FEM/FDM fixes

on:
  push:
    branches:
      - codex/magnetic-textures-fem-fdm-fixes-20260822
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: magnetic-textures-fem-fdm-fixes
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/magnetic-textures-fem-fdm-fixes-20260822
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decode and execute implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = [
              Path(f'.github/fullmag-texture-fixes/payload.part{index:02d}')
              for index in range(1, 11)
          ]
          encoded = ''.join(part.read_text(encoding='utf-8') for part in parts)
          expected_length = 13460
          expected_sha256 = 'feed7d4de065ee658c0f04212c1e2466bd2b318e75670e14b6fdb8635e861fae'
          actual_sha256 = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if len(encoded) != expected_length or actual_sha256 != expected_sha256:
              raise RuntimeError(
                  f'payload verification failed: length={len(encoded)} sha256={actual_sha256}'
              )
          compressed = base64.b64decode(encoded, validate=True)
          script = zlib.decompress(compressed).decode('utf-8')
          script_path = Path('.github/fullmag-texture-fixes/apply_changes.py')
          stale = '    quaternion = _normalized_quaternion(rotation_quat or (0.0, 0.0, 0.0, 1.0))'
          current = '    quaternion = _normalized_quaternion(rotation_quat) if rotation_quat is not None else None'
          stale_count = script.count(stale)
          if stale_count:
              if stale_count != 2:
                  raise RuntimeError(f'expected two stale evaluator anchors, found {stale_count}')
              script = script.replace(stale, current)
          elif script.count(current) < 2:
              raise RuntimeError('corrected evaluator anchors are missing from the payload')
          compile(script, str(script_path), 'exec')
          script_path.write_text(script, encoding='utf-8')
          PY
          python .github/fullmag-texture-fixes/apply_changes.py

      - name: Normalize planner compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          fem_path = Path('crates/fullmag-plan/src/fem.rs')
          fem_source = fem_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'let sample_points_object\s*=\s*'
              r'object_space_sample_points\(&sample_points, entry\.object_translation\)\?;'
          )
          replacement = '''let sample_points_object =
              object_space_sample_points(&sample_points, entry.object_translation).map_err(|reason| {
                  PlanError {
                      reasons: vec![reason],
                  }
              })?;'''
          fem_source, count = pattern.subn(replacement, fem_source, count=1)
          if count != 1:
              raise RuntimeError(f'expected one FEM error-conversion anchor, found {count}')
          fem_path.write_text(fem_source, encoding='utf-8')

          tests_path = Path('crates/fullmag-plan/src/tests.rs')
          tests_source = tests_path.read_text(encoding='utf-8')
          fixtures = {
              'free_geom': 2,
              'body_geom': 2,
          }
          for geometry_name, expected_count in fixtures.items():
              old = (
                  f'        geometry_name: "{geometry_name}".to_string(),\n'
                  '        initial_magnetization:'
              )
              new = (
                  f'        geometry_name: "{geometry_name}".to_string(),\n'
                  '        object_translation: [0.0, 0.0, 0.0],\n'
                  '        initial_magnetization:'
              )
              count = tests_source.count(old)
              if count != expected_count:
                  raise RuntimeError(
                      f'expected {expected_count} {geometry_name} test fixtures, found {count}'
                  )
              tests_source = tests_source.replace(old, new)
          tests_path.write_text(tests_source, encoding='utf-8')
          PY

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Regenerate Rust/Python parity fixture
        env:
          FULLMAG_GENERATE_V2_PARITY: "1"
        run: cargo test -p fullmag-plan --test magnetization_textures_v2_parity

      - name: Test canonical texture contracts and parity
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan --test magnetization_textures_v2_contract
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity
          cargo test -p fullmag-plan --lib texture_object_space_tests
          cargo check -p fullmag-plan -p fullmag-py-core

      - name: Test Python factories and reference evaluator
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            packages/fullmag-py/tests/test_advanced_magnetic_textures.py \
            packages/fullmag-py/tests/test_preset_texture_v2_parity.py \
            packages/fullmag-py/tests/test_bimeron_textures.py

      - name: Validate public API documentation contract
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json \
            --repo-root .
          python -m unittest packages/fullmag-py/tests/test_public_python_api_documentation.py -v
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Verify patch hygiene
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check
          test "$(grep -c 'fn v2_neel_chirality_reverses_the_radial_wall_direction' crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs)" -eq 1
          test "$(grep -c 'def hopfion(' packages/fullmag-py/src/fullmag/init/textures.py)" -eq 1
          test "$(grep -c 'pub(crate) fn object_space_sample_points' crates/fullmag-plan/src/mesh.rs)" -eq 1

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fullmag-texture-fixes
          rm -f .github/workflows/apply-magnetic-texture-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit \
            -m "feat: fix FEM/FDM texture sampling and add topological presets" \
            -m "Fix Neel chirality semantics in the shared sampler, map translated FEM nodes into object coordinates, unify FDM object-frame conversion, and add v2 antiskyrmion, skyrmionium, and hopfion presets with Rust/Python parity, contract tests, and public documentation."
          git push origin HEAD:codex/magnetic-textures-fem-fdm-fixes-20260822
