name: Commit validated texture-region implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: commit-texture-region-refactor
  cancel-in-progress: false

jobs:
  commit:
    if: github.head_ref == 'codex/texture-transform-region-clipping-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/texture-transform-region-clipping-20260823
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Apply final implementation deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          payload_dir = Path('.github/fullmag-texture-region-refactor')
          encoded = ''.join(
              (payload_dir / f'payload.part{index:02d}').read_text(encoding='utf-8').strip()
              for index in range(1, 11)
          )
          if len(encoded) != 16368:
              raise RuntimeError(f'unexpected payload length: {len(encoded)}')
          digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if digest != 'a92bb20c17913409cd97c3506867e7a5f3d4453c43e8d778efc9f93230d012f2':
              raise RuntimeError(f'unexpected payload sha256: {digest}')
          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          stale = 'prescribed_sot_refuses_disjoint_target_mask'
          current = 'prescribed_sot_region_target_materializes_cell_mask'
          if script.count(stale) != 2:
              raise RuntimeError(f'unexpected FDM anchor count: {script.count(stale)}')
          script = script.replace(stale, current)
          apply_path = payload_dir / 'apply.py'
          compile(script, str(apply_path), 'exec')
          apply_path.write_text(script, encoding='utf-8')
          PY
          python .github/fullmag-texture-region-refactor/apply.py

      - name: Apply final compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          tests_path = Path('crates/fullmag-plan/src/tests.rs')
          tests = tests_path.read_text(encoding='utf-8')
          old = '''#[test]
          fn fem_region_texture_override_is_rejected_until_runtime_materialization_exists() {
              let mut ir = fem_minimal_test_ir();
              let mut region = default_test_object_region();
              region.texture_override = Some(fullmag_ir::RegionTextureOverrideIR {
                  initial_magnetization: fullmag_ir::InitialMagnetizationIR::Uniform {
                      value: [0.0, 0.0, 1.0],
                  },
              });
              ir.object_regions.push(region);

              let err = plan(&ir).expect_err("FEM must not silently ignore region texture overrides");
              assert!(
                  err.reasons.iter().any(|reason| {
                      reason.contains("object region texture_override")
                          && reason.contains("backend='fem'")
                          && reason.contains("must not silently ignore region texture overrides")
                  }),
                  "unexpected planner errors: {:?}",
                  err.reasons
              );
          }
          '''
          new = '''#[test]
          fn fem_region_texture_override_materializes_on_selected_nodes_only() {
              let baseline_ir = fem_minimal_test_ir();
              let baseline_plan = plan(&baseline_ir).expect("baseline FEM plan should succeed");
              let fullmag_ir::BackendPlanIR::Fem(baseline_fem) = baseline_plan.backend_plan else {
                  panic!("expected baseline FEM plan");
              };

              let mut ir = baseline_ir;
              let mut region = default_test_object_region();
              region.texture_override = Some(fullmag_ir::RegionTextureOverrideIR {
                  initial_magnetization: fullmag_ir::InitialMagnetizationIR::Uniform {
                      value: [0.0, 0.0, 1.0],
                  },
              });
              ir.object_regions.push(region);

              let plan = plan(&ir).expect("FEM should materialize region texture overrides");
              let fullmag_ir::BackendPlanIR::Fem(fem) = plan.backend_plan else {
                  panic!("expected FEM plan");
              };

              assert_eq!(
                  fem.initial_magnetization.len(),
                  baseline_fem.initial_magnetization.len()
              );
              let changed_indices = fem
                  .initial_magnetization
                  .iter()
                  .zip(&baseline_fem.initial_magnetization)
                  .enumerate()
                  .filter_map(|(index, (actual, baseline))| (actual != baseline).then_some(index))
                  .collect::<Vec<_>>();
              assert_eq!(
                  changed_indices,
                  vec![0],
                  "the object-frame cylinder contains only node 0 and must not broaden its mask"
              );
              assert_eq!(fem.initial_magnetization[0], [0.0, 0.0, 1.0]);
              assert_eq!(
                  &fem.initial_magnetization[1..],
                  &baseline_fem.initial_magnetization[1..],
                  "nodes outside the winning region must preserve the base texture"
              );
          }
          '''
          if tests.count(old) != 1:
              raise RuntimeError(f'unexpected obsolete FEM test count: {tests.count(old)}')
          tests_path.write_text(tests.replace(old, new, 1), encoding='utf-8')

          manifest_path = Path(
              'public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json'
          )
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          matches = [entry for entry in manifest['sources'] if entry.get('id') == 'rust-inverse-transform']
          if len(matches) != 1 or matches[0].get('symbol') != 'PreparedTextureTransform':
              raise RuntimeError(f'unexpected documentation source entry: {matches}')
          matches[0]['symbol'] = 'prepare'
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          page_path = Path(
              'public_docs/site/python-api/magnets-and-textures/preset-textures.md'
          )
          page = page_path.read_text(encoding='utf-8')
          old_row = (
              '| coordinate transform | '
              '`crates/fullmag-plan/src/magnetization_textures_v2.rs` | '
              '`PreparedTextureTransform` | '
              'one-time validation plus shared forward/inverse texture transform | '
              'FDM/FEM planner |'
          )
          new_row = old_row.replace('`PreparedTextureTransform`', '`prepare`')
          if page.count(old_row) != 1:
              raise RuntimeError(f'unexpected documentation row count: {page.count(old_row)}')
          page_path.write_text(page.replace(old_row, new_row, 1), encoding='utf-8')
          PY

      - name: Format and validate implementation
        shell: bash
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            crates/fullmag-plan/src/lib.rs \
            crates/fullmag-plan/src/region_textures.rs \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/src/mesh.rs \
            crates/fullmag-plan/src/fdm.rs \
            crates/fullmag-plan/src/fem.rs \
            crates/fullmag-plan/src/tests.rs \
            crates/fullmag-plan/src/validate.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs
          cargo test -p fullmag-plan region_textures
          cargo test -p fullmag-plan fdm_region_textures
          cargo test -p fullmag-plan fem_region_textures
          cargo test -p fullmag-plan fem_region_texture_override_materializes_on_selected_nodes_only
          cargo test -p fullmag-plan --test magnetization_textures_v2_contract
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity
          cargo check -p fullmag-plan -p fullmag-py-core
          cargo test -p fullmag-plan
          python -m pip install --disable-pip-version-check pytest -e packages/fullmag-py
          python -m pytest -q \
            packages/fullmag-py/tests/test_preset_texture_v2_parity.py \
            packages/fullmag-py/tests/test_bimeron_textures.py
          python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json \
            --repo-root .
          python -m unittest discover -s packages/fullmag-py/tests \
            -p 'test_public_python_api_documentation.py' -v
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Validate region editor contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm --dir apps/control-room exec vitest run \
            src/modules/inspector/panels/ObjectRegionsPanel.test.ts
          git restore -- pnpm-lock.yaml

      - name: Verify and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            crates/fullmag-plan/src/lib.rs \
            crates/fullmag-plan/src/region_textures.rs \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/src/mesh.rs \
            crates/fullmag-plan/src/fdm.rs \
            crates/fullmag-plan/src/fem.rs \
            crates/fullmag-plan/src/tests.rs \
            crates/fullmag-plan/src/validate.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs
          git diff --check
          rm -rf .github/fullmag-texture-region-refactor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/fullmag-plan/src/lib.rs \
            crates/fullmag-plan/src/region_textures.rs \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/src/mesh.rs \
            crates/fullmag-plan/src/fdm.rs \
            crates/fullmag-plan/src/fem.rs \
            crates/fullmag-plan/src/tests.rs \
            crates/fullmag-plan/src/validate.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs \
            public_docs/site/python-api/magnets-and-textures/preset-textures.md \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json \
            .github/fullmag-texture-region-refactor
          git diff --cached --check
          git commit \
            -m 'fix: unify texture transforms and clip regional textures' \
            -m 'Prepare texture transforms once for FDM and FEM, scope FDM overrides to their owning object in single-grid and multilayer plans, materialize FEM region textures on winning nodal masks, and enforce strict clipping at region boundaries.'
          git push origin HEAD:codex/texture-transform-region-clipping-20260823
