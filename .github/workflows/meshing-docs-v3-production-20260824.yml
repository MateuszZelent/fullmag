name: Build production meshing documentation v3

on:
  push:
    branches:
      - docs/meshing-v3-production-20260824
    paths:
      - scripts/_tmp_meshing_docs_v3_20260824.py
      - scripts/_tmp_meshing_docs_v3_specs_20260824.py
      - .github/workflows/meshing-docs-v3-production-20260824.yml

permissions:
  contents: write

concurrency:
  group: meshing-docs-v3-production-20260824
  cancel-in-progress: false

jobs:
  generate-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: docs/meshing-v3-production-20260824
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            public_docs/site/requirements.txt
            packages/fullmag-py/pyproject.toml

      - name: Install documentation and Python API dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r public_docs/site/requirements.txt
          python -m pip install -e packages/fullmag-py

      - name: Generate all meshing pages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_meshing_docs_v3_20260824.py
          test "$(find public_docs/site/numerical-methods/meshing -type f -name '*.md' | wc -l)" -eq 28
          test "$(grep -RIl '<!-- FULLMAG_MESHING_V3_BEGIN -->' public_docs/site/numerical-methods/meshing --include='*.md' | wc -l)" -eq 28
          wc -l $(find public_docs/site/numerical-methods/meshing -type f -name '*.md' | sort)

      - name: Validate information architecture and public examples
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_public_docs_information_architecture.py --root public_docs/site
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Strict Sphinx and MyST build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fullmag-public-docs-html
          sphinx-build \
            -b html \
            -W \
            -n \
            --keep-going \
            public_docs/site \
            /tmp/fullmag-public-docs-html
          test -f /tmp/fullmag-public-docs-html/numerical-methods/meshing/fem/ferromagnet/swept-prism.html

      - name: Commit only final documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm \
            scripts/_tmp_meshing_docs_v3_20260824.py \
            scripts/_tmp_meshing_docs_v3_specs_20260824.py \
            .github/workflows/meshing-docs-v3-production-20260824.yml
          git add -f public_docs/site/numerical-methods/meshing
          git diff --cached --check

          changed_docs="$(git diff --cached --name-only -- 'public_docs/site/numerical-methods/meshing/*.md' 'public_docs/site/numerical-methods/meshing/**/*.md' | wc -l)"
          test "$changed_docs" -eq 28

          git commit -m 'docs(meshing): add complete scientific reference for every mesh mode'
          git push origin HEAD:docs/meshing-v3-production-20260824
