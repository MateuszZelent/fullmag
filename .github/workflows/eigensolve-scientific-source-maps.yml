name: eigensolve-scientific-source-maps
on:
  workflow_dispatch:
  push:
    branches: ['codex/eigensolve-dispersion-plan-20260912']
    paths:
      - 'docs/physics/poisson-airbox-schur-execution-observability*'
      - 'docs/physics/r4-linearization-identity-v2*'
      - 'docs/physics/0828-fem-frequency-domain-floquet-demag*'
      - 'docs/physics/0831-fem-dynamic-pencil-modal-response-and-krylov*'
      - 'docs/physics/0104-material-regions-parameter-fields-and-interface-couplings*'
      - '.github/workflows/eigensolve-scientific-source-maps.yml'
permissions:
  contents: read
jobs:
  scientific-source-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Preserve exact source identity
        run: git rev-parse HEAD
      - name: Validate Schur, R4, Floquet, material and modal source contracts
        run: |
          source_map_validation_status=0
          python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/poisson-airbox-schur-execution-observability.source-map.json --repo-root . || source_map_validation_status=1
          python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/r4-linearization-identity-v2.source-map.json --repo-root . || source_map_validation_status=1
          python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/0828-fem-frequency-domain-floquet-demag.source-map.json --repo-root . || source_map_validation_status=1
          python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/0104-material-regions-parameter-fields-and-interface-couplings.source-map.json --repo-root . || source_map_validation_status=1
          python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/0831-fem-dynamic-pencil-modal-response-and-krylov.source-map.json --repo-root . || source_map_validation_status=1
          exit "$source_map_validation_status"
