name: frontend-3d-managed-fem

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Unique private label assigned to this ephemeral FEM runner"
        required: true
        type: string

jobs:
  managed-fem-qualification:
    # This is a dedicated Linux managed runner, not an interactive WSL step.
    # The current receipt contract requires loop-backed ext4 storage and CUDA
    # visibility; Windows local builds use scripts/windows/run_fullmag_fem.ps1.
    runs-on: [self-hosted, linux, x64, "${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || format('fullmag-fem-private-{0}', github.run_id) }}"]
    env:
      FULLMAG_MANAGED_FEM_RUNNER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run managed FEM magnetic-only and shared-air qualification
        run: ./scripts/ci/run_frontend3d_required_gate.sh managed-fem-qualification
