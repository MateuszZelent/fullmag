name: scoped-mesh-fields

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/fullmag-py/src/fullmag/meshing/**'
      - 'packages/fullmag-py/tests/test_meshing.py'
      - 'packages/fullmag-py/tests/test_mixed_element_meshing.py'
      - 'scripts/test_box_layered_airbox_mesh.py'
      - 'scripts/test_box_body_only_thin_film_mesh.py'
      - 'docs/physics/0104-thin-film-shared-domain-meshing*'
      - '.github/workflows/scoped-mesh-fields.yml'
  pull_request:
    paths:
      - 'packages/fullmag-py/src/fullmag/meshing/**'
      - 'packages/fullmag-py/tests/test_meshing.py'
      - 'packages/fullmag-py/tests/test_mixed_element_meshing.py'
      - 'scripts/test_box_layered_airbox_mesh.py'
      - 'scripts/test_box_body_only_thin_film_mesh.py'
      - 'docs/physics/0104-thin-film-shared-domain-meshing*'
      - '.github/workflows/scoped-mesh-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-gmsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Mesh.Reproducible is experimental for multi-threaded Gmsh. Pin this
    # scoped gate to one thread to reduce scheduling variance across hosted
    # runners; production runtime parallelism is not qualified here.
    env:
      FULLMAG_GMSH_THREADS: '1'
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate thin-film meshing scientific source map
        run: python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/0104-thin-film-shared-domain-meshing.source-map.json --repo-root .
      - name: Install Gmsh system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglu1-mesa
      - name: Install meshing dependencies
        id: install-meshing
        run: python -m pip install -e 'packages/fullmag-py[meshing,figures]' pytest
      - name: Record Gmsh determinism inputs
        run: |
          python - <<'PY'
          import json
          import os
          import platform

          import gmsh

          raw_threads = os.environ.get('FULLMAG_GMSH_THREADS')
          configured_threads = int(raw_threads) if raw_threads else (os.cpu_count() or 1)
          if configured_threads < 1:
              raise SystemExit('configured Gmsh thread count must be positive')
          thread_options = (
              'General.NumThreads',
              'Mesh.MaxNumThreads1D',
              'Mesh.MaxNumThreads2D',
              'Mesh.MaxNumThreads3D',
          )
          gmsh.initialize()
          try:
              for name in thread_options:
                  gmsh.option.setNumber(name, configured_threads)
              options = {
                  name: gmsh.option.getNumber(name)
                  for name in (
                      *thread_options,
                      'Mesh.RandomSeed',
                      'Mesh.RandomFactor3D',
                      'Mesh.Reproducible',
                  )
              }
              affinity = getattr(os, 'sched_getaffinity', None)
              print(json.dumps({
                  'python': platform.python_version(),
                  'platform': platform.platform(),
                  'machine': platform.machine(),
                  'cpu_count': os.cpu_count(),
                  'affinity_count': len(affinity(0)) if affinity else None,
                  'configured_threads': configured_threads,
                  'FULLMAG_GMSH_THREADS': os.environ.get('FULLMAG_GMSH_THREADS'),
                  'FULLMAG_CPU_THREADS': os.environ.get('FULLMAG_CPU_THREADS'),
                  'gmsh_version': getattr(gmsh, '__version__', 'unknown'),
                  'gmsh_defaults_after_thread_pin': options,
              }, sort_keys=True))
          finally:
              gmsh.finalize()
          PY
      - name: Validate adaptive air Z with exact magnetic layers
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m pytest -q packages/fullmag-py/tests/test_mixed_element_meshing.py::test_shared_domain_airbox_has_interior_z_nodes_and_exact_magnetic_layers
      - name: Validate exact-layer airbox grading and coordinate closure
        run: python -B -m pytest -q scripts/test_box_layered_airbox_mesh.py
      - name: Validate body-only Box exact layers, fields and periodic certificates
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m pytest -q scripts/test_box_body_only_thin_film_mesh.py
      - name: Validate exact-ring and scoped-layer reporting
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m unittest discover -s packages/fullmag-py/tests -p test_meshing.py -k exact_ring -v
      - name: Validate actual density, exact layers and reporting
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m unittest discover -s packages/fullmag-py/tests -p test_meshing.py -v
