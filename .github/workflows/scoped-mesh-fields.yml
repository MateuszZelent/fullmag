name: scoped-mesh-fields

on:
  push:
    branches: [master, 'codex/**']
    paths:
      - 'packages/fullmag-py/src/fullmag/meshing/**'
      - 'packages/fullmag-py/tests/test_meshing.py'
      - 'scripts/test_box_layered_airbox_mesh.py'
      - 'scripts/test_box_body_only_thin_film_mesh.py'
      - 'docs/physics/0104-thin-film-shared-domain-meshing*'
      - '.github/workflows/scoped-mesh-fields.yml'
  pull_request:
    paths:
      - 'packages/fullmag-py/src/fullmag/meshing/**'
      - 'packages/fullmag-py/tests/test_meshing.py'
      - 'scripts/test_box_layered_airbox_mesh.py'
      - 'scripts/test_box_body_only_thin_film_mesh.py'
      - 'docs/physics/0104-thin-film-shared-domain-meshing*'
      - '.github/workflows/scoped-mesh-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-gmsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate thin-film meshing scientific source map
        run: python -B .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/0104-thin-film-shared-domain-meshing.source-map.json --repo-root .
      - name: Install Gmsh system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglu1-mesa
      - name: Install meshing dependencies
        id: install-meshing
        run: python -m pip install -e 'packages/fullmag-py[meshing,figures]' pytest
      - name: Validate exact-layer airbox grading and coordinate closure
        run: python -B -m pytest -q scripts/test_box_layered_airbox_mesh.py
      - name: Validate body-only Box exact layers, fields and periodic certificates
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m pytest -q scripts/test_box_body_only_thin_film_mesh.py
      - name: Validate exact-ring and scoped-layer reporting
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m unittest discover -s packages/fullmag-py/tests -p test_meshing.py -k exact_ring -v
      - name: Validate actual density, exact layers and reporting
        if: ${{ !cancelled() && steps.install-meshing.outcome == 'success' }}
        run: python -B -m unittest discover -s packages/fullmag-py/tests -p test_meshing.py -v
