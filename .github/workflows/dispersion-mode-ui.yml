name: Dispersion and mode UI
on:
  push:
    branches: [codex/dispersion-mode-ui-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install interpreted contract dependencies
        run: |
          python -m pip install 'pytest>=9,<10' 'matplotlib>=3.8,<4' pyyaml
          python -m pip install -e packages/fullmag-py
      - name: Validate capture and runtime artifact contracts
        env:
          PYTHONPATH: scripts
          MPLBACKEND: Agg
        run: python -B -m pytest -q scripts/test_de_ui_session_scope.py scripts/test_run_de_100nm_pilot.py scripts/test_frontend_source_workspace.py scripts/test_de_smoke_model.py scripts/test_validate_de_smoke_rows.py scripts/test_de_ui_seven_krylov_trial.py scripts/test_fullmag_storage.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FULLMAG_PROJECT_STORAGE_ROOT: ${{ github.workspace }}/../storage
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 32
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Install source contract search tool
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Prepare isolated managed frontend workspace
        id: frontend-workspace
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import fullmag_storage
          from windows.stage_workspace_frontend import stage_workspace_frontend
          layout = fullmag_storage.resolve_layout(Path.cwd(), "control-room-ci")
          fullmag_storage.initialize(layout)
          staged = stage_workspace_frontend(Path.cwd(), layout["build_root"], mode="static")
          workspace = Path(staged["workspace_root"])
          # Full unit regressions also read tracked contracts outside the app.
          import hashlib, json, shutil, subprocess
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          inventory = []
          contract_prefixes = ("apps/", "packages/", "scripts/", "docs/", ".github/",
                               "crates/", "backends/", "tests/", "examples/", "assets/",
                               "docker/", "public_docs/")
          for relative in filter(None, tracked):
              # Agent skill aliases are tracked symlinks, not frontend fixtures.
              if "/" in relative and not relative.startswith(contract_prefixes):
                  continue
              source, destination = Path.cwd() / relative, workspace / relative
              fullmag_storage.validate_path(destination, layout["build_root"])
              if source.is_symlink() or not source.is_file():
                  raise RuntimeError(f"Tracked contract must be a regular source file: {relative}")
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              if destination.exists():
                  if not destination.is_file() or hashlib.sha256(destination.read_bytes()).hexdigest() != digest:
                      raise RuntimeError(f"Staged source differs: {relative}")
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, destination)
              inventory.append({"path": relative, "sha256": digest})
          (workspace.parent / "ci-contract-source-inventory.json").write_text(
              json.dumps(inventory), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"workspace={workspace}\n")
          PY
      - name: Install locked dependencies
        run: pnpm --dir "${{ steps.frontend-workspace.outputs.workspace }}" install --frozen-lockfile --store-dir "$FULLMAG_PROJECT_STORAGE_ROOT/cache/pnpm"
      - name: Check types and module/resource contracts
        run: |
          pnpm --dir "${{ steps.frontend-workspace.outputs.workspace }}/apps/control-room" typecheck
          pnpm --dir "${{ steps.frontend-workspace.outputs.workspace }}/apps/control-room" check:architecture-hygiene
          pnpm --dir "${{ steps.frontend-workspace.outputs.workspace }}/apps/control-room" check:api-hygiene
      - name: Lint
        run: pnpm --dir "${{ steps.frontend-workspace.outputs.workspace }}/apps/control-room" lint
      - name: Review changed React sources with pinned Doctor
        run: >-
          node "${{ steps.frontend-workspace.outputs.workspace }}/node_modules/react-doctor/bin/react-doctor.js"
          apps/control-room --verbose --scope changed
          --base 1195663c67943cb57f6716bdd73639d9fe917e4f
          --no-score --no-supply-chain --no-dead-code --no-parallel --yes
          --output-dir "$FULLMAG_PROJECT_STORAGE_ROOT/builds/dispersion-ui-ci/react-doctor"
      - name: Run Control Room regressions
        run: pnpm --dir "${{ steps.frontend-workspace.outputs.workspace }}/apps/control-room" test
  native-resource-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../storage/builds/dispersion-ui-ci/native-contracts/cargo-target
      RUST_MIN_STACK: 8388608
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate resource and managed-store contracts
        run: |
          cargo test -p fullmag-runtime-control --lib accepted_store --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api frequency_domain_dispersion_resource --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api observation_store_tests --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api frequency_domain_owner --no-fail-fast
          cargo test -p fullmag-runner --lib frequency_domain_owner --no-fail-fast
          cargo test -p fullmag-runner --lib eigen_path_native_mode_provenance --no-fail-fast
          cargo test -p fullmag-runner --lib eigen_path_manifest_typed_context_preserves_floquet_and_per_sample_identity --no-fail-fast
          cargo test -p fullmag-runner --lib eigen_path_manifest_phase_convention_requires_sample_consensus --no-fail-fast
