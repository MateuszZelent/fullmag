name: Patch texture-region validation workflow

on:
  push:
    branches:
      - codex/texture-transform-region-clipping-20260823
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: patch-texture-region-validation-workflow
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'codex/texture-transform-region-clipping-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/texture-transform-region-clipping-20260823
          fetch-depth: 0

      - name: Remove unrelated global typecheck and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import import Path
          PY
