name: bootstrap-rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-contracts:
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test fail-closed exact Cargo selector helper
        run: python3 -B scripts/ci/test_run_exact_cargo_test.py

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime and mesh preparation dependencies
        id: install-python-runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Resolve storage for API artifact fixtures
        run: |
          python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
               "--profile", "ci-rust-contracts", "--create"],
              check=True, capture_output=True, text=True,
          )
          layout = json.loads(result.stdout)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(
                  f"FULLMAG_PROJECT_STORAGE_ROOT={layout['storage_root']}\n"
              )
          PY
      - name: Run absorbing boundary scene validation
        run: |
          cargo test --locked -p fullmag-authoring --lib scene_validation_rejects_invalid_absorbing_boundary
          cargo test --locked -p fullmag-authoring --lib adding_editing_and_removing_an_absorber
          RUST_MIN_STACK=16777216 cargo test --locked -p fullmag-api --bin fullmag-api absorbing_boundary_
          cargo test --locked -p fullmag-ir --lib absorbing_boundary::tests
          cargo test --locked -p fullmag-plan --lib spatial_
          cargo test --locked -p fullmag-authoring --lib spatial_absorbers_reference_owned_regions_by_stable_id
          RUST_MIN_STACK=16777216 cargo test --locked -p fullmag-api --bin fullmag-api overlapping_csg_boundary_is_rejected_before_mesh_build
          RUST_MIN_STACK=16777216 python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::tests::live_view_continuity_reuses_the_full_published_fdm_airbox_layout -- --exact

      - name: Run material provenance and authoring roundtrip contracts
        run: cargo test --locked -p fullmag-authoring --lib material_library_roundtrip

      - name: Run spin transport planning and provenance contracts
        run: |
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib spin_transport::tests::fem_planning_omits_spin_transport_inactive_in_physics_graph -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib spin_transport::tests::resolves_bounded_fem_m2_torque_to_stage_transport_callback -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib spin_transport::tests::reject_unassigned_spin_boundary_policy_fails_closed_without_claims -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib spin_transport::tests::resolves_only_fdm_cpu_double_and_preserves_requested_intent -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-runner --lib fdm::cpu::spin_transport::tests::reciprocal_and_transient_plans_publish_transport_execution_provenance -- --exact

      - name: Run all spin transport planner and runner unit tests
        run: |
          cargo test --locked -p fullmag-plan --lib spin_transport::tests
          cargo test --locked -p fullmag-runner --lib fdm::cpu::spin_transport::tests

      - name: Verify buffered stage tables and asynchronous field output
        shell: bash
        run: |
          FULLMAG_KEEP_ZARR_TEST_OUTPUT=1 cargo test --locked -p fullmag-runner --lib autosave_zarr::tests -- --nocapture | tee "$RUNNER_TEMP/buffered-zarr-tests.log"
          python - "$RUNNER_TEMP/buffered-zarr-tests.log" <<'PYTHON'
          from pathlib import Path
          import sys
          import numpy as np
          import zarr

          marker = "ZARR_TEST_TABLE_PATH="
          log = Path(sys.argv[1]).read_text()
          (path,) = [Path(line.removeprefix(marker)) for line in log.splitlines() if line.startswith(marker)]
          table = zarr.open_array(str(path), mode="r")
          t = np.arange(20_000, dtype=np.float64)
          assert table.shape == table.chunks == (20_000, 5)
          np.testing.assert_array_equal(table[:], np.column_stack((t, t + 0.125, -t, t % 97, t * 1e-3)))
          assert sorted(p.name for p in path.iterdir()) == [".zarray", ".zattrs", "0.0"]
          print(f"Verified {table.size} f64 values in one {(path / '0.0').stat().st_size}-byte Zarr chunk")
          PYTHON
          cargo test --locked -p fullmag-runner --lib artifact_pipeline::tests
          cargo test --locked -p fullmag-runner --lib frames_index::tests

      - name: Verify interleaved Zarr sample indexes after writer drain
        shell: bash
        run: |
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-runner --lib artifact_pipeline::tests::zarr_field_sample_indexes_survive_interleaved_buffer_flushes -- --exact | tee "$RUNNER_TEMP/zarr-sample-index-test.log"
          grep -F "test result: ok. 1 passed" "$RUNNER_TEMP/zarr-sample-index-test.log"

      - name: Check FEM demag solver policy resolution
        run: python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-runner --lib dispatch::tests::fem_demag_solver_policy_preserves_gpu_fem_bem -- --exact

      - name: Check FEM CPU runner contracts
        # Type-check the CPU native lane independently of fem-gpu, including
        # its tests. This does not link or qualify the MFEM runtime.
        run: |
          cargo test --locked -p fullmag-runner --lib native_fem::object_average::tests
          FULLMAG_FEM_LIB_DIR=/usr/lib cargo check --locked -p fullmag-runner --features fem-native --tests

      - name: Type-check the native FEM frequency-response adapter
        run: FULLMAG_FEM_LIB_DIR=/usr/lib cargo check --locked -p fullmag-api --features fem-gpu --bins

      - name: Check FDM CUDA runner contracts
        # cargo check type-checks the CUDA Rust path without linking a native
        # library. The actual cuFFT operator is qualified on the managed GPU.
        run: |
          cargo test --locked -p fullmag-runner --lib periodic_airbox_provenance
          cargo test --locked -p fullmag-runner --lib cuda_stage_handoff_preserves_reference_and_rejects_changed_state
          FULLMAG_FDM_LIB_DIR=/usr/lib cargo check --locked -p fullmag-runner --features cuda --tests

      - name: Run closed-loop volume inspection policy contracts
        run: |
          cargo test -p fullmag-ir --lib closed_loop_direct_budget_
          cargo test -p fullmag-plan --lib antenna_current_source::tests::closed_loop_volume_budget_
          cargo test -p fullmag-plan --lib antenna_current_source::tests::external_lead_does_not_inherit_closed_loop_volume_budget
          cargo test -p fullmag-runner --lib antenna_field_solution::direct_quadrature

      - name: Run material library and scene assignment contracts
        run: |
          cargo test --locked -p fullmag-api --bin fullmag-api material_library
          cargo test --locked -p fullmag-workspace --lib material_catalog
          cargo test --locked -p fullmag-application --lib script_source_capture

      - name: Run shared accepted-inspection read contracts
        run: |
          cargo test -p fullmag-session --lib read_transaction
          cargo test -p fullmag-runtime-control --lib accepted_task_stop_is_durable_idempotent_and_terminal_after_stopped_event
          cargo test -p fullmag-runtime-control --lib failed_no_spawn_stop_without_start_preserves_public_stop_fence_and_replays
          cargo test --locked -p fullmag-runtime-control --lib no_spawn_genesis_recovers_only_exact_immutable_admission_and_replays
          cargo test --locked -p fullmag-runtime-control --lib step_output_inputs_are_derived_from_the_current_successful_attempt
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-runtime-control --lib tests::accepted_task_stop_waits_for_writer_before_recovery_without_duplicating_stop -- --exact
          cargo test -p fullmag-runtime-control --lib study_inspection_integrity
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-runtime-control --lib claim::scoped_store_io_classification_tests::raw_enodata_is_not_a_global_transient_store_error -- --exact
          cargo test -p fullmag-api --bin fullmag-api router_v2::handlers::data::antenna_inspection::tests

      - name: Run read-only session preview contracts
        env:
          RUST_MIN_STACK: 16777216
        run: |
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::tests::session_previews_coexist_with_live_run_and_close_independently -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::tests::opening_scene_preview_from_python_requires_explicit_consent -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::tests::opening_scene_preview_from_python_captures_only_the_authored_model -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::handlers::sessions::preview::tests::script_capture_admission_is_bounded -- --exact

      - name: Run terminal Docker recovery contracts
        run: cargo test -p fullmag-session --lib runtime_service::retained_terminal_runs::tests --no-fail-fast

      - name: Run retained manual-held Docker recovery contracts
        run: |
          cargo test -p fullmag-session --lib runtime_service::retained_held_manual_runs::tests --no-fail-fast
          cargo test -p fullmag-session --lib manual_held --no-fail-fast

      - name: Run accepted explicit Compute start-gate contracts
        run: |
          cargo test -p fullmag-session --lib accepted_start_gate
          cargo test -p fullmag-session --lib accepted_stage_receipt
          cargo test -p fullmag-runtime-control --lib accepted_start
          cargo test -p fullmag-runtime-control --lib accepted_recovery_requires_release
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker restored_manual_worker_requires_exact_compute_release
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker::closed_loop_run_parameter_tests::

      - name: Run Docker accepted workspace startup and projection contracts
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo check --locked -p fullmag-api --bins
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_study_worker::accepted_fdm_precision_tests:: --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker::accepted_fdm_precision_tests:: --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker::accepted_live_field_cadence_tests:: --no-fail-fast
          cargo test -p fullmag-plan --lib preparation::tests::fdm_
          cargo test -p fullmag-api --bin fullmag-api docker_startup::tests
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_solver_profile:: --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api-accepted-worker accepted_solver_profile:: --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api live_accepted_projection::operation_profile_projection_tests:: --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api live_retirement --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api session_status_reports_current_energy --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_live_energy_clock_tests --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::handlers::platform::development_restart::tests --no-fail-fast
          cargo test --locked -p fullmag-api --bin fullmag-api development_accepted_restore::terminal_observation::tests --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api session_output_target_tests --no-fail-fast
          python3 -B scripts/ci/run_exact_cargo_test.py -p fullmag-api --bin fullmag-api session::tests::active_run_accepts_next_solver_m_after_same_run_stage_preparation -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py -p fullmag-api --bin fullmag-api session::tests::authored_initial_state_retires_finished_run_but_not_another_run -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py -p fullmag-api --bin fullmag-api session::tests::pending_user_magnetization_apply_still_supersedes_its_run -- --exact
          cargo test -p fullmag-api --bin fullmag-api live_accepted_execution::tests
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::handlers::data::response_source_map::tests
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_compact_response_versions_remain_truthful_in_public_payloads
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_compact_sweep_does_not_read_redundant_dense_v2
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_response_reader_tests_compact_sweep_projects_native_amplitude
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker::frequency_response_receipt_tests::response_receipt_reopens_typed_cas_outputs_without_an_accepted_state -- --exact
          FULLMAG_FDM_EXECUTION=cpu python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-runtime-control --lib study::tests::relaxation_worker_binds_the_previous_final_samples_or_the_explicit_authored_reset -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api openapi_v2::tests::openapi_exposes_interactive_study_commands_and_exact_result_reads -- --exact
          cargo test -p fullmag-api --bin fullmag-api live_execution_binding::tests
          cargo test -p fullmag-api --bin fullmag-api isolated_snapshot_restore::tests
          cargo test -p fullmag-api --bin fullmag-api development_accepted_restore::tests
          cargo test -p fullmag-runtime-control --lib scheduler::accepted_start_tests
          cargo test -p fullmag-api --bin fullmag-api live_accepted_projection::tests
          cargo test --locked -p fullmag-api --bin fullmag-api accepted_run_performance::tests
          cargo test -p fullmag-api --bin fullmag-api accepted_fem_study_worker::source_contract_tests
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker accepted_fem_study_worker::source_contract_tests
          cargo test -p fullmag-api --bin fullmag-api live_scene_preparation::tests
          cargo test -p fullmag-api --bin fullmag-api-accepted-fem-preparation-scheduler --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api accepted_preparation_completion_keeps_reserved_record_after_mesh_revision_moves
          cargo test -p fullmag-api --bin fullmag-api preparation_failure_and_stop_terminalize_only_their_reserved_records
          cargo test -p fullmag-api --bin fullmag-api old_preparation_terminalization_does_not_mutate_replacement_session_ledger
          cargo test -p fullmag-api --bin fullmag-api rejected_accepted_admission_does_not_reserve_a_run_command

      - name: Verify Live Charts table ownership and binary rows
        env:
          RUST_MIN_STACK: 8388608
        run: |
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::handlers::data::tables::modal_history_tests::live_view_continuity_binary_rows_header_pins_exact_a1_and_b1_attempts -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::handlers::data::tables::modal_history_tests::live_view_continuity_rejects_unbound_scalar_table_rows -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-api --bin fullmag-api router_v2::middleware::cors::tests::live_view_continuity_browser_clients_can_read_the_table_series_identity_header -- --exact
          cargo test --locked -p fullmag-api --bin fullmag-api table_rows_binary

      - name: Run runtime service sampler and control contracts
        run: cargo test -p fullmag-api --bin fullmag-runtime-service --no-fail-fast

      - name: Check mixed-history recovery CLI contract
        run: cargo check -p fullmag-cli --bin fullmag

      - name: Run explicit reaped-worker failure recovery contracts
        run: cargo test -p fullmag-api --bin fullmag-runtime-service failed_worker_recovery::tests --no-fail-fast

      - name: Run disconnected mixed-P1 v2 API summary contracts
        run: cargo test -p fullmag-api --bin fullmag-api mixed_v2_summary_tests --no-fail-fast

      - name: Run read-only retained snapshot validation contracts
        run: |
          cargo test -p fullmag-session --lib retained_snapshot --no-fail-fast
          cargo test -p fullmag-cli --bin fullmag retained_snapshot --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api isolated_snapshot --no-fail-fast

      - name: Run native container recovery capability CLI contracts
        run: cargo test -p fullmag-cli --bin fullmag container_recovery_capabilities

      - name: Verify read-only saved FDM/FEM playback and binary frame routes
        run: |
          # Writer-gate tests launch a child that can briefly inherit unrelated
          # manifest locks from other test threads before exec.
          cargo test --locked -p fullmag-workspace-inspect --lib -- --test-threads=1
          cargo test --locked -p fullmag-api --bin fullmag-api saved_playback_

      - name: Run instance discovery contracts (ADR 0069)
        run: cargo test -p fullmag-api --bin fullmag-api instance_discovery::tests --no-fail-fast

      - name: Run complete session reachability and archive contracts
        run: cargo test -p fullmag-session --lib --no-fail-fast

      - name: Verify accepted provenance archive export and read-only import
        if: ${{ !cancelled() && steps.install-rust.outcome == 'success' && steps.install-python-runtime.outcome == 'success' }}
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-session --lib accepted_provenance
          cargo test -p fullmag-session --lib session_schema_guard_distinguishes_v1_and_readonly_v2_provenance
          cargo test -p fullmag-api --bin fullmag-api accepted_fms_persistence_tests
          cargo test -p fullmag-api --bin fullmag-api context_bound_export_rejects_session_identity_before_script_read

      - name: Run fail-closed compact workspace import regression
        if: ${{ !cancelled() && steps.install-rust.outcome == 'success' && steps.install-python-runtime.outcome == 'success' }}
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test -p fullmag-api --bin fullmag-api compact_session_import_missing_declared_artifact_preserves_active_workspace

      - name: Run runner retention preview cancellation contracts
        env:
          PYTHONPATH: scripts
        run: |
          python -B -m unittest discover -s scripts -p 'test_local_runner_retention*.py'
          python -B -m unittest discover -s scripts -p 'test_local_runner_source_compaction.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_container_api.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_container_main.py'
          python -B -m unittest discover -s scripts -p 'test_local_runner_cli.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_observability_review_regressions.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_observability.py'

      - name: Run attempt-scoped Relax to Eigen bootstrap contract
        run: cargo test -p fullmag-runner relax_bootstrap_certificates_are_attempt_scoped_and_worker_plans_bind_their_bytes --lib

      - name: Run deterministic eigen worker input contracts
        run: cargo test -p fullmag-runner eigen_k_worker --no-fail-fast

      - name: Run CPU direct-minimizer precision-floor and accepted-state contracts
        run: cargo test --locked -p fullmag-runner direct_minimizer_reference::tests --lib
      - name: Run FEM live Stop handoff contracts
        run: |
          cargo test --locked -p fullmag-runner fem_live_control_tests --lib
          cargo test --locked -p fullmag-runner fdm_multilayer_interrupt_publishes_accepted_update_before_stop --lib
      - name: Run native modal cancellation completion contract
        run: cargo test -p fullmag-runner native_modal_run_result_completion_matches_status --lib

      - name: Run CPU periodic Newell kernel cache regressions
        run: cargo test -p fullmag-engine periodic_newell_kernel_cache_tests --lib

      - name: Run field_expr.v1 mask function and time bytecode contracts
        run: cargo test --locked -p fullmag-expr

      - name: Run periodic XY multilayer PG-BB contracts
        run: |
          cargo test --locked -p fullmag-fdm-demag --test periodic_xy_kernel
          cargo test --locked -p fullmag-plan --lib fdm_multilayer_periodic_xy_

      - name: Check spatial material functions from scene authoring through solver planning
        run: |
          cargo test --locked -p fullmag-ir --test material_field_function --test material_field_units
          cargo test --locked -p fullmag-authoring --test material_field_function_scene
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib material::tests::function_field_is_sampled_in_its_frame_at_cells_and_nodes -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib material::tests::absorbing_boundary_adds_on_top_of_a_function_field -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib material::tests::function_field_values_are_checked_against_the_parameter_range -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib tests::material_audit_fdm::function_alpha_is_sampled_at_every_cell_in_the_declared_frame -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib tests::material_audit_fdm::whole_object_function_preserves_small_positive_damping -- --exact
          python3 -B scripts/ci/run_exact_cargo_test.py --locked -p fullmag-plan --lib tests::material_audit_fem::fem_function_alpha_is_sampled_at_every_node -- --exact

      - name: Run local material coefficient regressions
        run: |
          cargo test --locked -p fullmag-engine --lib spatial_ms_anisotropy_tests
          cargo test --locked -p fullmag-plan --lib fem_aex_field_uniformity_uses_relative_si_tolerance
          cargo test --locked -p fullmag-plan --lib fem_planner_elementwise_material_legality_distinguishes_a_from_ms
          cargo test --locked -p fullmag-plan --lib fem_spin_transport_ms_realization_admits_only_the_scalar_torque_coefficient
          cargo test --locked -p fullmag-runner --lib fdm::cpu::reference::tests::torque_

      - name: Run FDM Airbox target membership contracts
        run: |
          cargo test --locked -p fullmag-api --bin fullmag-api fdm_airbox_membership
          cargo test --locked -p fullmag-api --bin fullmag-api multilayer_airbox
          cargo test --locked -p fullmag-api --bin fullmag-api airbox_scope_is_derived_from_resolved_field_carrier

      - name: Run FDM region exchange operator contracts
        run: |
          cargo test --locked -p fullmag-engine --lib fdm::shared::exchange_operator::tests
          cargo test --locked -p fullmag-runner --lib cpu_snapshot_reuses_observation_fft_workspace_across_states
          cargo test --locked -p fullmag-engine --lib exchange_face_tests
          # Cargo returns success when a test-name filter matches nothing.
          dmi_test_log="$(mktemp)"
          trap 'rm -f "$dmi_test_log"' EXIT
          set -o pipefail
          cargo test --locked -p fullmag-runner --lib fdm::cpu::reference::tests::dmi_decoupled_ 2>&1 | tee "$dmi_test_log"
          expected_dmi_tests=(
            fdm::cpu::reference::tests::dmi_decoupled_exchange_connection_is_rejected_before_stepping
            fdm::cpu::reference::tests::dmi_decoupled_exchange_connection_is_rejected_without_exchange_field
            fdm::cpu::reference::tests::dmi_decoupled_exchange_gate_ignores_absent_or_zero_dmi
          )
          for test_name in "${expected_dmi_tests[@]}"; do
            if ! grep -Fqx "test ${test_name} ... ok" "$dmi_test_log"; then
              echo "::error::Expected DMI regression did not pass: ${test_name}" >&2
              exit 1
            fi
          done
          cargo test --locked -p fullmag-plan --lib fdm_region_
          cargo test --locked -p fullmag-plan --lib fdm_cuda_region_material_fields
          cargo test --locked -p fullmag-plan --lib absorbing_boundary_
          cargo test --locked -p fullmag-plan --lib intra_object_region_exchange_defaults_harmonic_mean
          cargo test --locked -p fullmag-plan --lib exchange_scale_zero_disables_interface_exchange
          cargo test --locked -p fullmag-plan --lib pure_inherited_region_preserves_parent_material_and_continuous_exchange
          cargo test --locked -p fullmag-engine --lib magnetoelastic::tests
          cargo test --locked -p fullmag-runner --lib scalar_metrics::tests::fdm_average_m_
