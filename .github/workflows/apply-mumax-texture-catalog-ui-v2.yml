name: Apply Mumax texture catalog and UI coverage v2

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mumax-texture-catalog-ui-v2
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/mumax-texture-catalog-ui-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/mumax-texture-catalog-ui-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Decode and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          payload_path = Path('.github/fullmag-mumax-textures/apply_mumax_textures.py.zlib.b64')
          encoded = payload_path.read_text(encoding='utf-8').strip()
          expected_sha256 = '9b8e4b6432b67a141487bc94ebae2808e5e391175f07dc2ff8cc38e812bd7524'
          actual_sha256 = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if actual_sha256 != expected_sha256:
              raise RuntimeError(
                  f'payload checksum mismatch: expected {expected_sha256}, got {actual_sha256}'
              )

          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')

          # The parity generator was compacted after the payload was authored. Replace only
          # the obsolete parity-edit block, preserving all other generated changes verbatim.
          start_marker = 'parity_path = "crates/fullmag-plan/tests/magnetization_textures_v2_parity.rs"'
          end_marker = '\ncontract_path = "crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs"'
          start = script.index(start_marker)
          end = script.index(end_marker, start)
          parity_section = r"""parity_path = "crates/fullmag-plan/tests/magnetization_textures_v2_parity.rs"
          insert_before_once(
              parity_path,
              '''        make_case(
                      "bimeron",
          ''',
              '''        make_case(
                      "hopfion_compact_support",
                      params([
                          ("major_radius", json!(2.0)),
                          ("minor_radius", json!(0.75)),
                      ]),
                      points_3d.clone(),
                      None,
                  ),
                  make_case(
                      "vortex_wall",
                      params([
                          ("left_mx", json!(1)),
                          ("right_mx", json!(-1)),
                          ("circulation", json!(-1)),
                          ("core_polarity", json!(1)),
                          ("half_width", json!(1.5)),
                          ("core_radius", json!(0.4)),
                          ("plane", json!("xy")),
                      ]),
                      points_2d.clone(),
                      Some(TextureProjectionMode::PlanarXy),
                  ),
                  make_case(
                      "bimeron",
          ''',
          )
          replace_once(parity_path, "    assert_eq!(cases.len(), 14);\n", "    assert_eq!(cases.len(), 16);\n")
          """
          script = script[:start] + parity_section + script[end:]

          script_path = Path('.github/fullmag-mumax-textures/apply_mumax_textures.py')
          compile(script, str(script_path), 'exec')
          script_path.write_text(script, encoding='utf-8')
          PY
          python .github/fullmag-mumax-textures/apply_mumax_textures.py

      - name: Format changed Rust files
        run: |
          rustfmt --edition 2021 \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_parity.rs

      - name: Regenerate and compact Rust/Python parity fixture
        shell: bash
        env:
          FULLMAG_GENERATE_V2_PARITY: '1'
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('crates/fullmag-plan/tests/fixtures/magnetization_textures_v2_parity.json')
          before = json.loads(path.read_text(encoding='utf-8'))
          canonical_before = hashlib.sha256(
              json.dumps(before, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          path.write_text(
              json.dumps(before, separators=(',', ':'), ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          after = json.loads(path.read_text(encoding='utf-8'))
          canonical_after = hashlib.sha256(
              json.dumps(after, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          if before != after or canonical_before != canonical_after:
              raise RuntimeError('parity fixture semantic value changed during compaction')
          print(f'parity semantic sha256: {canonical_after}')
          print(f'compact size: {path.stat().st_size} bytes')
          PY
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity

      - name: Validate Rust backend and contracts
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan --test magnetization_textures_v2_contract
          cargo check -p fullmag-plan -p fullmag-py-core

      - name: Validate Python API and reference evaluator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -e packages/fullmag-py
          python -m pytest -q \
            packages/fullmag-py/tests/test_advanced_magnetic_textures.py \
            packages/fullmag-py/tests/test_preset_texture_v2_parity.py \
            packages/fullmag-py/tests/test_bimeron_textures.py \
            packages/fullmag-py/tests/test_mumax_texture_compatibility.py

      - name: Validate documentation contract
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json \
            --repo-root .
          python -m unittest discover -s packages/fullmag-py/tests \
            -p 'test_public_python_api_documentation.py' -v
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate UI catalog, serialization, and types
        run: |
          set -euo pipefail
          pnpm --dir apps/control-room exec vitest run \
            src/shared/domain/magnetization-texture/texturePresets.test.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.test.ts
          pnpm --dir apps/control-room typecheck
          pnpm --dir apps/control-room exec eslint --max-warnings 0 \
            src/shared/domain/magnetization-texture/texturePresets.ts \
            src/shared/domain/magnetization-texture/texturePresets.test.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanel.tsx \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.test.ts

      - name: Verify catalog and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_parity.rs
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path

          catalog = Path('apps/control-room/src/shared/domain/magnetization-texture/texturePresets.ts').read_text(encoding='utf-8')
          ids = re.findall(r'\bid:\s*"([a-z0-9_]+)"', catalog)
          expected = [
              'uniform', 'random_seeded', 'vortex', 'antivortex', 'vortex_wall',
              'bloch_skyrmion', 'neel_skyrmion', 'antiskyrmion', 'skyrmionium',
              'bimeron', 'domain_wall', 'two_domain', 'helical', 'conical',
              'hopfion', 'hopfion_compact_support',
          ]
          if ids != expected:
              raise RuntimeError(f'UI texture catalog mismatch: {ids!r}')

          python_api = Path('packages/fullmag-py/src/fullmag/init/textures.py').read_text(encoding='utf-8')
          rust_sampler = Path('crates/fullmag-plan/src/magnetization_textures_v2.rs').read_text(encoding='utf-8')
          for kind in ('vortex_wall', 'hopfion_compact_support'):
              if python_api.count(f'def {kind}(') != 1:
                  raise RuntimeError(f'Python factory missing or duplicated: {kind}')
              if f'"{kind}" =>' not in rust_sampler:
                  raise RuntimeError(f'Rust sampler dispatch missing: {kind}')
          PY

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fullmag-mumax-textures
          rm -f \
            .github/workflows/apply-mumax-texture-catalog-ui.yml \
            .github/workflows/apply-mumax-texture-catalog-ui-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit \
            -m 'feat: complete Mumax texture catalog and UI coverage' \
            -m 'Add Mumax-compatible VortexWall and HopfionCompactSupport presets, expose all 16 Fullmag analytic magnetic textures in the Control Room editor, and extend Rust, Python, parity, documentation, and UI validation.'
          git push origin HEAD:codex/mumax-texture-catalog-ui-20260823
