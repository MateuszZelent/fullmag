name: eigensolve-comsol-reference-contracts

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'scripts/frequency_domain_generation.py'
      - 'scripts/test_frequency_domain_generation.py'
      - 'scripts/comsol_cross_run_matching.py'
      - 'scripts/test_comsol_cross_run_matching.py'
      - 'scripts/comsol_signed_k_replay.py'
      - 'scripts/test_comsol_signed_k_replay.py'
      - 'scripts/comsol_modal_field_certificate.py'
      - 'scripts/test_comsol_modal_field_certificate.py'
      - 'scripts/comsol_tracking_fields.py'
      - 'scripts/test_comsol_tracking_fields.py'
      - 'scripts/comsol_tracking_replay.py'
      - 'scripts/test_comsol_tracking_replay.py'
      - 'scripts/validate_comsol_dispersion_scientific_gate.py'
      - 'scripts/test_validate_comsol_dispersion_scientific_gate.py'
      - 'scripts/compare_comsol_a1_frequency_reference.py'
      - 'scripts/test_compare_comsol_a1_frequency_reference.py'
      - 'scripts/run_comsol_dispersion_benchmark.py'
      - 'scripts/test_run_comsol_dispersion_benchmark.py'
      - 'docs/guides/comsol-dispersion-benchmark/parameters.json'
      - '.github/workflows/eigensolve-comsol-reference-contracts.yml'

permissions:
  contents: read

jobs:
  a1-external-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Preserve exact source identity
        run: git rev-parse HEAD
      - name: Install existing benchmark fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          python -m pip install 'pytest>=9,<10' 'matplotlib>=3.8,<4'
          python -m pip install -e 'packages/fullmag-py[meshing]'
      - name: Require explicit A1 proof refusal and recomputed reference pairs
        run: |
          set -o pipefail
          python -B scripts/test_validate_comsol_dispersion_scientific_gate.py A1ExternalFrequencyGateTests -v 2>&1 | tee "$RUNNER_TEMP/a1-reference-contracts.log"
          grep -F 'test_zero_error_and_declared_verified_proof_still_cannot_qualify' "$RUNNER_TEMP/a1-reference-contracts.log"
          grep -F 'test_reference_replacement_during_read_invalidates_bound_comparison' "$RUNNER_TEMP/a1-reference-contracts.log"
      - name: Run complete scientific gate and benchmark handoff source contracts
        env:
          PYTHONPATH: scripts
          MPLBACKEND: Agg
        run: >-
          python -B -m pytest -q
          scripts/test_validate_comsol_dispersion_scientific_gate.py
          scripts/test_comsol_modal_field_certificate.py
          scripts/test_comsol_tracking_fields.py
          scripts/test_comsol_tracking_replay.py
          scripts/test_comsol_cross_run_matching.py
          scripts/test_comsol_signed_k_replay.py
          scripts/test_compare_comsol_a1_frequency_reference.py
          scripts/test_run_comsol_dispersion_benchmark.py


  generation-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify generation reader and exact byte binding
        run: python -B scripts/test_frequency_domain_generation.py -v
