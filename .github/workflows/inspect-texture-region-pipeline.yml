name: Inspect texture transform and region pipeline

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'codex/texture-transform-region-clipping-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/texture-transform-region-clipping-20260823
      - name: Print FDM test patch section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload_dir = Path('.github/fullmag-texture-region-refactor')
          encoded = ''.join(
              (payload_dir / f'payload.part{index:02d}').read_text(encoding='utf-8').strip()
              for index in range(1, 11)
          )
          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          lines = script.splitlines()
          for line_number in range(120, min(220, len(lines)) + 1):
              print(f'{line_number:5d}: {lines[line_number - 1]}')
          PY
