name: Inspect texture transform and region pipeline

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'codex/texture-transform-region-clipping-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/texture-transform-region-clipping-20260823
      - name: Print documentation patch anchors from payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload_dir = Path('.github/fullmag-texture-region-refactor')
          encoded = ''.join(
              (payload_dir / f'payload.part{index:02d}').read_text(encoding='utf-8').strip()
              for index in range(1, 11)
          )
          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          lines = script.splitlines()
          for index, line in enumerate(lines, start=1):
              lowered = line.lower()
              if (
                  'mermaid' in lowered
                  or 'preset-textures.md' in line
                  or 'implementation mapping' in lowered
                  or 'discrete realization' in lowered
                  or 'clipping is always performed' in lowered
              ):
                  start = max(1, index - 18)
                  end = min(len(lines), index + 35)
                  print(f'\n===== SCRIPT LINES {start}-{end}; MATCH {index} =====')
                  for line_number in range(start, end + 1):
                      print(f'{line_number:5d}: {lines[line_number - 1]}')
          PY
