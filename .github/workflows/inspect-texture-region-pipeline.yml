name: Inspect texture transform and region pipeline

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'codex/texture-transform-region-clipping-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/texture-transform-region-clipping-20260823
      - name: Decode generator and package inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload_dir = Path('.github/fullmag-texture-region-refactor')
          encoded = ''.join(
              (payload_dir / f'payload.part{index:02d}').read_text(encoding='utf-8').strip()
              for index in range(1, 11)
          )
          script = zlib.decompress(base64.b64decode(encoded, validate=True))
          Path('/tmp/texture-region-apply.py').write_bytes(script)
          print(f'decoded {len(script)} bytes')
          PY
          tar -czf /tmp/texture-region-inputs.tar.gz \
            crates/fullmag-plan/src \
            crates/fullmag-plan/tests \
            public_docs/site/python-api/magnets-and-textures/preset-textures.md \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json
      - name: Upload decoded generator
        uses: actions/upload-artifact@v4
        with:
          name: texture-region-generator
          path: /tmp/texture-region-apply.py
          if-no-files-found: error
          retention-days: 1
      - name: Upload deterministic input snapshot
        uses: actions/upload-artifact@v4
        with:
          name: texture-region-inputs
          path: /tmp/texture-region-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
