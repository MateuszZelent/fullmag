name: pypi-publish

# Build the pure-Python package on master or by manual request. PR builds are
# called read-only from ci-required.yml; only these manual jobs receive OIDC.

on:
  push:
    branches: [master]
    paths:
      - packages/fullmag-py/**
      - Cargo.toml
      - .github/workflows/pypi-publish.yml
      - .github/workflows/pypi-build.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Public PEP 440 version, base must equal Cargo [workspace.package].version (e.g. 0.1.0rc1, 0.1.0, 0.1.0.dev1)'
        required: true
        type: string
      target:
        description: 'Package index to upload to'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

# Each manual upload gets its own group. Build-only push runs supersede older builds.
concurrency:
  group: pypi-publish-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'check' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/pypi-build.yml
    permissions:
      contents: read
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      release: ${{ github.event_name == 'workflow_dispatch' }}

  publish-testpypi:
    name: upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fullmag/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: upload to PyPI
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
      && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fullmag/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
