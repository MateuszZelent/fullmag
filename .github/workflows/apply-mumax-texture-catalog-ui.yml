name: Apply Mumax texture catalog and UI coverage

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: mumax-texture-catalog-ui
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.head_ref == 'codex/mumax-texture-catalog-ui-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/mumax-texture-catalog-ui-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Decode and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          source = Path('.github/fullmag-mumax-textures/apply_mumax_textures.py.zlib.b64')
          encoded = source.read_text(encoding='utf-8').strip()
          expected = 'c99c67e9815266cdcc78f0d061bae38a4b3aafabbd7c8f14decdec73afe6ee68'
          actual = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if actual != expected:
              raise RuntimeError(f'implementation payload checksum mismatch: {actual}')
          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          target = Path('.github/fullmag-mumax-textures/apply_mumax_textures.py')
          compile(script, str(target), 'exec')
          target.write_text(script, encoding='utf-8')
          PY
          python .github/fullmag-mumax-textures/apply_mumax_textures.py

      - name: Format changed Rust sources
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_parity.rs

      - name: Regenerate and compact Rust/Python parity fixture
        shell: bash
        env:
          FULLMAG_GENERATE_V2_PARITY: "1"
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('crates/fullmag-plan/tests/fixtures/magnetization_textures_v2_parity.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          semantic = hashlib.sha256(
              json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          path.write_text(
              json.dumps(value, separators=(',', ':'), ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          reparsed = json.loads(path.read_text(encoding='utf-8'))
          if reparsed != value:
              raise RuntimeError('parity fixture changed semantically during compaction')
          print(f'parity semantic sha256={semantic}')
          print(f'parity compact bytes={path.stat().st_size}')
          PY

      - name: Validate canonical Rust sampler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity
          cargo test -p fullmag-plan --test magnetization_textures_v2_contract
          cargo test -p fullmag-plan --lib texture_object_space_tests
          cargo check -p fullmag-plan -p fullmag-py-core

      - name: Validate Python authoring API and reference evaluator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -e packages/fullmag-py
          python -m pytest -q \
            packages/fullmag-py/tests/test_mumax_texture_compatibility.py \
            packages/fullmag-py/tests/test_advanced_magnetic_textures.py \
            packages/fullmag-py/tests/test_preset_texture_v2_parity.py \
            packages/fullmag-py/tests/test_bimeron_textures.py

      - name: Install frontend workspace
        run: pnpm install --frozen-lockfile

      - name: Validate texture UI catalog and serialization
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @fullmag/control-room test -- \
            src/shared/domain/magnetization-texture/texturePresets.test.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.test.ts
          pnpm --filter @fullmag/control-room typecheck
          pnpm --dir apps/control-room exec eslint \
            src/shared/domain/magnetization-texture/texturePresets.ts \
            src/shared/domain/magnetization-texture/texturePresets.test.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanel.tsx \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.ts \
            src/modules/inspector/panels/ObjectMagneticTexturePanelModel.test.ts

      - name: Validate public documentation contract
        shell: bash
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json \
            --repo-root .
          python -m unittest packages/fullmag-py/tests/test_public_python_api_documentation.py -v
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Final diff audit
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_parity.rs
          git diff --check
          test "$(grep -c 'def vortex_wall(' packages/fullmag-py/src/fullmag/init/textures.py)" -eq 1
          test "$(grep -c 'def hopfion_compact_support(' packages/fullmag-py/src/fullmag/init/textures.py)" -eq 1
          test "$(grep -c 'id: \"hopfion_compact_support\"' apps/control-room/src/shared/domain/magnetization-texture/texturePresets.ts)" -eq 1
          test "$(grep -c 'id: \"vortex_wall\"' apps/control-room/src/shared/domain/magnetization-texture/texturePresets.ts)" -eq 1

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fullmag-mumax-textures
          rm -f .github/workflows/apply-mumax-texture-catalog-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit \
            -m "feat: complete Mumax texture catalog and UI coverage" \
            -m "Add exact VortexWall and HopfionCompactSupport configurations, expose every implemented analytic texture in the object and region editor, extend Rust/Python parity and contract tests, and document the CurrentMag state-transfer equivalent."
          git push origin HEAD:codex/mumax-texture-catalog-ui-20260823
