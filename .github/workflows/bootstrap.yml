{
  "name": "PR425 surface reference only; production DTQ gate FAIL",
  "on": {
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr425-surface-reference-${{ github.event.pull_request.number }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "surface-reference-only": {
      "name": "Four mathematical controls; production DTQ remains FAIL",
      "if": "${{ github.event.pull_request.number == 425 }}",
      "runs-on": "ubuntu-latest",
      "container": "python:3.11-slim",
      "timeout-minutes": 10,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUNBUFFERED": "1"
      },
      "steps": [
        {
          "name": "Read PR425 source without credentials or overlays",
          "id": "checkout",
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Record Python/platform and enforce three source byte pins",
          "id": "pins",
          "shell": "sh",
          "run": "python -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,platform,sys\nroot=Path('.'); output=root/'surface-reference-evidence'; output.mkdir(exist_ok=True)\nbase=root/'.github/antenna-retained-dtq/surface-reference'\nexpected={'reference.py': '68a705c2749cf1c150f156d2a8f20ea683009ad1fbe9591e64d5a2ec2f1d1c66', 'verify_inputs.py': '276e34b5eb563f1d5a5f82db17e1a5d69c85142996b715256f8f3bd75e977bd5', 'fixture.json': '1e1d38a360a47f69bd1fdee804231f93f851b69101c15a74f6bd246806c4d891'}\nreport={'python':sys.version,'platform':platform.platform(),'github_sha':os.environ.get('GITHUB_SHA'),'workflow_ref':os.environ.get('GITHUB_WORKFLOW_REF'),'expected_sha256':expected,'actual':{}}\nok=True\nfor name,digest in expected.items():\n    p=base/name\n    actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None\n    report['actual'][name]=actual\n    ok=ok and actual==digest\nreport['status']='PASS' if ok else 'REFUSED'\n(output/'source-pins.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nraise SystemExit(0 if ok else 2)\nPY\n"
        },
        {
          "name": "Check exact fixture reconstruction and refusal self-checks (stdlib only)",
          "id": "inputs",
          "shell": "sh",
          "run": "python -B .github/antenna-retained-dtq/surface-reference/verify_inputs.py > surface-reference-evidence/input-readback.log 2>&1\n"
        },
        {
          "name": "Download exactly one original mpmath wheel; no install or retry",
          "id": "wheel",
          "shell": "sh",
          "run": "set -eu\nmkdir surface-reference-evidence/dependency\npython -m pip download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --retries 0 --timeout 45 --dest surface-reference-evidence/dependency mpmath==1.3.0 > surface-reference-evidence/dependency-download.log 2>&1\npython -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json\nout=Path('surface-reference-evidence'); files=list((out/'dependency').iterdir())\nreport={'status':'REFUSED','expected_filename':'mpmath-1.3.0-py3-none-any.whl','expected_sha256':'a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c','files':[p.name for p in files]}\nok=len(files)==1 and files[0].is_file() and files[0].name==report['expected_filename']\nif ok:\n    report['actual_sha256']=hashlib.sha256(files[0].read_bytes()).hexdigest()\n    ok=report['actual_sha256']==report['expected_sha256']\nreport['status']='PASS' if ok else 'REFUSED'\n(out/'dependency-pin.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nraise SystemExit(0 if ok else 2)\nPY\n"
        },
        {
          "name": "Four existing-oracle calls; reference-only PASS permitted",
          "id": "reference",
          "if": "${{ always() && steps.checkout.outcome == 'success' && steps.pins.outcome == 'success' && steps.inputs.outcome == 'success' && steps.wheel.outcome == 'success' }}",
          "shell": "sh",
          "run": "python -B .github/antenna-retained-dtq/surface-reference/reference.py > surface-reference-evidence/reference.log 2>&1\n"
        },
        {
          "name": "Always record missing/refused reference status and production limitation",
          "if": "${{ always() }}",
          "shell": "sh",
          "env": {
            "CHECKOUT": "${{ steps.checkout.outcome }}",
            "PINS": "${{ steps.pins.outcome }}",
            "INPUTS": "${{ steps.inputs.outcome }}",
            "WHEEL": "${{ steps.wheel.outcome }}",
            "REFERENCE": "${{ steps.reference.outcome }}"
          },
          "run": "python -B - <<'PY'\nfrom pathlib import Path\nimport json,os\nout=Path('surface-reference-evidence'); out.mkdir(exist_ok=True)\nreference=out/'reference.json'\nreport={'production_gate':'PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516','qualification':'NOT VERIFIED','steps':{key:os.environ[key] for key in ('CHECKOUT','PINS','INPUTS','WHEEL','REFERENCE')},'reference_json_exists':reference.is_file(),'reference_status':json.loads(reference.read_text())['status'] if reference.is_file() else 'NOT RUN: prerequisite or process failure; no field result','prior_production_commit':'099621f654299c7d20911be85e57c4782de967dd','prior_production_run':43647488516}\n(out/'terminal-state.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nPY\n"
        },
        {
          "name": "Always upload reference logs, JSON and source/dependency pins",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "pr425-surface-reference-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "surface-reference-evidence/*.log\nsurface-reference-evidence/*.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "PRODUCTION DTQ GATE REMAINS FAIL (independent of reference status)",
          "if": "${{ always() }}",
          "shell": "sh",
          "run": "python -B - <<'PY'\nprint('PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516', flush=True)\nraise SystemExit(1)\nPY\n"
        }
      ]
    }
  }
}
