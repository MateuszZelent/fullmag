name: bootstrap
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: antenna-retained-dtq-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout exact CI snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime and mesh preparation dependencies
        id: install-python-runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Resolve storage for API artifact fixtures
        run: |
          python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
               "--profile", "ci-rust-contracts", "--create"],
              check=True, capture_output=True, text=True,
          )
          layout = json.loads(result.stdout)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(
                  f"FULLMAG_PROJECT_STORAGE_ROOT={layout['storage_root']}\n"
              )
          PY

      - name: Apply pinned worktree source delta
        run: |
          python -B - <<'PY'
          import gzip,hashlib,subprocess
          from pathlib import Path
          packed=Path('.github/antenna-completed-receipt/source.patch.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == 'cd81f2c884805ac0b10790c9af6d116155b5fbffa07f6471dd46a8ff66723032'
          patch=gzip.decompress(packed)
          assert len(patch) == 1509276
          assert hashlib.sha256(patch).hexdigest() == 'fcfdde4ac3dbb1061682e4bc838565b723457020e2380c3ef461005f9c9d99c7'
          subprocess.run(['git','apply','--check','--whitespace=nowarn','-'],input=patch,check=True)
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
          print('Verified exact Rust source delta: fcfdde4ac3dbb1061682e4bc838565b723457020e2380c3ef461005f9c9d99c7')
          PY

      - name: Apply exact artifact GREEN source snapshot
        run: |
          python -B - <<'PYCI'
          import gzip,hashlib,io,tarfile
          from pathlib import Path
          packed=Path('.github/antenna-retained-dtq/task-1-source.tar.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == '34aa5fbaf7a6617b65eedb221bdac40992cf9f606cb78cb6c6815a1f74c399ad'
          allowed=('crates/fullmag-antenna-artifacts/','crates/fullmag-ir/','crates/fullmag-quantities/')
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(packed)),mode='r:') as archive:
              members=archive.getmembers()
              assert len(members)==121
              for entry in members:
                  name=entry.name
                  assert entry.isfile() and not name.startswith('/') and '..' not in Path(name).parts
                  assert name in ('Cargo.toml','Cargo.lock') or name.startswith(allowed)
                  data=archive.extractfile(entry).read()
                  target=Path(name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('Exact Task 1 GREEN source overlay: 34aa5fbaf7a6617b65eedb221bdac40992cf9f606cb78cb6c6815a1f74c399ad')
          PYCI
      - name: Apply reviewed literal historical v1 hash assertion
        run: |
          python -B - <<'PYCI'
          import hashlib
          from pathlib import Path
          data=Path('.github/antenna-retained-dtq/task-1-fix1-tests.rs').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='3b89b8424b5eeb86e885bc5101716c7b13be4247b2140bd73d81e30d403712ea'
          Path('crates/fullmag-antenna-artifacts/src/retained_current/tests_v2.rs').write_bytes(data)
          PYCI
      - name: Verify full historical v1 bundle hash after review
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-antenna-artifacts --lib retained_current::tests_v2::surface_v1_golden_stays_exact -- --nocapture 2>&1 | tee antenna-retained-dtq-artifact.log
      - name: Preserve artifact contract log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antenna-retained-dtq-task1-fix1
          path: antenna-retained-dtq-artifact.log
          if-no-files-found: warn
