name: bootstrap
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: antenna-completed-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout exact CI snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime and mesh preparation dependencies
        id: install-python-runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Resolve storage for API artifact fixtures
        run: |
          python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
               "--profile", "ci-rust-contracts", "--create"],
              check=True, capture_output=True, text=True,
          )
          layout = json.loads(result.stdout)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(
                  f"FULLMAG_PROJECT_STORAGE_ROOT={layout['storage_root']}\n"
              )
          PY

      - name: Apply pinned worktree source delta
        run: |
          python -B - <<'PY'
          import gzip,hashlib,subprocess
          from pathlib import Path
          packed=Path('.github/antenna-completed-receipt/source.patch.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == 'cd81f2c884805ac0b10790c9af6d116155b5fbffa07f6471dd46a8ff66723032'
          patch=gzip.decompress(packed)
          assert len(patch) == 1509276
          assert hashlib.sha256(patch).hexdigest() == 'fcfdde4ac3dbb1061682e4bc838565b723457020e2380c3ef461005f9c9d99c7'
          subprocess.run(['git','apply','--check','--whitespace=nowarn','-'],input=patch,check=True)
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
          print('Verified exact Rust source delta: fcfdde4ac3dbb1061682e4bc838565b723457020e2380c3ef461005f9c9d99c7')
          PY

      - name: Reproduce publication re-entry (CI mutation only)
        run: |
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('crates/fullmag-api/src/accepted_study_worker.rs')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'c2cf07ff3e9c12ede66c54ed823ee474037a74a28c3b30e30836aa50067ae1b7'
          text=p.read_text()
          before="""    let durable_execution = recover_accepted_completion_for_publication(
                  &receipt_store, accepted, start, &accepted_step, &execution,
              )"""
          after="""    let durable_execution = execute_accepted_worker_start_from_snapshot(
                  &receipt_store, accepted, start, &accepted_step, "default", None,
              )"""
          assert text.count(before)==1
          p.write_text(text.replace(before,after))
          print('CI-ONLY mutation restored launcher re-entry; real public-flow regression must fail')
          PY

      - name: Run actual completed receipt and existing worker regressions
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker:: -- --nocapture 2>&1 | tee antenna-worker-contracts.log
          cargo test --locked -p fullmag-api --bin fullmag-api explicit_project_run_submit_is_durable_and_replays_without_live_session -- --nocapture 2>&1 | tee -a antenna-worker-contracts.log

      - name: Preserve contract log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antenna-completed-receipt-contracts
          path: antenna-worker-contracts.log
          if-no-files-found: warn
