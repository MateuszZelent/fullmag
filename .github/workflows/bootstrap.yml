{
  "name": "PR425 authenticated publication and cold read; production DTQ remains FAIL",
  "on": {
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr425-authenticated-r1-${{ github.event.pull_request.number }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "authenticated-r1": {
      "name": "Authenticated R1; production DTQ FAIL",
      "if": "${{ github.event.pull_request.number == 425 }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUNBUFFERED": "1",
        "CARGO_BUILD_JOBS": "2",
        "RUST_MIN_STACK": "8388608",
        "R1_EXPECTED_HEAD": "${{ github.event.pull_request.head.sha }}"
      },
      "steps": [
        {
          "name": "Checkout exact PR425 event head; no credentials",
          "id": "checkout",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha }}",
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Pin all reviewed R1 inputs before materialization",
          "id": "pins",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json\npath=Path('.github/antenna-retained-dtq/authenticated-r1/ci-pins.json')\nraw=path.read_bytes()\nassert len(raw)==61572 and hashlib.sha256(raw).hexdigest()=='a658513ea4e795a31ce509a5f03d9240ab1ecf8d82e5f7b399d50ed78ff679d8'\npins=json.loads(raw)\nfor name,pin in pins['inputs'].items():\n    p=Path(name)\n    assert not p.is_symlink() and p.resolve().is_relative_to(Path.cwd().resolve()),name\n    data=p.read_bytes()\n    assert len(data)==pin['bytes'] and hashlib.sha256(data).hexdigest()==pin['sha256'],name\nprint('TASK4_AUTHENTICATED_CI_INPUT_PINS_PASS')\nPY\n"
        },
        {
          "name": "Compose only reviewed source dependencies of R1; no UI or diagnostics",
          "id": "materialize",
          "shell": "bash",
          "run": "mkdir -p task4-authenticated-evidence\npython3 -B .github/antenna-retained-dtq/authenticated-r1/materialize_ci.py > task4-authenticated-evidence/materialization.log 2>&1\n"
        },
        {
          "name": "Resolve existing CI storage profile",
          "id": "storage",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nimport json,os,subprocess,sys\nresult=subprocess.run([sys.executable,'-B','scripts/fullmag_storage.py','resolve','--profile','ci-rust-contracts','--create'],check=True,capture_output=True,text=True)\nlayout=json.loads(result.stdout)\nwith open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:\n    out.write('FULLMAG_PROJECT_STORAGE_ROOT='+layout['storage_root']+'\\n')\nPY\n"
        },
        {
          "name": "Install existing pinned just version",
          "id": "just",
          "uses": "extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3",
          "with": {
            "just-version": "1.51.0"
          }
        },
        {
          "name": "Existing Task4 CPU recipe: library compile only, then unchanged exact R1",
          "id": "r1",
          "shell": "bash",
          "run": "set -o pipefail\njust verify-fem-retained-dtq-authenticated-fixture-contract 2>&1 | tee task4-authenticated-evidence/authenticated-r1.log\n"
        },
        {
          "name": "Independently require exact listed/executed test and restore receipts",
          "id": "readback",
          "if": "${{ always() && steps.checkout.outcome == 'success' && steps.pins.outcome == 'success' }}",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport json\nout=Path('task4-authenticated-evidence');out.mkdir(exist_ok=True)\nlog=out/'authenticated-r1.log'\ntext=log.read_text(errors='replace') if log.exists() else ''\nname='task4_authenticated_acceptance::dtq_v2_publication_completion_cold_read_same_bytes'\nrecords=[]\nfor line in text.splitlines():\n    try: row=json.loads(line)\n    except ValueError: continue\n    if isinstance(row,dict): records.append(row)\ncompleted=[r for r in records if r.get('executed_test')==name and r.get('exit')==0 and r.get('production_23_pins_restored') is True]\nrestored=[r for r in records if r.get('hook_exit')==0 and r.get('production_23_pins_restored') is True]\nlisted=text.splitlines().count(name+': test')==1\nmarker=text.splitlines().count('TASK4_AUTHENTICATED_R1_PUBLICATION_COLD_READ_PASS')==1\npassed=len(completed)==1 and len(restored)==1 and listed and marker\nreport={'schema':'fullmag.task4.authenticated_ci_result.v1','status':'PASS' if passed else 'NOT VERIFIED: test absent or failed','exact_test':name,'exact_list_seen':listed,'hook_success_receipts':len(completed),'restore_receipts':len(restored),'shell_success_marker':marker,'production_gate':'PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516','qualification':'NOT VERIFIED','raw_fixture_receipts':'NOT RETAINED: unchanged Rust TempDir RAII cleanup'}\n(out/'r1-result.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nif not passed: raise SystemExit(1)\nprint('TASK4_AUTHENTICATED_R1_ACCEPTANCE_PASS')\nPY\n"
        },
        {
          "name": "Always record R1 separately from production DTQ failure",
          "if": "${{ always() }}",
          "shell": "bash",
          "env": {
            "CHECKOUT": "${{ steps.checkout.outcome }}",
            "PINS": "${{ steps.pins.outcome }}",
            "MATERIALIZE": "${{ steps.materialize.outcome }}",
            "STORAGE": "${{ steps.storage.outcome }}",
            "JUST": "${{ steps.just.outcome }}",
            "R1": "${{ steps.r1.outcome }}",
            "READBACK": "${{ steps.readback.outcome }}"
          },
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport json,os\nout=Path('task4-authenticated-evidence');out.mkdir(exist_ok=True)\npath=out/'r1-result.json'\nresult=json.loads(path.read_text()) if path.exists() else {'status':'NOT RUN: prerequisite/process failure'}\nreport={'production_gate':'PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516','prior_production_run':43647488516,'qualification':'NOT VERIFIED','steps':{k:os.environ.get(k) for k in ('CHECKOUT','PINS','MATERIALIZE','STORAGE','JUST','R1','READBACK')},'r1_status':result['status'],'github_sha':os.environ.get('GITHUB_SHA'),'event_head':os.environ.get('R1_EXPECTED_HEAD')}\n(out/'terminal-state.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nPY\n"
        },
        {
          "name": "Always upload raw R1/list/compiler logs, audits, sourcepins and execution receipts",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "pr425-authenticated-r1-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "task4-authenticated-evidence/*.json\ntask4-authenticated-evidence/*.log",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "PRODUCTION DTQ GATE REMAINS FAIL; R1 does not qualify the method",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "printf '%s\\n' PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516\nexit 1\n"
        }
      ]
    }
  }
}
