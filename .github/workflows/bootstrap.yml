name: bootstrap

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      contract_scope:
        description: Select bootstrap, browser, native modal, positive-mass, or focused CPU SLEPc modal contracts.
        type: choice
        required: true
        default: bootstrap
        options:
          - bootstrap
          - browser
          - positive-mass
          - native-modal
          - floquet-modal-slepc
          - generic-modal-slepc
          - floquet-count-slepc
          - modal-phase-slepc
          - retention

jobs:
  native-modal-cabi-contract:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check FEM CUDA driver library selection
        run: python -B scripts/ci/test_fem_cuda_driver_selection.py

      - name: Compile and run strict modal mass deduplication contract
        run: |
          g++ -std=c++17 -UNDEBUG -Ibackends/fem -Ibackends/fem/include -Inative/include backends/fem/tests/frequency_domain/mode_deduplication_test.cpp backends/fem/cpu/frequency_domain/mode_deduplication.cpp backends/fem/cpu/frequency_domain/mode_filter.cpp backends/fem/cpu/frequency_domain/slepc_modal_eigen.cpp -o "$RUNNER_TEMP/fullmag-modal-mass-dedup-test"
          "$RUNNER_TEMP/fullmag-modal-mass-dedup-test"

      - name: Compile and run dependency-free native modal ABI contract
        run: python -B scripts/ci/run_modal_cabi_contract.py

      - name: Preserve native contract receipt and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-modal-cabi-contract
          path: |
            ${{ runner.temp }}/fullmag-modal-cabi/receipt.json
            ${{ runner.temp }}/fullmag-modal-cabi/step-*.log
          if-no-files-found: error

  rust-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime dependencies
        run: python -m pip install -e packages/fullmag-py

      - name: Run runner retention preview cancellation contracts
        env:
          PYTHONPATH: scripts
        run: |
          python -B -m unittest discover -s scripts -p 'test_local_runner_retention*.py'
          python -B -m unittest discover -s scripts -p 'test_local_runner_source_compaction.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_container_api.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_container_main.py'
          python -B -m unittest discover -s scripts -p 'test_local_runner_cli.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_observability_review_regressions.py'

      - name: Run attempt-scoped Relax to Eigen bootstrap contract
        run: cargo test -p fullmag-runner relax_bootstrap_certificates_are_attempt_scoped_and_worker_plans_bind_their_bytes --lib

      - name: Run deterministic eigen worker input contracts
        run: cargo test -p fullmag-runner eigen_k_worker --no-fail-fast

      - name: Run native modal cancellation completion contract
        run: cargo test -p fullmag-runner native_modal_run_result_completion_matches_status --lib

      - name: Run native modal artifact provenance contract
        run: |
          cargo test -p fullmag-runner native_modal_artifact_limitations_follow_executed_operator_payload --lib
          cargo test -p fullmag-runner native_modal_manifest_distinguishes_numeric_solve_from_comparison --lib
          cargo test -p fullmag-runner actual_path_manifest_distinguishes_numeric_solve_from_comparison --lib
          cargo test -p fullmag-runner eigen_path_single_k_solver_model_ --lib
          cargo test -p fullmag-runner floquet_dynamic_demag_provider_requires_exact_requested_pair_set --lib
          cargo test -p fullmag-runner spectrum_quantity_ --lib

      - name: Run diagnostic flag contracts through real single-k publishers
        run: |
          cargo test -p fullmag-runner eigen::output_selection::tests --lib
          cargo test -p fullmag-runner eigen::diagnostic_artifact::tests --lib
          cargo test -p fullmag-runner eigen_diagnostics_ --lib

      - name: Run sample-scoped eigen artifact contracts
        run: cargo test -p fullmag-runner output_publication_tests --lib

      - name: Run eigen artifact and Kittel residual evidence contracts
        run: cargo test -p fullmag-runner eigen::artifacts::tests --lib

      - name: Run tracking confidence and branch writer contracts
        run: |
          cargo test -p fullmag-runner eigen::tracking::tests --lib --no-fail-fast
          cargo test -p fullmag-runner tracked_pair_overlap_is_published_as_confidence_in_json_and_csv --lib
          cargo test -p fullmag-runner tracking_only_mode_contributes_to_overlap_summary_without_public_mode_selection --lib

      - name: Run raw single-k checkpoint durability contracts
        run: cargo test -p fullmag-runner single_k_checkpoint --lib

      - name: Verify the persisted checkpoint with its Python inspector
        env:
          FULLMAG_CHECKPOINT_INSPECTOR_PYTHON: python3
        run: cargo test -p fullmag-runner checkpoint_inspector_accepts_actual_persisted_manifest --lib -- --ignored

      - name: Run eigen path terminal sample admission contracts
        run: |
          cargo test -p fullmag-runner noncompleted_single_k_status_preserves_raw_bytes_and_stops_admission --lib
          cargo test -p fullmag-runner completed_single_k_status_admits_and_publishes_every_path_sample --lib
          cargo test -p fullmag-runner interrupted_status_keeps_available_raw_diagnostics_with_or_without_checkpoint_root --lib
          cargo test -p fullmag-runner interrupted_checkpoint_write_failure_is_not_returned_as_cancelled --lib
      - name: Run adaptive eigen process pool contracts
        run: |
          cargo test -p fullmag-runner k_process_pool --no-fail-fast
          cargo test -p fullmag-runner adaptive_resources --no-fail-fast

      - name: Run canonical IR, waveguide and typed V04 migration contracts
        run: cargo test -p fullmag-ir --no-fail-fast

      - name: Run eigen branch selector planning contracts
        run: |
          cargo test -p fullmag-plan fem_eigen_branch --lib
          cargo test -p fullmag-plan fem_eigen_raw_mode_indices_remain_valid_without_path_sampling --lib
          cargo test -p fullmag-plan eigen_output_validation_tests --lib
          cargo test -p fullmag-plan eigen_spectrum_quantity_validation_tests --lib

      - name: Run modal solver policy planning contracts
        run: |
          cargo test -p fullmag-plan fem_eigen_modal_solver_policy --lib
          cargo test -p fullmag-plan fem_eigen_floquet_dynamic_demag_requires_explicit_airbox_cpu_path --lib
          cargo test -p fullmag-runner shared_domain_modal_scope_rejects_uncertified_local_tangent_terms --lib
          cargo test -p fullmag-runner material_identity_tests --lib
          cargo test -p fullmag-runner shared_domain_payload_omits_zero_anisotropy_after_certified_linearization --lib

      - name: Run scene periodic boundary intent contracts
        run: cargo test -p fullmag-authoring scene_pbc --lib

      - name: Run scene PBC Rust-Python synchronization regression
        env:
          FULLMAG_REPO_ROOT: ${{ github.workspace }}
          RUST_MIN_STACK: 8388608
        run: cargo test -p fullmag-api --bin fullmag-api scene_pbc_overrides_roundtrip_via_python_helper

      - name: Run full field identity binary transport contracts
        run: |
          cargo test -p fullmag-api --bin fullmag-api field_vector_v5
          cargo test -p fullmag-api --bin fullmag-api analysis_field_vector_binary

      - name: Run frequency-domain artifact ownership contracts
        env:
          # Canonical scene ACK contracts traverse a full SceneDocument, as do
          # the other router contracts using this existing worker stack size.
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-api --bin fullmag-api field_sweep_items_keep_their_owner_identity_and_encode_resource_paths
          cargo test -p fullmag-api --bin fullmag-api spectrum_v3_items_project_durable_field_identity_without_mutating_payload
          cargo test -p fullmag-api --bin fullmag-api openapi_mode_field_availability_is_optional_boolean
          cargo test -p fullmag-api --bin fullmag-api openapi_field_sweep_schema_exposes_typed_dataset_and_sample_contract
          cargo test -p fullmag-api --bin fullmag-api quantities::tests
          cargo test -p fullmag-api --bin fullmag-api frequency_domain_
          cargo test -p fullmag-api --bin fullmag-api authoring_study_runtime_parallel_patch
          cargo test -p fullmag-api --bin fullmag-api authoring_transaction_ack_
          cargo test -p fullmag-api --bin fullmag-api modal_history_tests

      - name: Run application materialization and eigen selector contracts
        run: cargo test -p fullmag-application --no-fail-fast

      - name: Run native session writer lease contracts
        run: cargo test -p fullmag-session --lib writer --no-fail-fast

      - name: Run Rust quantity, API and CLI contracts
        env:
          # The router contract serializes a full SceneDocument; keep the
          # test worker stack large enough for its nested serde traversal.
          RUST_MIN_STACK: 8388608
        run: ./scripts/ci/run_frontend3d_required_gate.sh rust-quantity-api-cli-contracts

  checkpoint-windows-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: checkpoint-windows

      - name: Verify the Windows checkpoint policy from its real writer
        run: cargo test -p fullmag-runner persists_platform_directory_sync_policy_from_real_checkpoint_writer --lib

      - name: Verify the Windows writer-to-inspector contract
        env:
          FULLMAG_CHECKPOINT_INSPECTOR_PYTHON: python
        run: cargo test -p fullmag-runner checkpoint_inspector_accepts_actual_persisted_manifest --lib -- --ignored

  generated-api-determinism:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API determinism
        run: |
          node --test apps/control-room/scripts/normalize-openapi-build-identity.node-test.mjs
          ./scripts/ci/run_frontend3d_required_gate.sh generated-api-determinism

      - name: Preserve generated API contract for source review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-contract-${{ github.run_id }}
          path: |
            apps/control-room/src/kernel/api/generated/openapi-v2.json
            apps/control-room/src/kernel/api/generated/openapi-v2-types.ts
            apps/control-room/src/kernel/api/generated/openapi-v2-client.ts
          if-no-files-found: error

  api-hygiene-rg13:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Install ripgrep 13
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Assert Ubuntu ripgrep 13
        run: test "$(/usr/bin/rg --version | head -n 1)" = "ripgrep 13.0.0"

      - name: Run API hygiene with ripgrep 13
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          test "$("$node_bin" --version)" = "v24.18.0"
          PATH=/usr/bin:/bin "$node_bin" apps/control-room/scripts/check-api-hygiene.mjs

  control-room-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install architecture gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Resource-first migration gates
        run: ./scripts/ci-resource-first-gates.sh --strict

      - name: Check control-room architecture hygiene
        run: pnpm --dir apps/control-room check:architecture-hygiene

      - name: Check control-room idle performance
        run: pnpm --dir apps/control-room audit:idle-performance

      - name: Typecheck, lint and test Control Room
        run: ./scripts/ci/run_frontend3d_required_gate.sh control-room-typecheck-lint-test

      - name: Check control-room compute performance
        run: pnpm --dir apps/control-room audit:compute-performance

      - name: Benchmark control-room compute performance
        run: pnpm --dir apps/control-room bench:compute-performance

      - name: Build control-room app
        run: pnpm --dir apps/control-room build

  browser-fixture-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser fixture smoke
        run: pnpm --dir apps/control-room exec playwright install --with-deps chromium

      - name: Run packaged Runner Console queue contracts
        env:
          FULLMAG_RUNNER_UI_ROOT: ${{ github.workspace }}
          FULLMAG_RUNNER_CONSOLE_ASSETS: ${{ github.workspace }}/scripts/local_runner/ui_dist
          FULLMAG_RUNNER_PLAYWRIGHT: ${{ github.workspace }}/apps/control-room/node_modules/playwright
          FULLMAG_RUNNER_SMOKE_SCREENSHOT: ${{ runner.temp }}/viewport-3d-browser-audit/runner-console.png
        run: |
          node apps/runner-console/test.mjs
          export FULLMAG_RUNNER_CHROMIUM="$(node -p "require('./apps/control-room/node_modules/playwright').chromium.executablePath()")"
          node apps/runner-console/browser-smoke.cjs

      - name: Run browser fixture smoke
        env:
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
        run: ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-smoke

      - name: Verify browser fixture smoke negative control
        env:
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
        run: |
          if FULLMAG_CI_INJECT_FAILURE=browser-fixture-proof-identity \
            ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-smoke; then
            echo "Expected intentional browser proof identity failure." >&2
            exit 1
          fi

      - name: Run Inspector mutation and DMI authoring browser regressions
        env:
          NEXT_PUBLIC_AUDIT_BUILD: "1"
          CONTROL_ROOM_URL: http://127.0.0.1:3100/workspace
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
          CONTROL_ROOM_INSPECTOR_REPORT_DIR: ${{ runner.temp }}/viewport-3d-browser-audit/inspector
        run: |
          mkdir -p "$CONTROL_ROOM_INSPECTOR_REPORT_DIR"
          # Reuse the audit build from this exact CI source snapshot. Start
          # Node directly so the cleanup trap owns the actual server process.
          (
            cd apps/control-room
            exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100
          ) > "$CONTROL_ROOM_INSPECTOR_REPORT_DIR/server.log" 2>&1 &
          inspector_server_pid=$!
          trap 'kill "$inspector_server_pid" 2>/dev/null || true; wait "$inspector_server_pid" 2>/dev/null || true' EXIT
          inspector_ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$inspector_server_pid" 2>/dev/null; then
              cat "$CONTROL_ROOM_INSPECTOR_REPORT_DIR/server.log"
              exit 1
            fi
            if curl --fail --silent --max-time 3 --output /dev/null "$CONTROL_ROOM_URL"; then
              inspector_ready=1
              break
            fi
            sleep 1
          done
          test "$inspector_ready" = 1
          pnpm --dir apps/control-room run smoke:inspector
          CONTROL_ROOM_ANALYSIS_PLOTS_FIXTURE=1 \
            CONTROL_ROOM_ACCEPTANCE_DIR="$CONTROL_ROOM_AUDIT_ARTIFACTS_DIR/analysis-plots" \
            pnpm --dir apps/control-room run smoke:analysis-plots
          ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-source-verify-post-write

      - name: Run start screen stylesheet browser check
        # Static CSS plus inline markup: no server and no audit build are needed.
        env:
          CONTROL_ROOM_BROWSER_CHANNEL: chromium
        run: pnpm --dir apps/control-room run check:start-screen-browser

      - name: Upload browser fixture smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-3d-browser-audit
          path: ${{ runner.temp }}/viewport-3d-browser-audit
          if-no-files-found: error

  fdm-relaxation-qualification:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python test runner
        run: python3 -m pip install --user 'pytest>=9,<10'

      - name: Validate FDM qualification receipt contract
        run: python3 -m pytest -q scripts/test_validate_fdm_relaxation_qualification.py

      - name: Run bounded CPU FP64 physics smoke
        run: timeout --foreground 180s cargo test -p fullmag-runner --test physics_validation fdm_relaxation::uniform_field_alignment -- --ignored --nocapture

  python-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Gmsh system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Audit managed FEM CPU-only verification configuration
        run: python scripts/test_audit_fem_cpu_only_runtime.py -v

      - name: Run complete build receipt contracts
        run: python -B scripts/test_local_runner_build_executor.py -v

      - name: Run retained FEM startup diagnostic contracts
        run: python -B scripts/test_diagnose_managed_fem_startup.py -v

      - name: Run bootstrap workflow contract
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/test_bootstrap_workflow_contract.py -v

      - name: Install Python package
        run: |
          python -m pip install 'pytest>=9,<10'
          python -m pip install -e 'packages/fullmag-py[meshing,figures]'

      - name: Run Göbel 2019 bimeron reproducibility contracts
        run: >-
          python -m pytest -q
          tests/standard_problems/bimeron/goebel_2019/test_verify.py
          tests/standard_problems/bimeron/goebel_2019/test_contract.py
          scripts/test_render_goebel_2019_bimeron_figure.py

      - name: Run eigensolve scene and execution profile merge contracts
        run: >-
          python -m pytest -q
          packages/fullmag-py/tests/test_eigen_scene_merge_contract.py
          packages/fullmag-py/tests/test_scene_document_problem_ir.py
          packages/fullmag-py/tests/test_mesh_stl_fallback_owner_binding.py
          packages/fullmag-py/tests/test_execution_profile_authoring_roundtrip.py
          packages/fullmag-py/tests/test_scene_execution_config.py

      - name: Run FEM tested/runtime library identity contracts
        run: python scripts/test_fem_modal_library_identity.py -v

      - name: Run managed runtime artifact root contracts
        run: python scripts/test_managed_runtime_artifact_root.py -v

      - name: Run output storage authoring and lowering contracts
        run: python scripts/check_output_storage_contract.py

      - name: Run complete SceneDocument authoring roundtrip regressions
        run: >-
          python -m pytest -q
          packages/fullmag-py/tests/test_scratch_authoring_ui_roundtrip.py

      - name: Run frozen probe terminal receipt contracts
        run: python -B scripts/test_run_de_frozen_v2_probe.py -v

      - name: Run ordered stage script roundtrip regressions
        run: >-
          python -m pytest -q
          packages/fullmag-py/tests/test_script_builder_roundtrip.py
          packages/fullmag-py/tests/test_study_stages.py

      - name: Run bounded mesh failure diagnostic contracts
        run: python -B -m unittest discover -s packages/fullmag-py/tests -p 'test_meshing.py' -k MeshFailureDiagnosticTests -v

      - name: Run Python API tests
        run: python -m unittest discover -s packages/fullmag-py/tests -p 'test_api.py' -v

      - name: Run raw single-k checkpoint inspector contracts
        run: python -B scripts/test_inspect_eigen_sample_checkpoint.py -v

      - name: Run modal progress elapsed clock regression
        run: |
          g++ -std=c++17 -Inative/include -Ibackends/fem/include -Ibackends/fem/cpu backends/fem/tests/frequency_domain/modal_progress_elapsed_test.cpp -o "$RUNNER_TEMP/fullmag-modal-progress-clock-test"
          "$RUNNER_TEMP/fullmag-modal-progress-clock-test"

      - name: Run bounded waveguide dense algebra contracts
        run: |
          g++ -std=c++17 -UNDEBUG -Inative/include -Ibackends/fem/include backends/fem/tests/frequency_domain/floquet_waveguide_demag_k_test.cpp backends/fem/cpu/frequency_domain/floquet_waveguide_demag_k.cpp -o "$RUNNER_TEMP/fullmag-waveguide-dense-algebra-test"
          "$RUNNER_TEMP/fullmag-waveguide-dense-algebra-test"

      - name: Run COMSOL scientific gate regression suite
        run: python -B scripts/test_validate_comsol_dispersion_scientific_gate.py -v

      - name: Run nonzero-k controller capsule attestation regression
        run: python -B scripts/test_nonzero_k_validation_controller.py -v

      - name: Run DE Gamma Krylov trial contracts
        run: python scripts/test_de_gamma_krylov_trial.py -v

      - name: Run DE pilot receipt-bound comparison regressions
        run: |
          python -m pip install 'matplotlib>=3,<4'
          python -c 'import matplotlib'
          python -B scripts/test_de_pilot_receipts.py -v
          python -B scripts/test_compare_de_100nm_pilot.py -v
          python -m pytest -q scripts/test_validate_de_smoke_rows.py

      - name: Run COMSOL A1 receipt-bound frequency comparison contracts
        run: python -m pytest -q scripts/test_compare_comsol_a1_frequency_reference.py

      - name: Run rejected COMSOL benchmark mesh terminal contract
        run: >-
          python -m pytest -q
          tests/standard_problems/mumag/comsol_nonzero_k_dispersion/test_contract.py
          -k materialization_cli_terminal_status_follows_benchmark_mesh_acceptance
      - name: Run Python meshing tests
        env:
          FULLMAG_MESH_FAILURE_ARTIFACT_DIR: ${{ runner.temp }}/fullmag-mesh-failure-artifacts
        run: python -X faulthandler -m unittest discover -s packages/fullmag-py/tests -p 'test_meshing.py' -v

      - name: Preserve Python meshing failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-meshing-failure-diagnostics
          path: ${{ runner.temp }}/fullmag-mesh-failure-artifacts
          if-no-files-found: ignore
      - name: Run texture compatibility contracts
        run: >-
          python -m pytest -q
          packages/fullmag-py/tests/test_mumax3_texture_compatibility.py
          packages/fullmag-py/tests/test_preset_texture_v2_parity.py

      - name: Repository consistency checks
        run: python scripts/check_repo_consistency.py


  windows-volatile-storage-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify disposable compiler storage and environment restoration
        run: python scripts/test_windows_volatile_build_storage.py -v

  fem-positive-mass-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'positive-mass' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml

  fem-floquet-modal-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'floquet-modal-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: floquet-modal-slepc
  fem-generic-modal-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'generic-modal-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: generic-modal-slepc

  fem-modal-phase-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'modal-phase-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: modal-phase-slepc

  fem-floquet-count-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'floquet-count-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: floquet-count-slepc

  runner-retention-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'retention' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Use canonical temporary storage for retention fixtures
        shell: python
        run: |
          import os
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve() / "fullmag-retention-temp"
          scratch.mkdir(parents=True, exist_ok=True)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  environment.write(f"{name}={scratch}\n")
      - name: Run execution and runtime retention regressions
        run: python -B -m unittest discover -s scripts -p 'test_local_runner_retention*.py' -v
      - name: Run runtime package quarantine and restart regressions
        run: python -B scripts/test_local_runner_runtime_retention.py -v
      - name: Run local runner runtime reference regressions
        run: python -B scripts/test_local_runner_runtime_references.py -v
      - name: Run source capsule owner binding and cleanup regressions
        run: python -B scripts/test_local_runner_source_compaction.py -v
