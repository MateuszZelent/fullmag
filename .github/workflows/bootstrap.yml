name: bootstrap

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime dependencies
        run: python -m pip install -e packages/fullmag-py

      - name: Run Rust quantity, API and CLI contracts
        run: ./scripts/ci/run_frontend3d_required_gate.sh rust-quantity-api-cli-contracts

  generated-api-determinism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API determinism
        run: ./scripts/ci/run_frontend3d_required_gate.sh generated-api-determinism

  api-hygiene-rg13:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Install ripgrep 13
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Assert Ubuntu ripgrep 13
        run: test "$(/usr/bin/rg --version | head -n 1)" = "ripgrep 13.0.0"

      - name: Run API hygiene with ripgrep 13
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          test "$("$node_bin" --version)" = "v24.18.0"
          PATH=/usr/bin:/bin "$node_bin" apps/control-room/scripts/check-api-hygiene.mjs

  control-room-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resource-first migration gates
        run: ./scripts/ci-resource-first-gates.sh --strict

      - name: Check control-room architecture hygiene
        run: pnpm --dir apps/control-room check:architecture-hygiene

      - name: Check control-room idle performance
        run: pnpm --dir apps/control-room audit:idle-performance

      - name: Typecheck, lint and test Control Room
        run: ./scripts/ci/run_frontend3d_required_gate.sh control-room-typecheck-lint-test

      - name: Check control-room compute performance
        run: pnpm --dir apps/control-room audit:compute-performance

      - name: Benchmark control-room compute performance
        run: pnpm --dir apps/control-room bench:compute-performance

      - name: Build control-room app
        run: pnpm --dir apps/control-room build

  browser-fixture-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser fixture smoke
        run: pnpm --dir apps/control-room exec playwright install --with-deps chromium

      - name: Run browser fixture smoke
        run: ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-smoke

      - name: Verify browser fixture smoke negative control
        run: |
          if FULLMAG_CI_INJECT_FAILURE=browser-fixture-proof-identity \
            ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-smoke; then
            echo "Expected intentional browser proof identity failure." >&2
            exit 1
          fi

      - name: Upload browser fixture smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-3d-browser-audit
          path: apps/control-room/.artifacts/viewport-3d-browser-audit
          if-no-files-found: error

  fdm-relaxation-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python test runner
        run: python3 -m pip install --user 'pytest>=9,<10'

      - name: Validate FDM qualification receipt contract
        run: python3 -m pytest -q scripts/test_validate_fdm_relaxation_qualification.py

      - name: Run bounded CPU FP64 physics smoke
        run: timeout --foreground 180s cargo test -p fullmag-runner --test physics_validation fdm_relaxation::uniform_field_alignment -- --ignored --nocapture

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Gmsh system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Audit managed FEM CPU-only verification configuration
        run: python scripts/test_audit_fem_cpu_only_runtime.py -v

      - name: Run bootstrap workflow contract
        run: python scripts/test_bootstrap_workflow_contract.py -v

      - name: Install Python package
        run: python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Run Python API tests
        run: python -m unittest discover -s packages/fullmag-py/tests -p 'test_api.py' -v

      - name: Run Python meshing tests
        run: python -m unittest discover -s packages/fullmag-py/tests -p 'test_meshing.py' -v

      - name: Repository consistency checks
        run: python scripts/check_repo_consistency.py
