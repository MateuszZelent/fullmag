name: bootstrap

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      contract_scope:
        description: Select bootstrap, browser, Rust, bias-field artifacts, retention, or native modal contracts.
        type: choice
        required: true
        default: bootstrap
        options:
          - bootstrap
          - rust
          - bias-field-artifacts
          - browser
          - positive-mass
          - floquet-source-moments
          - native-modal
          - native-receipt
          - floquet-modal-slepc
          - generic-modal-slepc
          - floquet-count-slepc
          - modal-phase-slepc
          - retention

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.contract_scope || 'default' }}
  cancel-in-progress: true

jobs:
  native-modal-cabi-contract:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'native-receipt' && inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'floquet-source-moments' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention' && inputs.contract_scope != 'rust' && inputs.contract_scope != 'bias-field-artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check FEM CUDA driver library selection
        run: python -B scripts/ci/test_fem_cuda_driver_selection.py

      - name: Compile and run strict modal mass deduplication contract
        run: |
          g++ -std=c++17 -UNDEBUG -Ibackends/fem -Ibackends/fem/include -Inative/include backends/fem/tests/frequency_domain/mode_deduplication_test.cpp backends/fem/cpu/frequency_domain/mode_deduplication.cpp backends/fem/cpu/frequency_domain/mode_filter.cpp backends/fem/cpu/frequency_domain/slepc_modal_eigen.cpp -o "$RUNNER_TEMP/fullmag-modal-mass-dedup-test"
          "$RUNNER_TEMP/fullmag-modal-mass-dedup-test"

      - name: Compile and run dependency-free native modal ABI contract
        run: python -B scripts/ci/run_modal_cabi_contract.py

      - name: Preserve native contract receipt and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-modal-cabi-contract
          path: |
            ${{ runner.temp }}/fullmag-modal-cabi/receipt.json
            ${{ runner.temp }}/fullmag-modal-cabi/step-*.log
          if-no-files-found: error

  rust-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'native-receipt' && inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'floquet-source-moments' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention' && inputs.contract_scope != 'bias-field-artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime and mesh preparation dependencies
        id: install-python-runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Resolve storage for API artifact fixtures
        run: |
          python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
               "--profile", "ci-rust-contracts", "--create"],
              check=True, capture_output=True, text=True,
          )
          layout = json.loads(result.stdout)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(
                  f"FULLMAG_PROJECT_STORAGE_ROOT={layout['storage_root']}\n"
              )
          PY
      - name: Run accepted explicit Compute start-gate contracts
        run: |
          cargo test -p fullmag-session --lib accepted_start_gate
          cargo test -p fullmag-session --lib accepted_stage_receipt
          cargo test -p fullmag-runtime-control --lib accepted_start
          cargo test -p fullmag-runtime-control --lib accepted_recovery_requires_release
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker restored_manual_worker_requires_exact_compute_release

      - name: Run Docker accepted workspace startup and projection contracts
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-plan --lib preparation::tests::fdm_
          cargo test -p fullmag-api --bin fullmag-api docker_startup::tests
          cargo test -p fullmag-api --bin fullmag-api live_retirement --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api session_output_target_tests --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api live_accepted_execution::tests
          cargo test -p fullmag-api --bin fullmag-api development_accepted_restore::tests
          cargo test -p fullmag-runtime-control --lib scheduler::accepted_start_tests
          cargo test -p fullmag-api --bin fullmag-api live_accepted_projection::tests
          cargo test -p fullmag-api --bin fullmag-api accepted_fem_study_worker::source_contract_tests
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker accepted_fem_study_worker::source_contract_tests
          cargo test -p fullmag-api --bin fullmag-api live_scene_preparation::tests
          cargo test -p fullmag-api --bin fullmag-api-accepted-fem-preparation-scheduler --no-fail-fast
          cargo test -p fullmag-api --bin fullmag-api accepted_preparation_completion_keeps_reserved_record_after_mesh_revision_moves
          cargo test -p fullmag-api --bin fullmag-api preparation_failure_and_stop_terminalize_only_their_reserved_records
          cargo test -p fullmag-api --bin fullmag-api old_preparation_terminalization_does_not_mutate_replacement_session_ledger
          cargo test -p fullmag-api --bin fullmag-api rejected_accepted_admission_does_not_reserve_a_run_command

      - name: Run runtime service sampler and control contracts
        run: cargo test -p fullmag-api --bin fullmag-runtime-service --no-fail-fast

      - name: Run disconnected mixed-P1 v2 API summary contracts
        run: cargo test -p fullmag-api --bin fullmag-api mixed_v2_summary_tests --no-fail-fast

      - name: Run complete session reachability and archive contracts
        run: cargo test -p fullmag-session --lib --no-fail-fast

      - name: Verify accepted provenance archive export and read-only import
        if: ${{ !cancelled() && steps.install-rust.outcome == 'success' && steps.install-python-runtime.outcome == 'success' }}
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-session --lib accepted_provenance
          cargo test -p fullmag-session --lib session_schema_guard_distinguishes_v1_and_readonly_v2_provenance
          cargo test -p fullmag-api --bin fullmag-api accepted_fms_export_inspect_readonly_import_and_tamper_rejection
          cargo test -p fullmag-api --bin fullmag-api context_bound_export_rejects_session_identity_before_script_read

      - name: Run fail-closed compact workspace import regression
        if: ${{ !cancelled() && steps.install-rust.outcome == 'success' && steps.install-python-runtime.outcome == 'success' }}
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test -p fullmag-api --bin fullmag-api compact_session_import_missing_declared_artifact_preserves_active_workspace

      - name: Run runner retention preview cancellation contracts
        env:
          PYTHONPATH: scripts
        run: |
          python -B -m unittest discover -s scripts -p 'test_local_runner_retention*.py'
          python -B -m unittest discover -s scripts -p 'test_local_runner_source_compaction.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_container_api.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_container_main.py'
          python -B -m unittest discover -s scripts -p 'test_local_runner_cli.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_observability_review_regressions.py'
          python -B -m unittest discover -s scripts/tests/local_runner -p 'test_observability.py'

      - name: Run attempt-scoped Relax to Eigen bootstrap contract
        run: cargo test -p fullmag-runner relax_bootstrap_certificates_are_attempt_scoped_and_worker_plans_bind_their_bytes --lib

      - name: Run deterministic eigen worker input contracts
        run: cargo test -p fullmag-runner eigen_k_worker --no-fail-fast

      - name: Run native modal cancellation completion contract
        run: cargo test -p fullmag-runner native_modal_run_result_completion_matches_status --lib

      - name: Run CPU periodic Newell kernel cache regressions
        run: cargo test -p fullmag-engine periodic_newell_kernel_cache_tests --lib

      - name: Run typed active eigen Stop and Pause contracts
        run: |
          cargo test -p fullmag-engine fem_sparse::tests::lobpcg_control_ --lib
          cargo test -p fullmag-runner controlled_k_path_retains_only_the_completed_sample_prefix --lib
          cargo test -p fullmag-runner eigen_path_returns_typed_partial_for_stop_and_pause_before_single_k_execution --lib
          cargo test -p fullmag-runner writing_artifacts_control_preserves_certified_native_mode_bytes --lib
          cargo test -p fullmag-runner completed_pool_prefix_precedes_persistent_stop_or_pause --lib
          cargo test -p fullmag-runner interrupted_sample_diagnostics_do_not_collide_with_accepted_prefix_paths --lib
          cargo test -p fullmag-runner direct_floquet_runtime_control_preserves_pause_and_stop_reasons --lib

      - name: Run native modal artifact provenance contract
        run: |
          cargo test -p fullmag-runner native_modal_artifact_limitations_follow_executed_operator_payload --lib
          cargo test -p fullmag-runner native_modal_manifest_distinguishes_numeric_solve_from_comparison --lib
          cargo test -p fullmag-runner actual_path_manifest_distinguishes_numeric_solve_from_comparison --lib
          cargo test -p fullmag-runner eigen_path_single_k_solver_model_ --lib
          cargo test -p fullmag-runner relaxed_path_source_fixture_handoff_is_reused_for_each_nonzero_k_sample_without_per_sample_relaxation --lib
          cargo test -p fullmag-runner floquet_dynamic_demag_provider_requires_exact_requested_pair_set --lib
          cargo test -p fullmag-runner spectrum_quantity_ --lib

      - name: Run diagnostic flag contracts through real single-k publishers
        run: |
          cargo test -p fullmag-runner eigen::output_selection::tests --lib
          cargo test -p fullmag-runner eigen::diagnostic_artifact::tests --lib
          cargo test -p fullmag-runner eigen_diagnostics_ --lib

      - name: Run sample-scoped eigen artifact contracts
        run: cargo test -p fullmag-runner output_publication_tests --lib

      - name: Run selected-only path potential publication contracts
        run: |
          cargo test -p fullmag-runner path_potential_publication_tests --lib
          cargo test -p fullmag-runner deferred_physical_potential_tests --lib

      - name: Run bias-field sample identity rejection contracts
        run: cargo test -p fullmag-runner native_field_sweep_identity_tests --lib

      - name: Run bias-field tracked mode publication contracts
        run: cargo test -p fullmag-runner bias_field_branch_selection_tracks_native_publisher_artifacts_before_publication --lib

      - name: Run eigen artifact and Kittel residual evidence contracts
        run: cargo test -p fullmag-runner eigen::artifacts::tests --lib

      - name: Run tracking confidence and branch writer contracts
        run: |
          cargo test -p fullmag-runner eigen::tracking::tests --lib --no-fail-fast
          cargo test -p fullmag-runner tracked_pair_overlap_is_published_as_confidence_in_json_and_csv --lib
          cargo test -p fullmag-runner tracking_only_mode_contributes_to_overlap_summary_without_public_mode_selection --lib

      - name: Run raw single-k checkpoint durability contracts
        run: cargo test -p fullmag-runner single_k_checkpoint --lib

      - name: Verify the persisted checkpoint with its Python inspector
        env:
          FULLMAG_CHECKPOINT_INSPECTOR_PYTHON: python3
        run: cargo test -p fullmag-runner checkpoint_inspector_accepts_actual_persisted_manifest --lib -- --ignored

      - name: Run eigen path terminal sample admission contracts
        run: |
          cargo test -p fullmag-runner noncompleted_single_k_status_preserves_raw_bytes_and_stops_admission --lib
          cargo test -p fullmag-runner completed_single_k_status_admits_and_publishes_every_path_sample --lib
          cargo test -p fullmag-runner interrupted_status_keeps_available_raw_diagnostics_with_or_without_checkpoint_root --lib
          cargo test -p fullmag-runner interrupted_checkpoint_write_failure_is_not_returned_as_cancelled --lib
          cargo test -p fullmag-runner fem::eigen_path::checkpoint_admission_tests::parallel_pool_bundle_ --lib
      - name: Run adaptive eigen process pool contracts
        run: |
          cargo test -p fullmag-runner k_process_pool --no-fail-fast
          cargo test -p fullmag-runner adaptive_resources --no-fail-fast

      - name: Run canonical IR, waveguide and typed V04 migration contracts
        run: cargo test -p fullmag-ir --no-fail-fast

      - name: Run eigen branch selector planning contracts
        run: |
          cargo test -p fullmag-plan fem_eigen_branch --lib
          cargo test -p fullmag-plan fem_eigen_raw_mode_indices_remain_valid_without_path_sampling --lib
          cargo test -p fullmag-plan eigen_output_validation_tests --lib
          cargo test -p fullmag-plan eigen_spectrum_quantity_validation_tests --lib

      - name: Run response sweep legacy Results catalog contracts
        run: cargo test -p fullmag-api response_magnetic_sweep_v1_endpoint_returns_artifact_json

      - name: Run Results artifact stage ownership contracts
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-api --bin fullmag-api result_catalog_uses_committed_eigen_owner_after_active_stage_advances
          cargo test -p fullmag-api --bin fullmag-api result_catalog_rejects_generation_run_and_stage_reference_mismatches
          cargo test -p fullmag-api --bin fullmag-api result_owner_uses_producer_only_for_exact_generation_members
          cargo test -p fullmag-api --bin fullmag-api result_owner_resolves_exact_file_and_safe_directory_references
          cargo test -p fullmag-api --bin fullmag-api result_owner_rejects_stage_reference_conflict_and_ambiguity

      - name: Run modal solver policy planning contracts
        run: |
          cargo test -p fullmag-plan fem_eigen_modal_solver_policy --lib
          cargo test -p fullmag-plan fem_eigen_floquet --lib
          cargo test -p fullmag-runner floquet_payload_tests --lib
          cargo test -p fullmag-runner terminal_action_after_completed_pool_does_not_interrupt_but_active_actions_do --lib
          cargo test -p fullmag-runner fem::eigen_progress::tests --lib
          cargo test -p fullmag-runner gamma_classification_tests --lib
          cargo test -p fullmag-runner eigen_diagnostics_reference_single_k_executor_publishes_without_native_provider --lib
          cargo test -p fullmag-runner relaxed_path_source_fixture_handoff_is_reused_for_each_nonzero_k_sample_without_per_sample_relaxation --lib
          cargo test -p fullmag-runner native_gpu_shared_domain_rejects_nonfinite_target_frequency --lib
          cargo test -p fullmag-plan fem_eigen_floquet_dynamic_demag_requires_explicit_airbox_cpu_path --lib
          cargo test -p fullmag-runner shared_domain_modal_scope_rejects_uncertified_local_tangent_terms --lib
          cargo test -p fullmag-runner material_identity_tests --lib
          cargo test -p fullmag-runner shared_domain_payload_omits_zero_anisotropy_after_certified_linearization --lib

      - name: Run scene periodic boundary intent contracts
        run: cargo test -p fullmag-authoring scene_pbc --lib

      - name: Run postprocessing settings preservation contracts
        run: cargo test -p fullmag-authoring postprocessing_settings_ --lib

      - name: Run scene PBC Rust-Python synchronization regression
        env:
          FULLMAG_REPO_ROOT: ${{ github.workspace }}
          RUST_MIN_STACK: 8388608
        run: cargo test -p fullmag-api --bin fullmag-api scene_pbc_overrides_roundtrip_via_python_helper

      - name: Run full field identity binary transport contracts
        run: |
          cargo test -p fullmag-api --bin fullmag-api field_vector_v5
          cargo test -p fullmag-api --bin fullmag-api analysis_field_vector_binary

      - name: Run frequency-domain artifact ownership contracts
        env:
          # Canonical scene ACK contracts traverse a full SceneDocument, as do
          # the other router contracts using this existing worker stack size.
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-api --bin fullmag-api field_sweep_items_keep_their_owner_identity_and_encode_resource_paths
          cargo test -p fullmag-api --bin fullmag-api spectrum_v3_items_project_durable_field_identity_without_mutating_payload
          cargo test -p fullmag-api --bin fullmag-api openapi_mode_field_availability_is_optional_boolean
          cargo test -p fullmag-api --bin fullmag-api openapi_field_sweep_schema_exposes_typed_dataset_and_sample_contract
          cargo test -p fullmag-api --bin fullmag-api quantities::tests
          cargo test -p fullmag-api --bin fullmag-api frequency_domain_
          cargo test -p fullmag-api --bin fullmag-api authoring_study_runtime_parallel_patch
          cargo test -p fullmag-api --bin fullmag-api authoring_transaction_ack_
          cargo test -p fullmag-api --bin fullmag-api modal_history_tests

      - name: Run application materialization and eigen selector contracts
        run: cargo test -p fullmag-application --no-fail-fast

      - name: Run native session writer lease contracts
        run: cargo test -p fullmag-session --lib writer --no-fail-fast

      - name: Run Docker accepted FEM GPU and host admission contracts
        run: |
          cargo test -p fullmag-api --bin fullmag-api accepted_fem_
          cargo test -p fullmag-api --bin fullmag-api-accepted-fem-preparer preparation_writer_retry_retries_typed_busy_but_not_other_errors
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker accepted_fem_
          cargo test -p fullmag-api --bin fullmag-api-accepted-fem-preparation-scheduler typed_writer_busy_retry_preserves_preparation_launch_identity
          cargo test -p fullmag-api --bin fullmag-api-accepted-fem-preparation-scheduler pre_admission_snapshot_deferral_classifies_only_typed_busy
          cargo test -p fullmag-api --bin fullmag-api common_host_launch_gate_
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker common_host_launch_gate_
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker::accepted_worker_claim_retry_tests::
          cargo test -p fullmag-api --bin fullmag-api-accepted-scheduler accepted_study_supervisor::tests::reaped_child_receipt_survives_unacknowledged_final_heartbeat -- --exact
          cargo test -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_supervisor::tests::host_bound_pre_spawn_retries_writer_busy_without_re_admission -- --exact
          cargo test -p fullmag-api --bin fullmag-api-accepted-scheduler scheduler_writer_busy_tests
          cargo test -p fullmag-runtime-control --lib worker_inbox::tests
          cargo test -p fullmag-api --bin fullmag-runtime-service orphan_teardown_
          cargo test -p fullmag-runtime-control --lib claim::host_binding_tests::fresh_v2_host_claim_receives_the_canonical_runtime_generation_binding -- --exact
          cargo test -p fullmag-runner --lib fem_gpu_execution_receipt_contract_tests
          cargo test -p fullmag-session --lib host_resource_ledger
          cargo test -p fullmag-runtime-control --lib compute_node_probe
          cargo test -p fullmag-runtime-control --lib nvml_gpu_partition
          cargo test -p fullmag-runtime-control --lib host_runtime

      - name: Run native worker orphan teardown contracts
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test -p fullmag-session --lib worker_orphan_teardown_success_releases_capacity_and_reconciles_unknown
          cargo test -p fullmag-session --lib worker_orphan_teardown_replays_exactly_and_rejects_changed_pins
          cargo test -p fullmag-session --lib worker_orphan_teardown_replays_after_partial_proof_and_lease_publication
          cargo test -p fullmag-session --lib worker_orphan_teardown_requires_inventory_quiescence
          cargo test -p fullmag-session --lib worker_orphan_teardown_rejects_durable_started_receipt
          cargo test -p fullmag-session --lib request_rejects_nil_uuid_and_unprefixed_store_identity

      - name: Run Rust quantity, API and CLI contracts
        env:
          # The router contract serializes a full SceneDocument; keep the
          # test worker stack large enough for its nested serde traversal.
          RUST_MIN_STACK: 8388608
        run: ./scripts/ci/run_frontend3d_required_gate.sh rust-quantity-api-cli-contracts

  bias-field-artifact-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'bias-field-artifacts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Install Python runtime dependencies
        run: python -m pip install -e packages/fullmag-py 'pytest>=9,<10' 'pyyaml>=6,<7'
      - name: Validate workflow scope and required-gate contracts
        run: python -B -m pytest -q scripts/test_frontend3d_required_checks.py scripts/test_bootstrap_workflow_contract.py
      - name: Run bias-field sample identity rejection contracts
        run: cargo test -p fullmag-runner native_field_sweep_identity_tests --lib

      - name: Run bias-field tracked mode publication contracts
        run: cargo test -p fullmag-runner bias_field_branch_selection_tracks_native_publisher_artifacts_before_publication --lib
      - name: Run eigen branch selector planning contracts
        run: |
          cargo test -p fullmag-plan fem_eigen_branch --lib
          cargo test -p fullmag-plan fem_eigen_raw_mode_indices_remain_valid_without_path_sampling --lib

  checkpoint-windows-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: checkpoint-windows

      - name: Verify the Windows checkpoint policy from its real writer
        run: cargo test -p fullmag-runner persists_platform_directory_sync_policy_from_real_checkpoint_writer --lib

      - name: Verify the Windows writer-to-inspector contract
        env:
          FULLMAG_CHECKPOINT_INSPECTOR_PYTHON: python
        run: cargo test -p fullmag-runner checkpoint_inspector_accepts_actual_persisted_manifest --lib -- --ignored

      - name: Verify source-adjacent FMS publication on Windows
        run: cargo test -p fullmag-api --bin fullmag-api session_output_target_tests --no-fail-fast

  generated-api-determinism:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.contract_scope != 'native-receipt' && inputs.contract_scope != 'positive-mass' && inputs.contract_scope != 'floquet-source-moments' && inputs.contract_scope != 'browser' && inputs.contract_scope != 'native-modal' && inputs.contract_scope != 'floquet-modal-slepc' && inputs.contract_scope != 'generic-modal-slepc' && inputs.contract_scope != 'floquet-count-slepc' && inputs.contract_scope != 'modal-phase-slepc' && inputs.contract_scope != 'retention' && inputs.contract_scope != 'rust' && inputs.contract_scope != 'bias-field-artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API determinism
        run: |
          node --test apps/control-room/scripts/normalize-openapi-build-identity.node-test.mjs
          ./scripts/ci/run_frontend3d_required_gate.sh generated-api-determinism

      - name: Preserve generated API contract for source review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-contract-${{ github.run_id }}
          path: |
            apps/control-room/src/kernel/api/generated/openapi-v2.json
            apps/control-room/src/kernel/api/generated/openapi-v2-types.ts
