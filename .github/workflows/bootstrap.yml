name: bootstrap

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run Rust contract tests
        run: cargo test -p fullmag-ir -p fullmag-plan -p fullmag-authoring

  api-hygiene-rg13:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Install ripgrep 13
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Assert Ubuntu ripgrep 13
        run: test "$(/usr/bin/rg --version | head -n 1)" = "ripgrep 13.0.0"

      - name: Run API hygiene with ripgrep 13
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          test "$("$node_bin" --version)" = "v24.18.0"
          PATH=/usr/bin:/bin "$node_bin" apps/control-room/scripts/check-api-hygiene.mjs

  control-room-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Resource-first migration gates
        run: ./scripts/ci-resource-first-gates.sh --strict

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check control-room architecture hygiene
        run: pnpm --dir apps/control-room check:architecture-hygiene

      - name: Check control-room API hygiene
        run: pnpm --dir apps/control-room check:api-hygiene

      - name: Check control-room idle performance
        run: pnpm --dir apps/control-room audit:idle-performance

      - name: Check control-room compute performance
        run: pnpm --dir apps/control-room audit:compute-performance

      - name: Benchmark control-room compute performance
        run: pnpm --dir apps/control-room bench:compute-performance

      - name: Typecheck control-room app
        run: pnpm --dir apps/control-room typecheck

      - name: Test control-room app
        run: pnpm --dir apps/control-room test

      - name: Install Chromium for viewport lifecycle audit
        run: pnpm --dir apps/control-room exec playwright install --with-deps chromium

      - name: Audit production viewport lifecycle and memory
        run: pnpm --dir apps/control-room audit:viewport-3d-memory-churn

      - name: Audit FEM topology WebGL position uploads
        run: pnpm --dir apps/control-room audit:viewport-3d-fem-topology-uploads

      - name: Verify viewport lifecycle audit negative controls
        run: |
          set -euo pipefail
          for control in \
            CONTROL_ROOM_AUDIT_INJECT_IDLE_LOOP \
            CONTROL_ROOM_AUDIT_INJECT_WORKER_LEAK \
            CONTROL_ROOM_AUDIT_INJECT_GPU_BUFFER_LEAK; do
            if env "$control=1" pnpm --dir apps/control-room audit:viewport-3d-memory-churn; then
              echo "Expected $control to fail the lifecycle audit."
              exit 1
            fi
          done

      - name: Upload viewport lifecycle audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-3d-browser-audit
          path: apps/control-room/.artifacts/viewport-3d-browser-audit
          if-no-files-found: warn

      - name: Build control-room app
        run: pnpm --dir apps/control-room build

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Gmsh system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Install Python package
        run: python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Run Python API tests
        run: python -m unittest discover -s packages/fullmag-py/tests -p 'test_api.py' -v

      - name: Run Python meshing tests
        run: python -m unittest discover -s packages/fullmag-py/tests -p 'test_meshing.py' -v

      - name: Repository consistency checks
        run: python scripts/check_repo_consistency.py
