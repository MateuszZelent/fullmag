  runner-retention-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'retention' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Use canonical temporary storage for retention fixtures
        shell: python
        run: |
          import os
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve() / "fullmag-retention-temp"
          scratch.mkdir(parents=True, exist_ok=True)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  environment.write(f"{name}={scratch}\n")
      - name: Run coordinator profile activation and client lifecycle regressions
        run: python -B scripts/test_local_runner_container_client.py -v
      - name: Run execution and runtime retention regressions
        run: python -B -m unittest discover -s scripts -p 'test_local_runner_retention*.py' -v
      - name: Setup Node for retention console contracts
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Build Runner Console packages before retention contracts
        run: node apps/runner-console/build.mjs
      - name: Run bounded retention console and packaged source contracts
        run: node apps/runner-console/test.mjs
      - name: Run retention HTTP routing and coordinator binding regressions
        run: |
          python -B -m unittest discover -s scripts/tests/local_runner -p test_container_api.py -v
          python -B -m unittest discover -s scripts/tests/local_runner -p test_container_main.py -v
      - name: Run archive receipt and verified runtime tombstone regressions
        if: ${{ !cancelled() }}
        run: python -B scripts/test_local_runner_archive_receipt.py -v
      - name: Run runtime package quarantine and restart regressions
        if: ${{ !cancelled() }}
        run: python -B scripts/test_local_runner_runtime_retention.py -v
      - name: Run runtime admission and reference snapshot guard regressions
        if: ${{ !cancelled() }}
        run: python -B scripts/test_local_runner_runtime_use.py -v
      - name: Run local runner runtime reference regressions
        run: python -B scripts/test_local_runner_runtime_references.py -v
      - name: Run source capsule owner binding and cleanup regressions
        run: python -B scripts/test_local_runner_source_compaction.py -v
      - name: Run source store publication and lock recovery regressions
        run: python -B scripts/test_local_runner_source_store.py -v
      - name: Run bounded Docker Engine protocol regressions
        run: python -B scripts/test_local_runner_unix_docker.py -v
      - name: Run managed-browser container mount attestation regressions
        run: python -B -m unittest discover -s scripts -p test_local_runner_managed_browser_guard.py
      - name: Run actual subprocess Docker log streaming regressions
        run: python -B scripts/test_local_runner_docker_logs.py -v

