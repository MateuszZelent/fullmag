{
  "name": "PR425 native RT0 affine/permutation/scale diagnostics; production DTQ remains FAIL",
  "on": {
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr425-native-rt0-invariants-${{ github.event.pull_request.number }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "native-rt0-invariants-only": {
      "name": "Three synthetic native RT0 invariants; production DTQ FAIL",
      "if": "${{ github.event.pull_request.number == 425 }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUNBUFFERED": "1",
        "NATIVE_SURFACE_EXPECTED_HEAD": "${{ github.event.pull_request.head.sha }}"
      },
      "steps": [
        {
          "name": "Checkout exact PR425 event head; no credentials",
          "id": "checkout",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha }}",
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Enforce reviewed private payload byte pins",
          "id": "pins",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json\nbase=Path('.github/antenna-retained-dtq/native-rt0-invariants')\nraw=(base/'payload-pins.json').read_bytes()\nassert hashlib.sha256(raw).hexdigest() == '4d23422f83e2ea66a0281591f3bf0b7280f33ca071dd1db61ef342a373ba369e'\nfor name,pin in json.loads(raw).items():\n    data=(base/name).read_bytes()\n    assert len(data)==pin['bytes'] and hashlib.sha256(data).hexdigest()==pin['sha256'],name\nprint('NATIVE_SURFACE_PAYLOAD_PINS_PASS')\nPY\n"
        },
        {
          "name": "Apply only pinned base delta, native GREEN and private test harness",
          "id": "materialize",
          "shell": "bash",
          "run": "mkdir -p native-rt0-invariants-evidence\npython3 -B .github/antenna-retained-dtq/native-rt0-invariants/materialize_ci.py > native-rt0-invariants-evidence/materialization.log 2>&1\n"
        },
        {
          "name": "Resolve existing CI storage profile",
          "id": "storage",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nimport json,os,subprocess,sys\nresult=subprocess.run([sys.executable,'-B','scripts/fullmag_storage.py','resolve','--profile','ci-rust-contracts','--create'],check=True,capture_output=True,text=True)\nlayout=json.loads(result.stdout)\nwith open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:\n    out.write('FULLMAG_PROJECT_STORAGE_ROOT='+layout['storage_root']+'\\n')\nPY\n"
        },
        {
          "name": "Install existing pinned just version",
          "id": "just",
          "uses": "extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3",
          "with": {
            "just-version": "1.51.0"
          }
        },
        {
          "name": "Existing OE-F1 container recipe; exactly three 6-source/1-target calls plus unchanged OE-T0",
          "id": "native",
          "shell": "bash",
          "run": "set -o pipefail\njust verify-fem-oersted-oef1-cpu-contract 2>&1 | python3 -u -c 'import sys; from pathlib import Path; out=Path(\"native-rt0-invariants-evidence/native.log\").open(\"wb\"); total=0\nfor data in iter(lambda:sys.stdin.buffer.read1(65536),b\"\"):\n total+=len(data)\n if total>16777216: raise SystemExit(\"NATIVE_LOG_LIMIT_EXCEEDED\")\n out.write(data);out.flush();sys.stdout.buffer.write(data);sys.stdout.buffer.flush()'\n"
        },
        {
          "name": "Independent stdlib Fraction readback of all three exact inputs, final H and nine precision reports",
          "id": "readback",
          "if": "${{ always() && steps.checkout.outcome == 'success' && steps.pins.outcome == 'success' }}",
          "shell": "bash",
          "run": "mkdir -p native-rt0-invariants-evidence\npython3 -B .github/antenna-retained-dtq/native-rt0-invariants/assess_ci.py > native-rt0-invariants-evidence/readback.log 2>&1\n",
          "env": {
            "NATIVE_OUTCOME": "${{ steps.native.outcome }}"
          }
        },
        {
          "name": "Always retain native status separately from production DTQ refusal",
          "if": "${{ always() }}",
          "shell": "bash",
          "env": {
            "CHECKOUT": "${{ steps.checkout.outcome }}",
            "PINS": "${{ steps.pins.outcome }}",
            "MATERIALIZE": "${{ steps.materialize.outcome }}",
            "JUST": "${{ steps.just.outcome }}",
            "NATIVE": "${{ steps.native.outcome }}",
            "READBACK": "${{ steps.readback.outcome }}"
          },
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport json,os\nout=Path('native-rt0-invariants-evidence');out.mkdir(exist_ok=True)\np=out/'native-result.json'\nresult=json.loads(p.read_text()) if p.exists() else {'status':'NOT RUN: prerequisite or process failure'}\nreport={'production_gate':'PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516','prior_production_run':43647488516,'qualification':'NOT VERIFIED','inspection_only':True,'error_certificate_available':False,'accepted_source_authentication':False,'steps':{k:os.environ.get(k) for k in ('CHECKOUT','PINS','MATERIALIZE','JUST','NATIVE','READBACK')},'native_status':result['status'],'github_sha':os.environ.get('GITHUB_SHA'),'event_head':os.environ.get('NATIVE_SURFACE_EXPECTED_HEAD')}\n(out/'terminal-state.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nPY\n"
        },
        {
          "name": "Retain bounded artifacts and make any truncation explicit",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport json\nsource=Path('native-rt0-invariants-evidence');out=Path('native-rt0-invariants-bounded-artifacts');out.mkdir(exist_ok=True)\nnames=['preregistered-inputs.json','reference-inputs.json','caller-bindings.json','payload-pins.json','source-pins.json','materialization.json','materialization.log','native.log','native-result.json','readback.log','terminal-state.json']\nreport={'files':[],'missing':[],'truncated':[],'maximum_total_bytes':33554432};remaining=33500000\nfor name in names:\n path=source/name\n if not path.is_file(): report['missing'].append(name);continue\n limit=min(16777216 if name=='native.log' else 1048576,remaining)\n with path.open('rb') as stream: data=stream.read(limit+1)\n truncated=len(data)>limit\n target=name+'.TRUNCATED' if truncated else name\n (out/target).write_bytes(data[:limit]);remaining-=min(len(data),limit)\n report['files'].append({'name':target,'bytes':min(len(data),limit)})\n if truncated: report['truncated'].append(name)\n(out/'artifact-bounds.json').write_text(json.dumps(report,indent=2)+'\\n')\nif report['missing'] or report['truncated']: raise SystemExit('FAIL: incomplete/bounded artifact evidence')\nPY\n"
        },
        {
          "name": "Always upload raw precision/work/phase/RSS and source pins",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "pr425-native-rt0-invariants-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "native-rt0-invariants-bounded-artifacts/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "PRODUCTION DTQ GATE REMAINS FAIL; native marker never promotes the full gate",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "printf '%s\\n' PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516\nexit 1\n"
        }
      ]
    }
  }
}
