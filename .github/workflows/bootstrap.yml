{
  "name": "PR425 existing native surface reference; production DTQ remains FAIL",
  "on": {
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr425-native-surface-${{ github.event.pull_request.number }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "native-surface-reference-only": {
      "name": "Four native toy-Tet controls; production DTQ FAIL",
      "if": "${{ github.event.pull_request.number == 425 }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUNBUFFERED": "1",
        "NATIVE_SURFACE_EXPECTED_HEAD": "${{ github.event.pull_request.head.sha }}"
      },
      "steps": [
        {
          "name": "Checkout exact PR425 event head; no credentials",
          "id": "checkout",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha }}",
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Enforce reviewed private payload byte pins",
          "id": "pins",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json\nbase=Path('.github/antenna-retained-dtq/native-surface-reference')\nraw=(base/'payload-pins.json').read_bytes()\nassert hashlib.sha256(raw).hexdigest() == 'cc437a28e3d6102641f37f55ddd42ccd5aedda33c2c637ec8e89a04ae8a034a9'\nfor name,pin in json.loads(raw).items():\n    data=(base/name).read_bytes()\n    assert len(data)==pin['bytes'] and hashlib.sha256(data).hexdigest()==pin['sha256'],name\nprint('NATIVE_SURFACE_PAYLOAD_PINS_PASS')\nPY\n"
        },
        {
          "name": "Apply only pinned base delta, native GREEN and private test harness",
          "id": "materialize",
          "shell": "bash",
          "run": "mkdir -p native-surface-reference-evidence\npython3 -B .github/antenna-retained-dtq/native-surface-reference/materialize_ci.py > native-surface-reference-evidence/materialization.log 2>&1\n"
        },
        {
          "name": "Resolve existing CI storage profile",
          "id": "storage",
          "shell": "bash",
          "run": "python3 -B - <<'PY'\nimport json,os,subprocess,sys\nresult=subprocess.run([sys.executable,'-B','scripts/fullmag_storage.py','resolve','--profile','ci-rust-contracts','--create'],check=True,capture_output=True,text=True)\nlayout=json.loads(result.stdout)\nwith open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:\n    out.write('FULLMAG_PROJECT_STORAGE_ROOT='+layout['storage_root']+'\\n')\nPY\n"
        },
        {
          "name": "Install existing pinned just version",
          "id": "just",
          "uses": "extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3",
          "with": {
            "just-version": "1.51.0"
          }
        },
        {
          "name": "Existing OE-F1 container recipe; four surface calls plus unchanged OE-T0",
          "id": "native",
          "shell": "bash",
          "run": "set -o pipefail\njust verify-fem-oersted-oef1-cpu-contract 2>&1 | tee native-surface-reference-evidence/native.log\n"
        },
        {
          "name": "Read exact native outputs and preregistered reference/bounds",
          "id": "readback",
          "if": "${{ always() && steps.checkout.outcome == 'success' && steps.pins.outcome == 'success' }}",
          "shell": "bash",
          "run": "mkdir -p native-surface-reference-evidence\npython3 -B .github/antenna-retained-dtq/native-surface-reference/assess_ci.py > native-surface-reference-evidence/readback.log 2>&1\n"
        },
        {
          "name": "Always retain native status separately from production DTQ refusal",
          "if": "${{ always() }}",
          "shell": "bash",
          "env": {
            "CHECKOUT": "${{ steps.checkout.outcome }}",
            "PINS": "${{ steps.pins.outcome }}",
            "MATERIALIZE": "${{ steps.materialize.outcome }}",
            "JUST": "${{ steps.just.outcome }}",
            "NATIVE": "${{ steps.native.outcome }}",
            "READBACK": "${{ steps.readback.outcome }}"
          },
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport json,os\nout=Path('native-surface-reference-evidence');out.mkdir(exist_ok=True)\np=out/'native-result.json'\nresult=json.loads(p.read_text()) if p.exists() else {'status':'NOT RUN: prerequisite or process failure'}\nreport={'production_gate':'PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516','prior_production_run':43647488516,'qualification':'NOT VERIFIED','steps':{k:os.environ.get(k) for k in ('CHECKOUT','PINS','MATERIALIZE','JUST','NATIVE','READBACK')},'native_status':result['status'],'github_sha':os.environ.get('GITHUB_SHA'),'event_head':os.environ.get('NATIVE_SURFACE_EXPECTED_HEAD')}\n(out/'terminal-state.json').write_text(json.dumps(report,indent=2)+'\\n')\nprint(json.dumps(report))\nPY\n"
        },
        {
          "name": "Always upload raw precision/work/phase/RSS and source pins",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "pr425-native-surface-reference-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "native-surface-reference-evidence/*.json\nnative-surface-reference-evidence/*.log",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "PRODUCTION DTQ GATE REMAINS FAIL; native marker never promotes the full gate",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "printf '%s\\n' PRODUCTION_DTQ_GATE_REMAINS_FAIL_FROM_RUN_43647488516\nexit 1\n"
        }
      ]
    }
  }
}
