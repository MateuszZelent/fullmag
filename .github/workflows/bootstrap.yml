name: bootstrap
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: antenna-retained-dtq-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-retained-dtq-contracts:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout exact CI snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.51.0'

      - name: Install Python runtime and mesh preparation dependencies
        id: install-python-runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Resolve storage for API artifact fixtures
        run: |
          python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
               "--profile", "ci-rust-contracts", "--create"],
              check=True, capture_output=True, text=True,
          )
          layout = json.loads(result.stdout)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(
                  f"FULLMAG_PROJECT_STORAGE_ROOT={layout['storage_root']}\n"
              )
          PY

      - name: Apply pinned worktree source delta
        run: |
          python -B - <<'PY'
          import gzip,hashlib,subprocess
          from pathlib import Path
          packed=Path('.github/antenna-completed-receipt/source.patch.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == 'cd81f2c884805ac0b10790c9af6d116155b5fbffa07f6471dd46a8ff66723032'
          patch=gzip.decompress(packed)
          assert len(patch) == 1509276
          assert hashlib.sha256(patch).hexdigest() == 'fcfdde4ac3dbb1061682e4bc838565b723457020e2380c3ef461005f9c9d99c7'
          subprocess.run(['git','apply','--check','--whitespace=nowarn','-'],input=patch,check=True)
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
          print('Verified exact Rust source delta: fcfdde4ac3dbb1061682e4bc838565b723457020e2380c3ef461005f9c9d99c7')
          PY

      - name: Apply exact artifact GREEN source snapshot
        run: |
          python -B - <<'PYCI'
          import gzip,hashlib,io,tarfile
          from pathlib import Path
          packed=Path('.github/antenna-retained-dtq/task-1-source.tar.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == '34aa5fbaf7a6617b65eedb221bdac40992cf9f606cb78cb6c6815a1f74c399ad'
          allowed=('crates/fullmag-antenna-artifacts/','crates/fullmag-ir/','crates/fullmag-quantities/')
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(packed)),mode='r:') as archive:
              members=archive.getmembers()
              assert len(members)==121
              for entry in members:
                  name=entry.name
                  assert entry.isfile() and not name.startswith('/') and '..' not in Path(name).parts
                  assert name in ('Cargo.toml','Cargo.lock') or name.startswith(allowed)
                  data=archive.extractfile(entry).read()
                  target=Path(name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('Exact Task 1 GREEN source overlay: 34aa5fbaf7a6617b65eedb221bdac40992cf9f606cb78cb6c6815a1f74c399ad')
          PYCI
      - name: Apply reviewed literal historical v1 hash assertion
        run: |
          python -B - <<'PYCI'
          import hashlib
          from pathlib import Path
          data=Path('.github/antenna-retained-dtq/task-1-fix1-tests.rs').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='3b89b8424b5eeb86e885bc5101716c7b13be4247b2140bd73d81e30d403712ea'
          Path('crates/fullmag-antenna-artifacts/src/retained_current/tests_v2.rs').write_bytes(data)
          PYCI
      - name: Apply exact Task 2 Rust adapter snapshot
        run: python -B .github/antenna-retained-dtq/apply-task2-source.py task-2-rust-green
      - name: Apply preserved pre-ABI RED snapshot
        run: python -B .github/antenna-retained-dtq/apply-task2-source.py task-2-native-red
      - name: Apply pinned minimal Task 2 recipe insertion
        run: |
          python -B - <<'PYCI'
          import hashlib
          from pathlib import Path
          data = Path('.github/antenna-retained-dtq')
          expected = {'apply-justfile-insertions.py': {'bytes': 1957, 'sha256': '3a9da2aa9db80d86767319d6811f8d26192ee41772f446d2b679afe52bf41bfa'}, 'task-2-justfile-insertions.json': {'bytes': 559, 'sha256': 'd2045b46ea17a0b1510a72220f293d489f261d462cfa2ef318dbdd43c568a24f'}}
          checked = {}
          for name, pin in expected.items():
              raw = (data / name).read_bytes()
              if len(raw) != pin['bytes'] or hashlib.sha256(raw).hexdigest() != pin['sha256']:
                  raise ValueError('Recipe transport pin mismatch: ' + name)
              checked[name] = raw
          namespace = {'__name__': 'ci_recipe_insertions'}
          exec(compile(checked['apply-justfile-insertions.py'], 'apply-justfile-insertions.py', 'exec'), namespace)
          namespace['apply_insertions'](Path('justfile'), checked['task-2-justfile-insertions.json'])
          PYCI
      - name: Prove RED from missing numeric C ABI through container-backed just
        shell: bash
        run: |
          set +e
          just verify-fem-oersted-oef1-cpu-contract > antenna-retained-dtq-red.log 2>&1
          result=$?
          set -e
          cat antenna-retained-dtq-red.log
          test "$result" -ne 0
          grep -E 'error:.*(fullmag_fem_frozen_rt0_direct_(request|result)_v1|fullmag_fem_evaluate_frozen_rt0_direct_observed_v1)' antenna-retained-dtq-red.log
          printf 'Task 2 RED: missing new ABI confirmed; exit=%s\n' "$result"
      - name: Apply exact reviewed GREEN native snapshot
        run: |
          python -B .github/antenna-retained-dtq/apply-task2-source.py task-2-native-green
          python -B .github/antenna-retained-dtq/apply-task2-source.py --verify
      - name: Apply exact test-only singular-target diagnostics
        run: |
          python -B - <<'PYCI'
          import hashlib
          from pathlib import Path
          data = Path('.github/antenna-retained-dtq')
          expected = {
              'apply-justfile-insertions.py': (1957, '3a9da2aa9db80d86767319d6811f8d26192ee41772f446d2b679afe52bf41bfa'),
              'task-2-singular-diagnostic-insertions.json': (10251, '22a3b4d561ed80f379371638fd86288461e0b96d4b502ef581e2eaf126538b01'),
          }
          checked = {}
          for name, (size, digest) in expected.items():
              raw = (data / name).read_bytes()
              if len(raw) != size or hashlib.sha256(raw).hexdigest() != digest:
                  raise ValueError('Diagnostic transport pin mismatch: ' + name)
              checked[name] = raw
          namespace = {'__name__': 'ci_test_insertions'}
          exec(compile(checked['apply-justfile-insertions.py'], 'apply-justfile-insertions.py', 'exec'), namespace)
          namespace['apply_insertions'](
              Path('backends/fem/tests/oersted_direct_tetra_contract.cpp'),
              checked['task-2-singular-diagnostic-insertions.json'],
          )
          PYCI
      - name: Apply bounded CI-only leaf replay diagnostics
        run: |
          python -B - <<'PYCI'
          import hashlib
          from pathlib import Path
          data = Path('.github/antenna-retained-dtq')
          expected = {'apply-justfile-insertions.py': (1957, '3a9da2aa9db80d86767319d6811f8d26192ee41772f446d2b679afe52bf41bfa'), 'task-2-leaf-dtq-insertions.json': (15612, '7291b040b9ec33c3bab60dc43a474790053b2a89b151fb94258ee751f717ef3a'), 'task-2-leaf-test-insertions.json': (1206, '1799b145b692b96830fda0db3c29a9a300d8954fb5bb7f46b6bb483f0c4cf2eb')}
          checked = {}
          for name, (size, digest) in expected.items():
              raw = (data / name).read_bytes()
              if len(raw) != size or hashlib.sha256(raw).hexdigest() != digest:
                  raise ValueError('Bounded leaf diagnostic pin mismatch: ' + name)
              checked[name] = raw
          namespace = {'__name__': 'ci_leaf_insertions'}
          exec(compile(checked['apply-justfile-insertions.py'], 'apply-justfile-insertions.py', 'exec'), namespace)
          namespace['apply_insertions'](Path('backends/fem/cpu/mfem/interactions/oersted/direct_tetra_quadrature.cpp'), checked['task-2-leaf-dtq-insertions.json'])
          namespace['apply_insertions'](Path('backends/fem/tests/oersted_direct_tetra_contract.cpp'), checked['task-2-leaf-test-insertions.json'])
          PYCI
      - name: Verify GREEN C++ numerical and ABI contracts
        id: native-green
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-oersted-oef1-cpu-contract 2>&1 | tee antenna-retained-dtq-green-native.log
      - name: Preserve early native leaf diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antenna-retained-dtq-native-leaf-diagnostic
          include-hidden-files: true
          path: |
            antenna-retained-dtq-green-native.log
            .github/antenna-retained-dtq/task-2-ci-source-pins.json
            .github/antenna-retained-dtq/task-2-singular-diagnostic-insertions.json
            .github/antenna-retained-dtq/task-2-leaf-dtq-insertions.json
            .github/antenna-retained-dtq/task-2-leaf-test-insertions.json
      - name: Verify Rust adapter against the same CPU shared library in container
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-rust-cpu-contract 2>&1 | tee antenna-retained-dtq-green-rust.log
      - name: Install pinned Task 3 CI contracts
        run: python -B .github/antenna-retained-dtq/apply-task3-source.py install-contract-tests
      - name: Independently verify historical v7 serializer bytes
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-public-contract baseline-v7 2>&1 | tee antenna-retained-dtq-task3-v7-baseline.log
      - name: Apply preserved corrected RED tests against old producer
        run: python -B .github/antenna-retained-dtq/apply-task3-source.py task-3-red-corrected.tar.gz
      - name: Prove missing typed producer in the historical source
        shell: bash
        run: |
          set +e
          just verify-fem-retained-dtq-public-contract red > antenna-retained-dtq-task3-red.log 2>&1
          result=$?
          set -e
          cat antenna-retained-dtq-task3-red.log
          test "$result" -ne 0
          grep -E 'error\[E(0425|0433|0599)\]' antenna-retained-dtq-task3-red.log
          grep -E '(AntennaRetainedDirectFieldInspection|validate_retained_direct_field_operation)' antenna-retained-dtq-task3-red.log
          printf 'Task 3 reconstructed RED: old producer rejects new test; exit=%s\n' "$result"
      - name: Apply exact reviewed Task 3 GREEN source and fixture emitter
        run: |
          python -B .github/antenna-retained-dtq/apply-task3-source.py task-3-green.tar.gz
          python -B .github/antenna-retained-dtq/apply-task3-source.py append-real-backend-fixture
      - name: Verify public producer, typed v7 output and exhaustive consumers
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-public-contract green 2>&1 | tee antenna-retained-dtq-task3-green.log
      - name: Restore exact historical IR parser
        run: python -B .github/antenna-retained-dtq/apply-task3-source.py task-3-historical-ir.tar.gz
      - name: Verify historical real parser rejects the generated new backend plan
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-public-contract historical-parser 2>&1 | tee antenna-retained-dtq-task3-historical-parser.log
          emitted="$(sed -n 's/^DTQ_REAL_BACKEND_FIXTURE_SHA256=//p' antenna-retained-dtq-task3-green.log)"
          rejected="$(sed -n 's/^DTQ_OLD_REAL_PARSER_REJECTED_SHA256=//p' antenna-retained-dtq-task3-historical-parser.log)"
          test -n "$emitted"
          test "$emitted" = "$rejected"
      - name: Restore reviewed Task 3 sources after the historical parser gate
        run: python -B .github/antenna-retained-dtq/apply-task3-source.py task-3-green.tar.gz
      - name: Apply reviewed publication sources and compile-contract module
        run: |
          python -B .github/antenna-retained-dtq/apply-task4-source.py task-4-green
          python -B .github/antenna-retained-dtq/apply-task4-source.py install-compile-contract-module
      - name: Verify portable publication contracts and compile authenticated harness without executing it
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-publication-contract 2>&1 | tee antenna-retained-dtq-task4-source-contracts.log
      - name: Recheck numerical Rust adapter after the portable binder move
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-rust-cpu-contract 2>&1 | tee antenna-retained-dtq-task4-native-binder-integration.log
      - name: Install exact existing frontend dependency baseline and reviewed Task 5 changes
        run: |
          python -B .github/antenna-retained-dtq/apply-task5-source.py ui-baseline
          python -B .github/antenna-retained-dtq/apply-task5-source.py task-5-green
          python -B .github/antenna-retained-dtq/apply-task5-source.py install-wiring
      - name: Verify canonical quantities and raw-field UI contracts in the existing CPU container
        shell: bash
        run: |
          set -o pipefail
          just verify-fem-retained-dtq-quantity-contract 2>&1 | tee antenna-retained-dtq-task5-quantity-ui-contracts.log
      - name: Require the full native quadrature contract
        if: always()
        env:
          NATIVE_GREEN_OUTCOME: ${{ steps.native-green.outcome }}
        run: test "$NATIVE_GREEN_OUTCOME" = success
      - name: Preserve exact source pins and RED/GREEN logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antenna-retained-dtq-plan-source-contracts
          path: |
            antenna-retained-dtq-*.log
            .github/antenna-retained-dtq/task-2-ci-source-pins.json
            .github/antenna-retained-dtq/task-2-singular-diagnostic-insertions.json
            .github/antenna-retained-dtq/task-2-leaf-dtq-insertions.json
            .github/antenna-retained-dtq/task-2-leaf-test-insertions.json
            .github/antenna-retained-dtq/task-3-source-pins.json
            .github/antenna-retained-dtq/task-3-wiring-pins.json
            .github/antenna-retained-dtq/task-4-source-pins.json
            .github/antenna-retained-dtq/task-4-wiring-pins.json
            .github/antenna-retained-dtq/task-5-source-pins.json
            .github/antenna-retained-dtq/task-5-ui-baseline-pins.json
            .github/antenna-retained-dtq/task-5-wiring-pins.json
          if-no-files-found: error
          include-hidden-files: true
