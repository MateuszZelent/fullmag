name: bootstrap

on:
  workflow_call:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      contract_scope:
        description: Select bootstrap, browser, Rust, bias-field artifacts, retention, or native modal contracts.
        type: choice
        required: true
        default: bootstrap
        options:
          - bootstrap
          - rust
          - bias-field-artifacts
          - browser
          - positive-mass
          - floquet-source-moments
          - native-modal
          - native-receipt
          - floquet-modal-slepc
          - generic-modal-slepc
          - floquet-count-slepc
          - modal-phase-slepc
          - retention

concurrency:
  group: bootstrap-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.contract_scope || 'default' }}
  cancel-in-progress: true

jobs:
  native-modal-cabi-contract:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' || inputs.contract_scope == 'native-modal' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check FEM CUDA driver library selection
        run: python -B scripts/ci/test_fem_cuda_driver_selection.py

      - name: Compile and run strict modal mass deduplication contract
        run: |
          g++ -std=c++17 -UNDEBUG -Ibackends/fem -Ibackends/fem/include -Inative/include backends/fem/tests/frequency_domain/mode_deduplication_test.cpp backends/fem/cpu/frequency_domain/mode_deduplication.cpp backends/fem/cpu/frequency_domain/mode_filter.cpp backends/fem/cpu/frequency_domain/slepc_modal_eigen.cpp -o "$RUNNER_TEMP/fullmag-modal-mass-dedup-test"
          "$RUNNER_TEMP/fullmag-modal-mass-dedup-test"

      - name: Compile and run dependency-free native modal ABI contract
        run: python -B scripts/ci/run_modal_cabi_contract.py

      - name: Preserve native contract receipt and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-modal-cabi-contract
          path: |
            ${{ runner.temp }}/fullmag-modal-cabi/receipt.json
            ${{ runner.temp }}/fullmag-modal-cabi/step-*.log
          if-no-files-found: error

  rust-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' || inputs.contract_scope == 'rust' }}
    uses: ./.github/workflows/bootstrap-rust.yml

  bias-field-artifact-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'bias-field-artifacts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Install Python runtime dependencies
        run: python -m pip install -e packages/fullmag-py 'pytest>=9,<10' 'pyyaml>=6,<7'
      - name: Validate workflow scope and required-gate contracts
        run: python -B -m pytest -q scripts/test_frontend3d_required_checks.py scripts/test_bootstrap_workflow_contract.py
      - name: Run bias-field sample identity rejection contracts
        run: cargo test -p fullmag-runner native_field_sweep_identity_tests --lib

      - name: Run bias-field tracked mode publication contracts
        run: cargo test -p fullmag-runner bias_field_branch_selection_tracks_native_publisher_artifacts_before_publication --lib
      - name: Run eigen branch selector planning contracts
        run: |
          cargo test -p fullmag-plan fem_eigen_branch --lib
          cargo test -p fullmag-plan fem_eigen_raw_mode_indices_remain_valid_without_path_sampling --lib

  checkpoint-windows-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: checkpoint-windows

      - name: Verify the Windows checkpoint policy from its real writer
        run: cargo test -p fullmag-runner persists_platform_directory_sync_policy_from_real_checkpoint_writer --lib

      - name: Verify atomic Zarr metadata replacement on Windows
        run: cargo test --locked -p fullmag-runner --lib autosave_zarr::tests::metadata_atomic_replace_preserves_exact_bytes -- --exact

      - name: Verify the Windows writer-to-inspector contract
        env:
          FULLMAG_CHECKPOINT_INSPECTOR_PYTHON: python
        run: cargo test -p fullmag-runner checkpoint_inspector_accepts_actual_persisted_manifest --lib -- --ignored

      - name: Verify source-adjacent FMS publication on Windows
        run: cargo test -p fullmag-api --bin fullmag-api session_output_target_tests --no-fail-fast

  generated-api-determinism:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API determinism
        run: |
          node --test apps/control-room/scripts/normalize-openapi-build-identity.node-test.mjs
          ./scripts/ci/run_frontend3d_required_gate.sh generated-api-determinism

      - name: Preserve generated API contract for source review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-contract-${{ github.run_id }}
          path: |
            apps/control-room/src/kernel/api/generated/openapi-v2.json
            apps/control-room/src/kernel/api/generated/openapi-v2-types.ts
            apps/control-room/src/kernel/api/generated/openapi-v2-client.ts
            apps/control-room/src/kernel/api/generated/openapi-v2-paths.ts
            packages/fullmag-py/src/fullmag/client/_generated/*.py
          if-no-files-found: error

  api-hygiene-rg13:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Install ripgrep 13
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Assert Ubuntu ripgrep 13
        run: test "$(/usr/bin/rg --version | head -n 1)" = "ripgrep 13.0.0"

      - name: Run API hygiene with ripgrep 13
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          test "$("$node_bin" --version)" = "v24.18.0"
          PATH=/usr/bin:/bin "$node_bin" --test apps/control-room/scripts/check-api-hygiene.node-test.mjs
          PATH=/usr/bin:/bin "$node_bin" apps/control-room/scripts/check-api-hygiene.mjs

  control-room-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' || inputs.contract_scope == 'browser' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tailwind source boundaries and incremental class discovery
        env:
          FULLMAG_TEST_NODE_MODULES_ROOT: ${{ github.workspace }}/apps/control-room/node_modules
        run: node --test apps/control-room/scripts/tailwind-source-boundary.node-test.mjs

      - name: Verify pinned Next development route discovery
        run: python3 -B scripts/test_next_route_patch.py -v

      - name: Install architecture gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Resource-first migration gates
        run: ./scripts/ci-resource-first-gates.sh --strict

      - name: Check control-room architecture hygiene
        run: pnpm --dir apps/control-room check:architecture-hygiene

      - name: Check control-room idle performance
        run: pnpm --dir apps/control-room audit:idle-performance

      - name: Verify scoped Study texture browser contracts
        run: node --test apps/control-room/scripts/lib/study-texture-browser-qa.node-test.mjs

      - name: Typecheck, lint and test Control Room
        run: ./scripts/ci/run_frontend3d_required_gate.sh control-room-typecheck-lint-test

      - name: Check control-room compute performance
        run: pnpm --dir apps/control-room audit:compute-performance

      - name: Benchmark control-room compute performance
        run: pnpm --dir apps/control-room bench:compute-performance

      - name: Build control-room app
        run: pnpm --dir apps/control-room build

  browser-fixture-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' || inputs.contract_scope == 'browser' }}
    # Keep Chromium dependencies on Ubuntu 24.04 across runner image migrations.
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify absorbing boundary inspector editing
        run: >-
          pnpm --dir apps/control-room exec vitest run
          src/modules/viewport-3d/model/viewport3DTargetFieldBuffer.test.ts
          src/modules/inspector/panels/ObjectAbsorbingBoundaryPanelModel.test.ts
          src/modules/inspector/panels/ObjectAbsorbingBoundaryPanel.dom.test.tsx

      - name: Install Chromium for browser fixture smoke
        run: pnpm --dir apps/control-room exec playwright install --with-deps chromium

      - name: Setup Python for browser proof contract regressions
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install browser proof regression dependencies
        run: python -m pip install 'pytest>=9,<10' PyYAML==6.0.3

      - name: Verify browser proof gate and report binding contracts
        run: python -m pytest -q scripts/test_frontend3d_required_checks.py

      - name: Build Runner Console packages before parity and browser checks
        run: node apps/runner-console/build.mjs

      - name: Run packaged Runner Console queue contracts
        env:
          FULLMAG_RUNNER_UI_ROOT: ${{ github.workspace }}
          FULLMAG_RUNNER_CONSOLE_ASSETS: ${{ github.workspace }}/scripts/local_runner/ui_dist
          FULLMAG_RUNNER_PLAYWRIGHT: ${{ github.workspace }}/apps/control-room/node_modules/playwright
          FULLMAG_RUNNER_SMOKE_SCREENSHOT: ${{ runner.temp }}/viewport-3d-browser-audit/runner-console.png
        run: |
          node apps/runner-console/test.mjs
          export FULLMAG_RUNNER_CHROMIUM="$(node -p "require('./apps/control-room/node_modules/playwright').chromium.executablePath()")"
          node apps/runner-console/browser-smoke.cjs

      - name: Verify FEM position upload attribution contracts
        run: node --test apps/control-room/scripts/audit-viewport-3d-fem-topology-uploads-probe.node-test.mjs

      - name: Run browser fixture pre-proof gate
        env:
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
        run: ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-pre-proof

      - name: Verify browser fixture smoke negative control
        env:
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
        run: |
          if FULLMAG_CI_INJECT_FAILURE=browser-fixture-proof-identity \
            ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-smoke; then
            echo "Expected intentional browser proof identity failure." >&2
            exit 1
          fi

      - name: Run Inspector mutation and DMI authoring browser regressions
        env:
          NEXT_PUBLIC_AUDIT_BUILD: "1"
          CONTROL_ROOM_URL: http://127.0.0.1:3100/workspace
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
          CONTROL_ROOM_INSPECTOR_REPORT_DIR: ${{ runner.temp }}/viewport-3d-browser-audit/inspector
        run: |
          mkdir -p "$CONTROL_ROOM_INSPECTOR_REPORT_DIR"
          # Reuse the audit build from this exact CI source snapshot. Start
          # Node directly so the cleanup trap owns the actual server process.
          (
            cd apps/control-room
            exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100
          ) > "$CONTROL_ROOM_INSPECTOR_REPORT_DIR/server.log" 2>&1 &
          inspector_server_pid=$!
          trap 'kill "$inspector_server_pid" 2>/dev/null || true; wait "$inspector_server_pid" 2>/dev/null || true' EXIT
          inspector_ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$inspector_server_pid" 2>/dev/null; then
              cat "$CONTROL_ROOM_INSPECTOR_REPORT_DIR/server.log"
              exit 1
            fi
            if curl --fail --silent --max-time 3 --output /dev/null "$CONTROL_ROOM_URL"; then
              inspector_ready=1
              break
            fi
            sleep 1
          done
          test "$inspector_ready" = 1
          pnpm --dir apps/control-room run smoke:inspector
          CONTROL_ROOM_INSPECTOR_MATERIAL_AUDIT=1 \
            CONTROL_ROOM_INSPECTOR_REPORT_DIR="$CONTROL_ROOM_INSPECTOR_REPORT_DIR/material-regions" \
            pnpm --dir apps/control-room run smoke:inspector
          node apps/control-room/scripts/smoke-adaptive-study-authoring.mjs
          CONTROL_ROOM_ANALYSIS_PLOTS_FIXTURE=1 \
            CONTROL_ROOM_ACCEPTANCE_DIR="$CONTROL_ROOM_AUDIT_ARTIFACTS_DIR/analysis-plots" \
            pnpm --dir apps/control-room run smoke:analysis-plots
          CONTROL_ROOM_TARGET_SMOKE_PHASE=airbox-independent-visualization \
            CONTROL_ROOM_TARGET_SMOKE_REUSE_FRONTEND_ONLY=1 \
            CONTROL_ROOM_TARGET_SMOKE_SWIFTSHADER=1 \
            CONTROL_ROOM_TARGET_SMOKE_TIMEOUT_MS=90000 \
            CONTROL_ROOM_API_BASE_URL=http://fullmag-target-smoke.fixture.invalid \
            CONTROL_ROOM_AUDIT_ARTIFACTS_DIR="$CONTROL_ROOM_AUDIT_ARTIFACTS_DIR/airbox" \
            pnpm --dir apps/control-room run smoke:viewport-3d-explorer-inspector-targets

      - name: Run start screen stylesheet browser check
        # Static CSS plus inline markup: no server and no audit build are needed.
        env:
          CONTROL_ROOM_BROWSER_CHANNEL: chromium
        run: pnpm --dir apps/control-room run check:start-screen-browser

      - name: Publish canonical browser proof and verify final source
        env:
          CONTROL_ROOM_AUDIT_ARTIFACTS_DIR: ${{ runner.temp }}/viewport-3d-browser-audit
        run: |
          ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-proof-manifest
          ./scripts/ci/run_frontend3d_required_gate.sh browser-fixture-source-verify-post-write

      - name: Upload browser fixture smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-3d-browser-audit
          path: ${{ runner.temp }}/viewport-3d-browser-audit
          if-no-files-found: error

  inspector-actions-browser-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' || inputs.contract_scope == 'browser' }}
    # Keep Chromium dependencies on Ubuntu 24.04 across runner image migrations.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Inspector fixture storage paths
        id: inspector-storage
        shell: bash
        run: |
          resolved_layout="$(python3 scripts/fullmag_storage.py resolve --repo-root "$GITHUB_WORKSPACE" --profile windows-control-room-browser-fixture)"
          artifact_root="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(sys.stdin)["build_storage_root"]) / "builds")' <<< "$resolved_layout")"
          browser_root="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["env"]["PLAYWRIGHT_BROWSERS_PATH"])' <<< "$resolved_layout")"
          for path in "$artifact_root" "$browser_root"; do
            if [[ "$path" != /* || "$path" == *"/../"* || "$path" == */.. ]]; then
              echo "Resolved Inspector storage path is not absolute and normalized: $path" >&2
              exit 1
            fi
          done
          echo "build_root=$artifact_root" >> "$GITHUB_OUTPUT"
          echo "playwright_browsers_path=$browser_root" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for Inspector browser fixture
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ steps.inspector-storage.outputs.playwright_browsers_path }}
        run: pnpm --dir apps/control-room exec playwright install --with-deps chromium

      - name: Run production Inspector actions browser fixture
        run: python3 scripts/verify_pinned_dataset_browser.py --repo-root "$GITHUB_WORKSPACE" --port 3257 --scenario inspector-actions

      - name: Upload Inspector browser receipt and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspector-actions-browser-fixture
          path: |
            ${{ steps.inspector-storage.outputs.build_root }}/**/inspector-actions-browser/*/receipt.json
            ${{ steps.inspector-storage.outputs.build_root }}/**/inspector-actions-browser/*/next.log
            ${{ steps.inspector-storage.outputs.build_root }}/**/inspector-actions-browser/*/browser.log
            ${{ steps.inspector-storage.outputs.build_root }}/**/inspector-actions-browser/*/browser/**
          if-no-files-found: error

  fdm-relaxation-qualification:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python test runner
        run: python3 -m pip install --user 'pytest>=9,<10'

      - name: Validate FDM qualification receipt contract
        run: python3 -m pytest -q scripts/test_validate_fdm_relaxation_qualification.py

      - name: Run bounded CPU FP64 physics smoke
        run: timeout --foreground 180s cargo test -p fullmag-runner --test physics_validation fdm_relaxation::uniform_field_alignment -- --ignored --nocapture

  python-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    uses: ./.github/workflows/bootstrap-python.yml

  python-live-client-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Python package
        run: |
          python -m pip install 'pytest>=9,<10'
          python -m pip install -e packages/fullmag-py

      - name: Run live client and live DSL contracts (ADR 0068)
        run: >-
          python -m pytest -q
          packages/fullmag-py/tests/test_live_client_core.py
          packages/fullmag-py/tests/test_live_client_data.py
          packages/fullmag-py/tests/test_live_dsl_mode.py
          packages/fullmag-py/tests/test_live_events.py
          packages/fullmag-py/tests/test_live_sweep.py


  windows-volatile-storage-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.contract_scope == 'bootstrap' }}
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Windows Docker attestation publication barriers
        run: python -B scripts/test_windows_folder_evidence.py -v

      - name: Verify disposable compiler storage and environment restoration
        run: python scripts/test_windows_volatile_build_storage.py -v

  fem-positive-mass-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'positive-mass' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml

  fem-floquet-source-moments-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'floquet-source-moments' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: floquet-source-moments

  fem-floquet-modal-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'floquet-modal-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: floquet-modal-slepc
  fem-generic-modal-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'generic-modal-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: generic-modal-slepc

  fem-modal-phase-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'modal-phase-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: modal-phase-slepc

  fem-floquet-count-slepc-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'floquet-count-slepc' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fem-positive-mass-contract.yml
    with:
      contract_profile: floquet-count-slepc

  runner-retention-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'retention' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Use canonical temporary storage for retention fixtures
        shell: python
        run: |
          import os
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve() / "fullmag-retention-temp"
          scratch.mkdir(parents=True, exist_ok=True)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  environment.write(f"{name}={scratch}\n")
      - name: Run coordinator profile activation and client lifecycle regressions
        run: python -B scripts/test_local_runner_container_client.py -v
      - name: Run execution and runtime retention regressions
        run: python -B -m unittest discover -s scripts -p 'test_local_runner_retention*.py' -v
      - name: Setup Node for retention console contracts
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Build Runner Console packages before retention contracts
        run: node apps/runner-console/build.mjs
      - name: Run bounded retention console and packaged source contracts
        run: node apps/runner-console/test.mjs
      - name: Run retention HTTP routing and coordinator binding regressions
        run: |
          python -B -m unittest discover -s scripts/tests/local_runner -p test_container_api.py -v
          python -B -m unittest discover -s scripts/tests/local_runner -p test_container_main.py -v
      - name: Run archive receipt and verified runtime tombstone regressions
        if: ${{ !cancelled() }}
        run: python -B scripts/test_local_runner_archive_receipt.py -v
      - name: Run runtime package quarantine and restart regressions
        if: ${{ !cancelled() }}
        run: python -B scripts/test_local_runner_runtime_retention.py -v
      - name: Run runtime admission and reference snapshot guard regressions
        if: ${{ !cancelled() }}
        run: python -B scripts/test_local_runner_runtime_use.py -v
      - name: Run local runner runtime reference regressions
        run: python -B scripts/test_local_runner_runtime_references.py -v
      - name: Run source capsule owner binding and cleanup regressions
        run: python -B scripts/test_local_runner_source_compaction.py -v
      - name: Run source store publication and lock recovery regressions
        run: python -B scripts/test_local_runner_source_store.py -v
      - name: Run bounded Docker Engine protocol regressions
        run: python -B scripts/test_local_runner_unix_docker.py -v
      - name: Run managed-browser container mount attestation regressions
        run: python -B -m unittest discover -s scripts -p test_local_runner_managed_browser_guard.py
      - name: Run actual subprocess Docker log streaming regressions
        run: python -B scripts/test_local_runner_docker_logs.py -v

  native-receipt-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_scope == 'native-receipt' }}
    uses: ./.github/workflows/eigensolve-native-receipt-contracts.yml

  automatic-results:
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - rust-contracts
      - checkpoint-windows-contracts
      - generated-api-determinism
      - control-room-contracts
      - browser-fixture-smoke
      - python-contracts
      - fdm-relaxation-qualification
      - native-modal-cabi-contract
      - api-hygiene-rg13
      - inspector-actions-browser-smoke
      - python-live-client-contracts
      - windows-volatile-storage-contracts
    steps:
      - name: Require successful execution of every automatic bootstrap job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
