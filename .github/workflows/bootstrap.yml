name: bootstrap
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: antenna-completed-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 8388608
    steps:
      - name: Checkout exact CI snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/fullmag-py/pyproject.toml

      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python runtime and mesh preparation dependencies
        id: install-python-runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa
          python -m pip install -e 'packages/fullmag-py[meshing]'

      - name: Resolve storage for API artifact fixtures
        run: |
          python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
               "--profile", "ci-rust-contracts", "--create"],
              check=True, capture_output=True, text=True,
          )
          layout = json.loads(result.stdout)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(
                  f"FULLMAG_PROJECT_STORAGE_ROOT={layout['storage_root']}\n"
              )
          PY

      - name: Apply pinned worktree source delta
        run: |
          python -B - <<'PY'
          import gzip,hashlib,subprocess
          from pathlib import Path
          packed=Path('.github/antenna-completed-receipt/source.patch.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == '78151f285de239990665046f64683f33a04dd88f14a971cbe21450c984586513'
          patch=gzip.decompress(packed)
          assert len(patch) == 1503514
          assert hashlib.sha256(patch).hexdigest() == '556aeb340c1b0e955ce0d5404fd4f5ea7a6b059cfe1e98c22a26ef669cb367f8'
          subprocess.run(['git','apply','--check','--whitespace=nowarn','-'],input=patch,check=True)
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
          print('Verified exact Rust source delta: 556aeb340c1b0e955ce0d5404fd4f5ea7a6b059cfe1e98c22a26ef669cb367f8')
          PY

      - name: Run actual completed receipt and existing worker regressions
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-api --bin fullmag-api-accepted-worker accepted_study_worker:: -- --nocapture 2>&1 | tee antenna-worker-contracts.log

      - name: Preserve contract log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antenna-completed-receipt-contracts
          path: antenna-worker-contracts.log
          if-no-files-found: warn
