name: eigensolve-api-source-contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-field-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preserve exact source identity
        run: git rev-parse HEAD
      - name: Run session ownership and physical field contracts
        run: cargo test --locked -p fullmag-api --bin fullmag-api session::tests --no-fail-fast
      - name: Run older callback magnetization publication contract
        run: cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::v2_older_runtime_m_frame_preserves_newer_selected_source_and_bundle -- --exact
      - name: Run physical row and bundle consistency contract
        run: cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::v2_m_publication_bundle_requires_matching_physical_scalar_row -- --exact
