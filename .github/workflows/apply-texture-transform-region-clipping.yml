name: Apply texture transform and region clipping refactor

on:
  push:
    branches:
      - codex/texture-transform-region-clipping-20260823
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: texture-transform-region-clipping
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/texture-transform-region-clipping-20260823
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Decode and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          payload_dir = Path('.github/fullmag-texture-region-refactor')
          parts = [payload_dir / f'payload.part{index:02d}' for index in range(1, 11)]
          missing = [str(path) for path in parts if not path.is_file()]
          if missing:
              raise RuntimeError(f'missing payload fragments: {missing}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          expected_length = 16368
          expected_sha256 = 'a92bb20c17913409cd97c3506867e7a5f3d4453c43e8d778efc9f93230d012f2'
          actual_sha256 = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if len(encoded) != expected_length or actual_sha256 != expected_sha256:
              raise RuntimeError(
                  'payload verification failed: '
                  f'length={len(encoded)} expected_length={expected_length} '
                  f'sha256={actual_sha256} expected_sha256={expected_sha256}'
              )
          script = zlib.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          script_path = payload_dir / 'apply.py'
          compile(script, str(script_path), 'exec')
          script_path.write_text(script, encoding='utf-8')
          PY
          python .github/fullmag-texture-region-refactor/apply.py

      - name: Format changed Rust files
        run: |
          rustfmt --edition 2021 \
            crates/fullmag-plan/src/lib.rs \
            crates/fullmag-plan/src/region_textures.rs \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/src/mesh.rs \
            crates/fullmag-plan/src/fdm.rs \
            crates/fullmag-plan/src/fem.rs \
            crates/fullmag-plan/src/validate.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs

      - name: Validate focused Rust contracts
        run: |
          set -euo pipefail
          cargo test -p fullmag-plan region_textures
          cargo test -p fullmag-plan fdm_region_textures
          cargo test -p fullmag-plan fem_region_textures
          cargo test -p fullmag-plan --test magnetization_textures_v2_contract
          cargo test -p fullmag-plan --test magnetization_textures_v2_parity
          cargo check -p fullmag-plan -p fullmag-py-core

      - name: Validate full planner regression suite
        run: cargo test -p fullmag-plan

      - name: Validate Python parity and public documentation
        env:
          PYTHONPATH: packages/fullmag-py/src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest -e packages/fullmag-py
          python -m pytest -q \
            packages/fullmag-py/tests/test_preset_texture_v2_parity.py \
            packages/fullmag-py/tests/test_bimeron_textures.py
          python .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
            public_docs/site/python-api/magnets-and-textures/preset-textures.source-map.json \
            --repo-root .
          python -m unittest discover -s packages/fullmag-py/tests \
            -p 'test_public_python_api_documentation.py' -v
          python scripts/check_public_doc_examples.py --root public_docs/site

      - name: Validate existing region texture UI contract
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir apps/control-room exec vitest run \
            src/modules/inspector/panels/ObjectRegionsPanel.test.ts
          pnpm --dir apps/control-room typecheck

      - name: Verify patch hygiene
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            crates/fullmag-plan/src/lib.rs \
            crates/fullmag-plan/src/region_textures.rs \
            crates/fullmag-plan/src/magnetization_textures_v2.rs \
            crates/fullmag-plan/src/mesh.rs \
            crates/fullmag-plan/src/fdm.rs \
            crates/fullmag-plan/src/fem.rs \
            crates/fullmag-plan/src/validate.rs \
            crates/fullmag-plan/tests/magnetization_textures_v2_contract.rs
          git diff --check
          test "$(grep -c 'struct PreparedTextureTransform' crates/fullmag-plan/src/magnetization_textures_v2.rs)" -eq 1
          test "$(grep -c 'fn apply_fem_region_texture_overrides' crates/fullmag-plan/src/fem.rs)" -eq 1
          test "$(grep -c 'fn apply_region_texture_overrides' crates/fullmag-plan/src/fdm.rs)" -eq 1
          test "$(grep -c 'fn sample_region_initial_on_mask' crates/fullmag-plan/src/region_textures.rs)" -eq 1

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fullmag-texture-region-refactor
          rm -f .github/workflows/apply-texture-transform-region-clipping.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit \
            -m 'fix: unify texture transforms and clip regional textures' \
            -m 'Prepare texture transforms once for FDM and FEM, scope FDM overrides to their owning object in single-grid and multilayer plans, materialize FEM region textures on winning nodal masks, and enforce strict clipping at region boundaries.'
          git push origin HEAD:codex/texture-transform-region-clipping-20260823
