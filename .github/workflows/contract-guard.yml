name: contract-guard

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-guards:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Setup just for Linux recipe contract tests
        if: runner.os == 'Linux'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.51.0'
      - name: Check storage paths, links and concurrent writers
        run: python -B scripts/test_fullmag_storage.py
      - name: Check Windows launcher refusal before writes
        run: python -B scripts/test_windows_storage_preflight.py
      - name: Check private group storage and source-only build identity
        env:
          PYTHONPATH: scripts
        run: >-
          python -B -m unittest
          test_docker_group_storage test_docker_group_backend_cache
          test_docker_group_ledger test_docker_cache_retirement
          test_docker_compose_identity.SourceOnlyComposeIdentityTests
          test_backend_group_cache_cleanup test_docker_group_frontend_seed
          test_docker_dev_defaults test_bootstrap_docker_toolchain
          test_docker_volume_post_build_integration
      - name: Check Linux data-volume copy and admission contracts
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: scripts
        run: >-
          python -B -m unittest
          scripts.test_fullmag_data_volume scripts.test_fullmag_data_volume_manifest
          scripts.test_fullmag_data_volume_fs scripts.test_fullmag_data_volume_guard
          scripts.test_fullmag_data_volume_pending
          scripts.test_fullmag_data_volume_runtime_binding
          scripts.test_linux_native_data_volume_migration scripts.test_linux_native_host
          scripts.test_fullmag_data_volume_admission
          scripts.test_linux_native_readmission scripts.test_docker_linux_native_readmission
          scripts.test_linux_native_probe scripts.test_docker_dev_storage
          scripts.test_fullmag_data_volume_journal scripts.test_docker_dev_data_volume
          scripts.test_fullmag_data_volume_linux_request scripts.test_linux_data_volume_provision
          scripts.test_linux_data_volume_format scripts.test_docker_data_volume_linux
          scripts.test_linux_data_volume_copy scripts.test_fullmag_data_volume_bind
          scripts.test_linux_data_volume_bind
          scripts.test_docker_data_volume_stopped_group scripts.test_docker_data_volume_copy_job
          scripts.test_docker_data_volume_copy_job_contracts scripts.test_docker_dev_data_volume_copy
          scripts.test_docker_data_volume_bind_job scripts.test_docker_dev_data_volume_bind
          scripts.test_docker_data_volume_relocated
          scripts.test_just_data_volume_shell
          scripts.test_data_volume_stopped_windows_bind
          scripts.test_data_volume_released_state scripts.test_data_volume_copy_fences
          scripts.test_data_volume_copy_fence_service scripts.test_docker_data_volume_copy_guard
          scripts.test_docker_volume_cold_budget_restore scripts.test_docker_volume_startup_diagnostic_restart
      - name: Check frontend cleanup boundaries
        run: node --test scripts/clean-control-room-next.test.mjs

  canonicalization-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prefer canonical Ubuntu apt mirrors
        uses: ./.github/actions/ubuntu-apt

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run contract guard checks
        run: ./scripts/ci/contract_guard.sh --strict

      - name: Revalidate scientific documentation against current source
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            python3 .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py \
              "$manifest" --repo-root .
          done < <(find public_docs/site -name '*.source-map.json' -print0)

      - name: Validate Schur observability and R4 source contracts
        run: |
          python3 .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/poisson-airbox-schur-execution-observability.source-map.json --repo-root .
          python3 .agents/skills/scientific-documentation-contract/scripts/validate_scientific_docs.py docs/physics/r4-linearization-identity-v2.source-map.json --repo-root .
