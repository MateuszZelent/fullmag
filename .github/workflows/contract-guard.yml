name: contract-guard

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  canonicalization-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run contract guard checks
        run: ./scripts/ci/contract_guard.sh --strict

      - name: Revalidate all scientific documentation source maps
        run: >-
          python3 .agents/skills/scientific-documentation-contract/scripts/validate_changed_scientific_docs.py
          --all --head HEAD --repo-root .
