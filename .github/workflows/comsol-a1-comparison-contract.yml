name: COMSOL A1 comparison contract

on:
  push:
    paths:
      - scripts/compare_comsol_a1_frequency_reference.py
      - scripts/test_compare_comsol_a1_frequency_reference.py
      - .github/workflows/comsol-a1-comparison-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frequency-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install comparison test dependencies
        run: python -m pip install 'pytest>=9,<10' 'matplotlib>=3,<4'
      - name: Run actual receipt and optional-residual regressions
        run: python -m pytest -v scripts/test_compare_comsol_a1_frequency_reference.py
