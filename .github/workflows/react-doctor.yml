# React Doctor performs a manual, advisory scan of the selected ref.
# Workflow-dispatch runs scan the full checkout and report in the job summary.
# Docs: https://www.react.doctor/docs/reference/github-action-reference

name: React Doctor manual scan
run-name: "React Doctor manual scan (${{ github.ref_name }})"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: Scan the selected ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7

      - name: Scan with React Doctor
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2
        with:
          blocking: none
          scope: full
          comment: false
          review-comments: false
          commit-status: false
