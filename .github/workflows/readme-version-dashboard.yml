name: README version dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-version-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate version dashboard
        run: python3 scripts/update_readme_version_dashboard.py --write

      - name: Commit synchronized README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- readme.md; then
            echo "README version dashboard is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git commit -m "docs: sync README version dashboard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
