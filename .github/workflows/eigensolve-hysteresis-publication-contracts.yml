name: eigensolve-hysteresis-publication-contracts

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/fullmag-runner/src/autosave_zarr.rs'
      - 'crates/fullmag-runner/src/hysteresis.rs'
      - 'crates/fullmag-authoring/src/scene.rs'
      - 'crates/fullmag-runner/src/lib.rs'
      - 'crates/fullmag-runner/src/antenna_field_solution.rs'
      - 'crates/fullmag-runner/src/antenna_stage.rs'
      - 'crates/fullmag-ir/tests/ir_tests.rs'
      - 'scripts/fullmag_storage.py'
      - '.github/workflows/eigensolve-hysteresis-publication-contracts.yml'
  pull_request:
    paths:
      - 'crates/fullmag-runner/src/autosave_zarr.rs'
      - 'crates/fullmag-runner/src/hysteresis.rs'
      - 'crates/fullmag-authoring/src/scene.rs'
      - 'crates/fullmag-runner/src/lib.rs'
      - 'crates/fullmag-runner/src/antenna_field_solution.rs'
      - 'crates/fullmag-runner/src/antenna_stage.rs'
      - 'crates/fullmag-ir/tests/ir_tests.rs'
      - 'scripts/fullmag_storage.py'
      - '.github/workflows/eigensolve-hysteresis-publication-contracts.yml'

jobs:
  atomic-progress-publication:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux-host
          - os: windows-latest
            profile: windows-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve canonical managed storage
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          layout = json.loads(subprocess.check_output([
              sys.executable, "-B", "scripts/fullmag_storage.py", "resolve",
              "--profile", "${{ matrix.profile }}", "--create",
          ], text=True))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name in ("FULLMAG_PROJECT_STORAGE_ROOT", "FULLMAG_BUILD_ROOT"):
                  environment.write(f"{name}={layout['env'][name]}\n")
          print(json.dumps({key: layout[key] for key in (
              "repo_root", "project_root", "storage_root", "build_root", "profile",
          )}, indent=2))
      - name: Prepare managed Cargo paths
        shell: bash
        run: python -B scripts/fullmag_storage.py prepare-links --profile '${{ matrix.profile }}' --compat
      - uses: Swatinem/rust-cache@v2
      - name: Verify atomic writer and progressive hysteresis publication
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/fullmag_storage.py run --profile '${{ matrix.profile }}' -- cargo test --locked -p fullmag-runner --lib autosave_zarr::tests -- --nocapture | tee "$RUNNER_TEMP/atomic-json-writer.log"
          grep -F 'autosave_zarr::tests::atomic_json_failure_preserves_target_and_removes_only_its_temporary ... ok' "$RUNNER_TEMP/atomic-json-writer.log"
          python -B scripts/fullmag_storage.py run --profile '${{ matrix.profile }}' -- cargo test --locked -p fullmag-runner --lib hysteresis::tests::progress_artifact_writer_replaces_complete_json_and_preserves_it_on_failure -- --nocapture | tee "$RUNNER_TEMP/hysteresis-atomic-progress.log"
          grep -F 'hysteresis::tests::progress_artifact_writer_replaces_complete_json_and_preserves_it_on_failure ... ok' "$RUNNER_TEMP/hysteresis-atomic-progress.log"
      - name: Verify standalone inspection parallel admission
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/fullmag_storage.py run --profile '${{ matrix.profile }}' -- cargo test --locked -p fullmag-runner --lib adaptive_parallel_rejects_standalone_antenna_inspection_but_serial_remains_supported -- --nocapture | tee "$RUNNER_TEMP/antenna-adaptive-admission.log"
          grep -F 'adaptive_parallel_rejects_standalone_antenna_inspection_but_serial_remains_supported ... ok' "$RUNNER_TEMP/antenna-adaptive-admission.log"
      - name: Verify antenna integrity classification and cancellation publication
        shell: bash
        run: |
          set -euo pipefail
          for test_name in rejects_tampered_manifest_and_field_payload referenced_payload_verifier_distinguishes_hash_size_and_finite_failures interruptible_publication_rejects_cancel_before_atomic_rename; do
            python -B scripts/fullmag_storage.py run --profile '${{ matrix.profile }}' -- cargo test --locked -p fullmag-runner --lib "$test_name" -- --nocapture | tee "$RUNNER_TEMP/$test_name.log"
            grep -F "$test_name ... ok" "$RUNNER_TEMP/$test_name.log"
          done
      - name: Verify complete runner compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: python -B scripts/fullmag_storage.py run --profile '${{ matrix.profile }}' -- cargo test --locked -p fullmag-runner --lib --no-fail-fast
      - name: Preserve publication regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hysteresis-publication-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/atomic-json-writer.log
            ${{ runner.temp }}/hysteresis-atomic-progress.log
            ${{ runner.temp }}/antenna-adaptive-admission.log
            ${{ runner.temp }}/rejects_tampered_manifest_and_field_payload.log
            ${{ runner.temp }}/referenced_payload_verifier_distinguishes_hash_size_and_finite_failures.log
            ${{ runner.temp }}/interruptible_publication_rejects_cancel_before_atomic_rename.log
            ${{ env.FULLMAG_BUILD_ROOT }}/build-status.json
          if-no-files-found: error
